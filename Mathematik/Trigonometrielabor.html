<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trigonometrielabor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday school lab, calm and exact, legible on a projector
   IDEA the geometry set on the desk: compass circle, set square, graph paper, the calculator display
   PICTURE the live canvas (unit circle, unrolling curve, right triangle, sine graph, general triangle)
   COLOUR white ground, dark ink; sine red, cosine blue, tangent violet, angle amber, the same in every station
   TYPE Atkinson Hyperlegible
   LAYOUT laptop: experiments | stage | panel; phone: stage, panel, experiments */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#10161b);--ink:light-dark(#14212b,#e6ecf1);--mut:light-dark(#5a6772,#9babb7);--line:light-dark(#dde3e8,#29343d);--pan:light-dark(#f2f5f7,#18212a);--red:light-dark(#df4329,#ff6b4f);--blue:light-dark(#2762c9,#6198ff);--vio:light-dark(#7b3cc4,#bb90ff);--amb:light-dark(#c27a0e,#f2b443);--fld:light-dark(#ffffff,#0c1115);--ok:light-dark(#1f7a4d,#53c98a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
button,select,input{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{flex:none}
h1{font-size:26px;line-height:1.05;margin:0;letter-spacing:-.02em}
h1 a{color:inherit;text-decoration:none}
h1 a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.tabs{display:flex;gap:3px;background:var(--pan);padding:4px;border-radius:12px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 11px;border-radius:9px;cursor:pointer;font-weight:700;min-height:40px}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.btn{border:1px solid var(--line);background:var(--bg);padding:7px 12px;border-radius:9px;cursor:pointer;min-height:38px;white-space:nowrap}
.btn:hover{border-color:var(--mut)}
.btn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.hot{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.lvl{display:flex;gap:3px;background:var(--pan);padding:4px;border-radius:12px}
.lvl button{border:0;background:none;padding:6px 9px;border-radius:8px;cursor:pointer;font-size:14px;min-height:34px}
.lvl button[aria-pressed=true]{background:var(--bg);box-shadow:0 0 0 1px var(--line);font-weight:700}
main{display:grid;grid-template-columns:250px minmax(0,1fr) 330px;min-height:0}
#lib{overflow:auto;border-right:1px solid var(--line);padding:12px}
#lib h2{font-size:13px;color:var(--mut);margin:14px 4px 6px;font-weight:700}
#lib h2:first-child{margin-top:2px}
.pre{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px}
.pre b{display:block;font-size:15px}
.pre span{display:block;font-size:13px;color:var(--mut);line-height:1.3}
.pre:hover{background:var(--pan)}
.pre[aria-current=true]{background:var(--pan);box-shadow:inset 3px 0 0 var(--red)}
#stage{display:flex;flex-direction:column;min-height:0}
#tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);min-height:55px}
#cvw{position:relative;flex:1;min-height:320px;background:var(--fld)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#status{font-size:13px;color:var(--mut);padding:5px 12px;border-top:1px solid var(--line);min-height:28px}
#panel{overflow:auto;border-left:1px solid var(--line);padding:6px 14px 20px}
.card{border-bottom:1px solid var(--line);padding:10px 0 12px}
.card:last-child{border-bottom:0}
.card h3{font-size:17px;margin:0 0 6px;line-height:1.2}
.card p{margin:4px 0}
.obs{background:var(--pan);border-radius:10px;padding:9px 11px;margin:6px 0}
details summary{cursor:pointer;font-weight:700;margin-top:6px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;margin:8px 0 2px;font-size:14px}
.row output{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--red);height:26px;margin:0}
.seg{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.seg button{flex:1 1 auto;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;cursor:pointer;min-height:36px;font-size:14px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chk{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px}
.chk label{display:flex;align-items:center;gap:6px;min-height:32px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--red)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;font-size:15px;margin-top:6px}
.kv b{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.formel{background:var(--pan);border-radius:10px;padding:9px 11px;font-size:15px;line-height:1.7;margin-top:6px;font-variant-numeric:tabular-nums}
.small{font-size:13px;color:var(--mut)}
.big{font-size:clamp(30px,4vw,42px);font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.inp{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--bg);font-size:16px;min-height:40px;width:9em;flex:1 1 8em}
.res{font-weight:700;margin-top:6px}
.res.ok{color:var(--ok)}.res.no{color:var(--red)}
.s{color:var(--red);font-weight:700}.c{color:var(--blue);font-weight:700}.t{color:var(--vio);font-weight:700}.w{color:var(--amb);font-weight:700}
#probe{display:none}
@media(max-width:1150px){main{grid-template-columns:215px minmax(0,1fr) 300px}.tabs button{padding:8px 8px}}
@media(max-width:900px){
  html,body,#app{height:auto}
  main{grid-template-columns:minmax(0,1fr)}
  #stage{order:1}
  #cvw{flex:none;height:min(64vh,560px)}
  #panel{order:2;border:0;border-top:1px solid var(--line);overflow:visible}
  #lib{order:3;border:0;border-top:1px solid var(--line);overflow:visible}
  h1{font-size:22px}
}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="15" cy="19" r="12" stroke="currentColor" stroke-width="2.6" fill="none"/><path d="M15 19H24" stroke="#2762c9" stroke-width="3.2" stroke-linecap="round"/><path d="M24 19V11" stroke="#df4329" stroke-width="3.2" stroke-linecap="round"/><path d="M15 19L24 11" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
    <h1><a href="../index.html" title="Zur Startseite">Trigonometrielabor</a></h1>
  </div>
  <nav class="tabs" role="tablist" aria-label="Stationen">
    <button role="tab" data-mode="kreis">Einheitskreis</button>
    <button role="tab" data-mode="kurve">Vom Kreis zur Kurve</button>
    <button role="tab" data-mode="dreieck">Rechtwinkeliges Dreieck</button>
    <button role="tab" data-mode="funktion">Sinusfunktion</button>
    <button role="tab" data-mode="saetze">Sinus- &amp; Kosinussatz</button>
  </nav>
  <div class="lvl" role="group" aria-label="Niveau"><button data-lvl="1">Einfach</button><button data-lvl="2">Mittel</button><button data-lvl="3">Anspruchsvoll</button></div>
  <button class="btn" id="bFull">Vollbild</button>
</header>
<main>
  <aside id="lib" aria-label="Versuche"></aside>
  <section id="stage">
    <div id="tools"></div>
    <div id="cvw"><canvas id="cv" aria-label="Simulation"></canvas></div>
    <div id="status"></div>
  </section>
  <aside id="panel" aria-label="Einstellungen"></aside>
</main>
</div>
<div id="probe"></div>
<script>
{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const cv=$('#cv'),ctx=cv.getContext('2d'),PN=$('#panel'),TL=$('#tools');
let CW=1,CH=1;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const PI=Math.PI,TAU=PI*2,DEG=PI/180;
const mod=(x,m)=>((x%m)+m)%m;
const F=(v,d=2)=>{if(!Number.isFinite(v))return '–';if(Math.abs(v)<.5*10**-d)v=0;return v.toLocaleString('de-AT',{minimumFractionDigits:d,maximumFractionDigits:d}).replace('-','−')};
const FD=(r,d=0)=>F(r/DEG,d)+'°';
const FDs=r=>{const d=r/DEG;return (Math.abs(d-Math.round(d))<.05?F(Math.round(d),0):F(d,1))+'°'};
const nf=v=>{const r=Math.round(v*100)/100;return Number.isInteger(r)?F(r,0):Math.abs(r*10-Math.round(r*10))<1e-9?F(r,1):F(r,2)};
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a}
function piFmt(v,n=12){const k=Math.round(v/PI*n);if(Math.abs(k*PI/n-v)>1e-6)return null;if(k===0)return '0';const g=gcd(k,n),p=k/g,q=n/g,a=Math.abs(p);return (p<0?'−':'')+(a===1?'':a)+'π'+(q===1?'':'/'+q)}
const FONT='"Atkinson Hyperlegible",system-ui,sans-serif';
const MODES={},APP={mode:'',frame:0,lvl:2};
const lvlShow=n=>APP.lvl>=n;
const FN={sin:Math.sin,cos:Math.cos,tan:Math.tan},FC={sin:'red',cos:'blue',tan:'vio'};

/* ---------- Farben und Zeichnen ---------- */
const C={};
const rgb=s=>{const m=s.match(/[\d.]+/g)||[0,0,0];return [+m[0],+m[1],+m[2]]};
const cs=(k,a)=>a==null?`rgb(${C[k].join(',')})`:`rgba(${C[k].join(',')},${a})`;
function readCols(){const pr=$('#probe');for(const k of ['bg','ink','mut','line','pan','red','blue','vio','amb','fld','ok']){pr.style.color=`var(--${k})`;C[k]=rgb(getComputedStyle(pr).color)}}
function txt(s,x,y,col,al='left',size=13,bold=false){ctx.font=`${bold?'700 ':''}${size}px ${FONT}`;const w=ctx.measureText(s).width,l=al==='left'?x:al==='right'?x-w:x-w/2;if(l<4)x+=4-l;else if(l+w>CW-4)x-=l+w-CW+4;ctx.textAlign=al;ctx.lineJoin='round';ctx.lineWidth=4;ctx.strokeStyle=cs('fld',.92);ctx.strokeText(s,x,y);ctx.fillStyle=col;ctx.fillText(s,x,y)}
function line(x1,y1,x2,y2,col,w=1,dash){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';if(dash)ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();if(dash)ctx.setLineDash([])}
function dot(x,y,r,col,ring){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=col;ctx.fill();if(ring){ctx.lineWidth=2.5;ctx.strokeStyle=cs('fld');ctx.stroke()}}
function ringDot(x,y,r,col){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=cs('fld');ctx.fill();ctx.lineWidth=2.2;ctx.strokeStyle=col;ctx.stroke()}
function bg(){ctx.fillStyle=cs('fld');ctx.fillRect(0,0,CW,CH)}
function wedge(x,y,r,t1,t2,ccw,col,fill){ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,r,t1,t2,ccw);ctx.closePath();if(fill){ctx.fillStyle=cs(col,fill);ctx.fill()}ctx.beginPath();ctx.arc(x,y,r,t1,t2,ccw);ctx.strokeStyle=cs(col);ctx.lineWidth=2.2;ctx.stroke()}
function plot(x0,y0,x1,y1,xmin,xmax,ymin,ymax){const sx=(x1-x0)/(xmax-xmin),sy=(y1-y0)/(ymax-ymin);return {x0,y0,x1,y1,xmin,xmax,ymin,ymax,sx,sy,X:x=>x0+(x-xmin)*sx,Y:y=>y1-(y-ymin)*sy,ix:px=>xmin+(px-x0)/sx}}
function axes(pl,o={}){const {X,Y}=pl,st=PI/2;
  ctx.save();ctx.beginPath();ctx.rect(pl.x0,pl.y0,pl.x1-pl.x0,pl.y1-pl.y0);ctx.clip();
  for(let k=Math.ceil(pl.xmin/st-1e-9);k*st<=pl.xmax+1e-9;k++)line(X(k*st),pl.y0,X(k*st),pl.y1,cs('line'),1);
  for(let y=Math.ceil(pl.ymin);y<=pl.ymax;y++)line(pl.x0,Y(y),pl.x1,Y(y),cs('line'),1);
  ctx.restore();
  const y0=clamp(Y(0),pl.y0,pl.y1),x0=clamp(X(0),pl.x0,pl.x1);
  line(pl.x0,y0,pl.x1,y0,cs('ink'),1.5);line(x0,pl.y0,x0,pl.y1,cs('ink'),1.5);
  const every=Math.max(1,Math.ceil(44/(st*pl.sx)));
  for(let k=Math.ceil(pl.xmin/st-1e-9);k*st<=pl.xmax+1e-9;k++){if(k===0||k%every)continue;const v=k*st;txt(o.rad?piFmt(v,12):F(v/DEG,0)+'°',X(v),y0+16,cs('mut'),'center',12)}
  for(let y=Math.ceil(pl.ymin);y<=pl.ymax;y++){if(y===0)continue;txt(F(y,0),x0-6,Y(y)+4,cs('mut'),'right',12)}
  txt('x',pl.x1-4,y0-8,cs('mut'),'right',13,true);txt('y',x0+7,pl.y0+12,cs('mut'),'left',13,true)}
function curve(pl,f,col,w=2.5,a=pl.xmin,b=pl.xmax,dash){if(b<=a)return;ctx.save();ctx.beginPath();ctx.rect(pl.x0,pl.y0-2,pl.x1-pl.x0,pl.y1-pl.y0+4);ctx.clip();
  ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineJoin='round';ctx.lineCap='round';if(dash)ctx.setLineDash(dash);ctx.beginPath();
  const N=Math.max(2,Math.ceil((pl.X(b)-pl.X(a))/1.5)),span=pl.ymax-pl.ymin;let pen=false,prev=null;
  for(let i=0;i<=N;i++){const x=a+(b-a)*i/N,v=f(x);if(!Number.isFinite(v)||Math.abs(v)>60){pen=false;prev=null;continue}
    if(pen&&prev!==null&&Math.abs(v-prev)>span)pen=false;const px=pl.X(x),py=pl.Y(v);if(pen)ctx.lineTo(px,py);else{ctx.moveTo(px,py);pen=true}prev=v}
  ctx.stroke();ctx.restore()}

/* ---------- Bedienfeld ---------- */
const range=(id,label,min,max,step,val)=>`<div class="row"><label for="${id}">${label}</label><output id="${id}-o"></output></div><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}">`;
const seg=(key,opts,cur)=>`<div class="seg" role="group">${opts.map(([l,v])=>`<button data-${key}="${v}" aria-pressed="${String(v)===String(cur)}">${l}</button>`).join('')}</div>`;
const chk=(id,label,on)=>`<label><input type="checkbox" id="${id}"${on?' checked':''}> ${label}</label>`;
const infoCard=p=>`<div class="card"><h3>${p.t}</h3><div class="obs"><b>Beobachte:</b> ${p.obs}</div><details><summary>Was passiert?</summary><p>${p.why}</p></details></div>`;
const setOut=(id,t)=>{const o=$('#'+id+'-o');if(o)o.textContent=t};
const setTxt=(id,t)=>{const o=$('#'+id);if(o)o.textContent=t};
const setHTML=(id,t)=>{const o=$('#'+id);if(o&&o.innerHTML!==t)o.innerHTML=t};
const syncRange=(id,v)=>{const r=$('#'+id);if(r&&document.activeElement!==r)r.value=v};
function groupBy(arr){const g=[];for(const p of arr){let x=g.find(q=>q.h===p.g);if(!x)g.push(x={h:p.g,items:[]});x.items.push(p)}return g}
function renderLib(title,arr,cur,pick){let i=0;
  $('#lib').innerHTML=`<h2>${title}</h2>`+groupBy(arr).map(g=>`<h2>${g.h}</h2>`+g.items.map(p=>`<button class="pre" data-i="${i++}" aria-current="${i-1===cur}"><b>${p.t}</b><span>${p.d}</span></button>`).join('')).join('');
  $('#lib').onclick=e=>{const b=e.target.closest('.pre');if(b){pick(+b.dataset.i);if(innerWidth<900)$('#stage').scrollIntoView({behavior:'smooth'})}}}
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* exakte Werte der besonderen Winkel */
const EXV={0:['0','1','0'],30:['1/2','√3/2','√3/3'],45:['√2/2','√2/2','1'],60:['√3/2','1/2','√3'],90:['1','0','–']};
function exact(rad){const d0=rad/DEG,d=Math.round(d0);if(Math.abs(d-d0)>1e-6)return null;const x=mod(d,360);let r;if(x<=90)r=x;else if(x<=180)r=180-x;else if(x<=270)r=x-180;else r=360-x;if(!(r in EXV))return null;
  const ss=Math.sin(x*DEG),cc=Math.cos(x*DEG),e=EXV[r],wr=(sg,v)=>v==='0'?'0':(sg<0?'−':'')+v;
  return {s:wr(Math.sign(ss),e[0]),c:wr(Math.sign(cc),e[1]),t:Math.abs(cc)<1e-9?'nicht definiert':wr(Math.sign(ss*cc),e[2])}}
const ANG={a:37*DEG};

/* =====================================================================
   STATION 1: EINHEITSKREIS
   ===================================================================== */
const K={pi:0,init:false,snap:true,tan:false,sign:false,sym:false,bogen:false,play:false,drag:false,task:null};
const KP=[
 {g:'Grundlagen',t:'Sinus und Kosinus am Kreis',d:'Die Koordinaten des Punktes P',s:{a:37},
  obs:'Ziehe den Punkt P auf dem Kreis. Wie verändern sich die rote und die blaue Strecke? Bei welchem Winkel ist sin α am größten, wann ist cos α null?',
  why:'Der Einheitskreis hat den Radius 1. Für den Punkt P zum Winkel α gilt: Die x-Koordinate ist cos α, die y-Koordinate ist sin α. Bei 90° liegt P ganz oben, darum ist sin 90° = 1 und cos 90° = 0. Weil P den Kreis nie verlässt, liegen sin α und cos α immer zwischen −1 und 1.'},
 {g:'Grundlagen',t:'Tangens am Kreis',d:'Die Strecke auf der Tangente',s:{a:40,tan:true},
  obs:'Drehe α langsam auf 90°. Was passiert mit der violetten Strecke? Und was passiert knapp über 90°?',
  why:'Verlängert man den Radius bis zur senkrechten Tangente bei x = 1, so ist die Höhe des Schnittpunkts tan α. Nach dem Strahlensatz gilt tan α = sin α : cos α. Bei 90° ist der Radius parallel zur Tangente, es gibt keinen Schnittpunkt: tan 90° ist nicht definiert. Knapp darüber springt der Wert von sehr groß positiv auf sehr groß negativ.'},
 {g:'Grundlagen',t:'Pythagoras im Einheitskreis',d:'sin² α + cos² α = 1',s:{a:53},
  obs:'Rote Strecke, blaue Strecke und Radius bilden ein rechtwinkeliges Dreieck. Rechne sin² α + cos² α für verschiedene Winkel nach (Karte „Formeln“ ab Niveau Mittel).',
  why:'Die Katheten sind |cos α| und |sin α|, die Hypotenuse ist der Radius 1. Nach Pythagoras gilt sin² α + cos² α = 1, und zwar für jeden Winkel. So kann man aus sin α den Kosinus berechnen, bis auf das Vorzeichen.'},
 {g:'Ganzer Kreis',t:'Vorzeichen in den Quadranten',d:'Wo sind sin, cos, tan negativ?',s:{a:150,sign:true,tan:true},
  obs:'Drehe P durch alle vier Quadranten. In welchen Quadranten ist der Sinus negativ, in welchen der Kosinus? Wann ist der Tangens positiv?',
  why:'Links von der y-Achse ist die x-Koordinate negativ, also cos α < 0 (II. und III. Quadrant). Unter der x-Achse ist sin α < 0 (III. und IV. Quadrant). Der Tangens ist positiv, wenn sin α und cos α dasselbe Vorzeichen haben: im I. und III. Quadranten.'},
 {g:'Ganzer Kreis',t:'Besondere Winkel',d:'30°, 45° und 60° exakt',s:{a:30},
  obs:'Stelle 30°, 45°, 60° und 90° ein. Ab Niveau Mittel siehst du die exakten Werte. Welche Werte tauchen bei sin und cos „vertauscht“ auf?',
  why:'Bei 45° entsteht ein halbes Quadrat: sin 45° = cos 45° = √2/2 ≈ 0,707. Bei 30° und 60° entsteht ein halbes gleichseitiges Dreieck: sin 30° = 1/2 und sin 60° = √3/2. Weil sich die beiden Winkel auf 90° ergänzen, gilt sin 30° = cos 60°, allgemein sin α = cos(90° − α).'},
 {g:'Ganzer Kreis',t:'Gleicher Sinus, zwei Winkel',d:'Symmetrien am Kreis',s:{a:35,sym:true},
  obs:'Die grauen Punkte haben denselben Sinus, Kosinus oder Tangens wie P. Welcher Punkt liegt genau so hoch wie P? Welcher genau darunter?',
  why:'Spiegelt man P an der y-Achse, bleibt die Höhe gleich: sin(180° − α) = sin α. Spiegelt man an der x-Achse, bleibt die x-Koordinate gleich: cos(360° − α) = cos α. Der gegenüberliegende Punkt 180° + α hat denselben Tangens. Deshalb hat eine Gleichung wie sin α = 0,5 zwischen 0° und 360° zwei Lösungen: 30° und 150°.'},
 {g:'Bogenmaß',t:'Grad und Bogenmaß',d:'Der Winkel als Länge des Bogens',s:{a:57,bogen:true,snap:false},
  obs:'Bei welchem Winkel ist der orange Bogen genau so lang wie der Radius? Wie lang ist der Bogen beim halben Kreis?',

  obs:'Vergleiche den Durchmesser 2r des Umkreises mit den Quotienten a : sin α. Wo liegt der Mittelpunkt M bei einem stumpfwinkeligen Dreieck?',
  why:'Alle drei Quotienten sind gleich dem Durchmesser des Umkreises: a : sin α = 2r. Das folgt aus dem Umfangswinkelsatz. Bei einem stumpfwinkeligen Dreieck liegt M außerhalb, bei einem rechtwinkeligen genau auf der Hypotenuse (Thaleskreis).'},
 {g:'Kosinussatz',t:'Kosinussatz',d:'Pythagoras für jedes Dreieck',s:{P:[[2,1],[10,1],[4,5]]},
  obs:'Ziehe C nach (6 | 5), dort ist γ = 90°. Was passiert mit dem Zusatzglied −2ab · cos γ? Und was passiert bei einem stumpfen γ?',
  why:'Der Kosinussatz c² = a² + b² − 2ab · cos γ verallgemeinert den Satz des Pythagoras. Bei γ = 90° ist cos γ = 0, es bleibt c² = a² + b². Bei spitzem γ ist c² kleiner als a² + b². Bei stumpfem γ ist cos γ negativ und c² größer. Man braucht ihn, wenn zwei Seiten und der eingeschlossene Winkel oder alle drei Seiten bekannt sind.'},
 {g:'Anwendungen',t:'Flächeninhalt',d:'A = ½ · a · b · sin γ',s:{P:[[1,1],[9,1],[3,5.5]],h:true},
  obs:'Vergleiche die Formeln für den Flächeninhalt (die zweite ab Niveau Mittel). Warum braucht die zweite Formel keine Höhe?',
  why:'Die Fläche ist A = c · h_c : 2. Weil h_c = b · sin α ist, gilt auch A = ½ · b · c · sin α, ebenso A = ½ · a · b · sin γ. So berechnet man die Fläche aus zwei Seiten und dem eingeschlossenen Winkel, zum Beispiel bei Grundstücken.'},
 {g:'Anwendungen',t:'Vermessung: Breite eines Flusses',d:'Standlinie und zwei Winkel',s:{P:[[2,1],[9,1],[5,7]],ctx:'fluss'},
  obs:'A und B stehen am Ufer, C ist ein Baum am anderen Ufer. Gemessen werden nur die Standlinie c und die Winkel α und β. Verschiebe den Baum und verfolge die Rechnung.',
  why:'Aus α und β folgt γ = 180° − α − β. Der Sinussatz liefert b = c · sin β : sin γ. Der Abstand des Baumes von der Standlinie ist dann h = b · sin α. So vermisst man Strecken, die man nicht direkt abmessen kann: über Flüsse und Täler oder bis zu Berggipfeln (Triangulation).'}
];
const SU=()=>S.ctx==='fluss'?{k:10,u:'m'}:{k:1,u:'cm'};
function sLoad(i){S.pi=i;const s=SP[i].s;Object.assign(S,{um:false,h:false,ctx:'',snap:true},s);S.P=s.P.map(p=>p.slice());sTools();sPanel();renderLib('Versuche: Sinus- und Kosinussatz',SP,i,sLoad)}
function sTools(){TL.innerHTML=`<span class="small">Dreieck:</span><button class="btn" data-sp="0">spitzwinkelig</button><button class="btn" data-sp="1">rechtwinkelig</button><button class="btn" data-sp="2">stumpfwinkelig</button><button class="btn" data-sp="3">gleichseitig</button>`;
  TL.onclick=e=>{const b=e.target.closest('button');if(!b)return;const L=[[[1,1],[9,1],[5.5,6]],[[2,1],[10,1],[6,5]],[[1,1],[10,1],[2.5,4]],[[2,1],[10,1],[6,1+4*Math.sqrt(3)]]];S.P=L[+b.dataset.sp].map(p=>p.slice())};
  $('#status').textContent='Ziehe die Ecken A, B und C. Ein Rasterkästchen entspricht '+(S.ctx==='fluss'?'10 m.':'1 cm.')}
function sGeo(){const s=Math.min((CW-40)/12,(CH-44)/8.5),ox=(CW-12*s)/2,oy=CH-(CH-8.5*s)/2;return {s,X:u=>ox+u*s,Y:v=>oy-v*s,iu:x=>(x-ox)/s,iv:y=>(oy-y)/s}}
function tri(){const [A,B,Cc]=S.P,d=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1]),a=d(B,Cc),b=d(A,Cc),c=d(A,B),ang=(x,y,z)=>Math.acos(clamp((y*y+z*z-x*x)/(2*y*z),-1,1));
  const al=ang(a,b,c),be=ang(b,a,c),ga=PI-al-be,area=Math.abs((B[0]-A[0])*(Cc[1]-A[1])-(Cc[0]-A[0])*(B[1]-A[1]))/2;return {a,b,c,al,be,ga,area,r:a/(2*Math.sin(al)),hc:2*area/c,ok:area>.05&&a>.05&&b>.05&&c>.05}}
function circum(A,B,Cc){const d=2*(A[0]*(B[1]-Cc[1])+B[0]*(Cc[1]-A[1])+Cc[0]*(A[1]-B[1]));if(Math.abs(d)<1e-9)return null;const a2=A[0]**2+A[1]**2,b2=B[0]**2+B[1]**2,c2=Cc[0]**2+Cc[1]**2;
  return [(a2*(B[1]-Cc[1])+b2*(Cc[1]-A[1])+c2*(A[1]-B[1]))/d,(a2*(Cc[0]-B[0])+b2*(A[0]-Cc[0])+c2*(B[0]-A[0]))/d]}
function sDraw(){bg();const {s,X,Y}=sGeo(),T=tri(),[A,B,Cc]=S.P,sc=p=>[X(p[0]),Y(p[1])],pA=sc(A),pB=sc(B),pC=sc(Cc),U=SU();
  ctx.save();ctx.strokeStyle=cs('line');ctx.lineWidth=1;ctx.beginPath();for(let u=0;u<=12;u++){ctx.moveTo(X(u),Y(0));ctx.lineTo(X(u),Y(8.5))}for(let v=0;v<=8;v++){ctx.moveTo(X(0),Y(v));ctx.lineTo(X(12),Y(v))}ctx.stroke();ctx.restore();
  if(S.ctx==='fluss'){ctx.fillStyle=cs('blue',.14);ctx.fillRect(X(0),Y(6),12*s,4*s);for(let v=2.8;v<6;v+=1){ctx.beginPath();for(let u=0;u<=12;u+=.1){const x=X(u),y=Y(v)+Math.sin(u*3)*3;u?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.strokeStyle=cs('blue',.3);ctx.lineWidth=1.3;ctx.stroke()}
    line(X(0),Y(2),X(12),Y(2),cs('mut'),2);line(X(0),Y(6),X(12),Y(6),cs('mut'),2);txt('Fluss',X(.3),Y(4)+5,cs('blue'),'left',14,true);
    line(pC[0]+22,pC[1],pC[0]+22,pC[1]-10,'#8a5a2b',4);dot(pC[0]+22,pC[1]-18,11,'rgba(63,143,79,.85)')}
  const M=circum(A,B,Cc);if(S.um&&M&&T.ok&&T.r<40){ctx.setLineDash([6,5]);ctx.strokeStyle=cs('vio',.8);ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(X(M[0]),Y(M[1]),T.r*s,0,TAU);ctx.stroke();ctx.setLineDash([]);
    line(X(M[0]),Y(M[1]),pA[0],pA[1],cs('vio',.7),1.3);dot(X(M[0]),Y(M[1]),4,cs('vio'));txt('M',X(M[0])+7,Y(M[1])-6,cs('vio'),'left',13,true);txt('r',(X(M[0])+pA[0])/2+6,(Y(M[1])+pA[1])/2-4,cs('vio'),'left',13,true)}
  ctx.beginPath();ctx.moveTo(...pA);ctx.lineTo(...pB);ctx.lineTo(...pC);ctx.closePath();ctx.fillStyle=cs('pan',.75);ctx.fill();
  if(S.h&&T.ok){const dx=B[0]-A[0],dy=B[1]-A[1],t=((Cc[0]-A[0])*dx+(Cc[1]-A[1])*dy)/(dx*dx+dy*dy),Fp=[A[0]+t*dx,A[1]+t*dy],pF=sc(Fp);
    if(t<0)line(...pA,...pF,cs('mut'),1.3,[4,4]);if(t>1)line(...pB,...pF,cs('mut'),1.3,[4,4]);line(...pC,...pF,cs('amb'),2.2,[6,4]);
    const L=Math.hypot(pB[0]-pA[0],pB[1]-pA[1]),ux=(pB[0]-pA[0])/L,uy=(pB[1]-pA[1])/L,Lc=Math.hypot(pC[0]-pF[0],pC[1]-pF[1])||1,vx=(pC[0]-pF[0])/Lc,vy=(pC[1]-pF[1])/Lc,q=9;
    ctx.strokeStyle=cs('amb');ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(pF[0]+ux*q,pF[1]+uy*q);ctx.lineTo(pF[0]+ux*q+vx*q,pF[1]+uy*q+vy*q);ctx.lineTo(pF[0]+vx*q,pF[1]+vy*q);ctx.stroke();
    txt((S.ctx==='fluss'?'h':'h_c')+' = '+F(T.hc*U.k,2)+' '+U.u,(pC[0]+pF[0])/2+8,(pC[1]+pF[1])/2+4,cs('amb'),'left',13,true)}
  const sides=[[pB,pC,'a',T.a,'red'],[pC,pA,'b',T.b,'blue'],[pA,pB,'c',T.c,'vio']],g=[(pA[0]+pB[0]+pC[0])/3,(pA[1]+pB[1]+pC[1])/3];
  for(const [p,q,n,v,col] of sides){line(...p,...q,cs(col),3.5);const m=[(p[0]+q[0])/2,(p[1]+q[1])/2];let dx=m[0]-g[0],dy=m[1]-g[1];const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
    txt(n+' = '+F(v*U.k,2)+' '+U.u,m[0]+dx*20,m[1]+dy*20+5,cs(col),Math.abs(dx)<.35?'center':dx>0?'left':'right',14,true)}
  const ver=[[pA,pB,pC,'A','α',T.al,'red'],[pB,pC,pA,'B','β',T.be,'blue'],[pC,pA,pB,'C','γ',T.ga,'vio']];
  for(const [p,q1,q2,n,gr,v,col] of ver){const t1=Math.atan2(q1[1]-p[1],q1[0]-p[0]),t2=Math.atan2(q2[1]-p[1],q2[0]-p[0]);let a1=t1,df=mod(t2-t1,TAU);if(df>PI){a1=t2;df=TAU-df}
    const r=Math.max(10,Math.min(28,Math.hypot(q1[0]-p[0],q1[1]-p[1])*.3,Math.hypot(q2[0]-p[0],q2[1]-p[1])*.3));
    if(T.ok){if(Math.abs(v-PI/2)<.004){const u1=[Math.cos(a1),Math.sin(a1)],u2=[Math.cos(a1+df),Math.sin(a1+df)],q=r*.6;ctx.beginPath();ctx.moveTo(p[0]+u1[0]*q,p[1]+u1[1]*q);ctx.lineTo(p[0]+(u1[0]+u2[0])*q,p[1]+(u1[1]+u2[1])*q);ctx.lineTo(p[0]+u2[0]*q,p[1]+u2[1]*q);ctx.strokeStyle=cs(col);ctx.lineWidth=2;ctx.stroke();dot(p[0]+(u1[0]+u2[0])*q*.5,p[1]+(u1[1]+u2[1])*q*.5,2,cs(col))}
      else wedge(p[0],p[1],r,a1,a1+df,false,col,.18);
      const bi=a1+df/2,rr=r+(df<.6?46:df<1.2?36:28);txt(gr+' = '+F(v/DEG,lvlShow(2)?1:0)+'°',p[0]+Math.cos(bi)*rr,p[1]+Math.sin(bi)*rr+5,cs(col),'center',13,true)}
    let dx=p[0]-g[0],dy=p[1]-g[1];const l=Math.hypot(dx,dy)||1;dot(...p,8,cs('ink'),true);txt(n,p[0]+dx/l*20,p[1]+dy/l*20+5,cs('ink'),'center',15,true)}
  if(!T.ok)txt('Die drei Punkte liegen auf einer Geraden: kein Dreieck.',X(6),Y(8.5)+18,cs('red'),'center',14,true)}
function sDown(x,y){const {X,Y}=sGeo();let best=-1,bd=34;S.P.forEach((p,i)=>{const d=Math.hypot(X(p[0])-x,Y(p[1])-y);if(d<bd){bd=d;best=i}});S.drag=best;sMove(x,y)}
function sMove(x,y){if(S.drag<0)return;const {iu,iv}=sGeo();let u=clamp(iu(x),0,12),v=clamp(iv(y),0,8.5);if(S.snap){u=Math.round(u*2)/2;v=Math.round(v*2)/2}S.P[S.drag]=[u,v]}
function sPanel(){const p=SP[S.pi];
  PN.innerHTML=infoCard(p)+`<div class="card"><h3>Seiten und Winkel</h3><div class="kv" id="sV"></div><div class="formel" id="sW"></div></div>
   <div class="card"><h3>Anzeigen</h3><div class="chk">${chk('sSn','Einrasten (halbes Kästchen)',S.snap)}${chk('sUm','Umkreis',S.um)}${chk('sH','Höhe h_c',S.h)}</div></div>
   ${lvlShow(2)?'<div class="card"><h3>Sinussatz</h3><div class="formel" id="sSin"></div></div><div class="card"><h3>Kosinussatz</h3><div class="formel" id="sCos"></div></div>':''}
   <div class="card"><h3>Flächeninhalt</h3><div class="formel" id="sA"></div></div>
   ${S.ctx==='fluss'?'<div class="card"><h3>Vermessung</h3><div class="formel" id="sFl"></div></div>':''}`;
  PN.oninput=()=>{};PN.onclick=()=>{};
  PN.onchange=e=>{const m={sSn:'snap',sUm:'um',sH:'h'}[e.target.id];if(m)S[m]=e.target.checked}}
function sUpd(){const T=tri(),U=SU(),k=U.k,u=' '+U.u,L=v=>F(v*k,2),G1=v=>F(v/DEG,1)+'°';
  if(!T.ok){setHTML('sV','<span>Kein Dreieck</span><b>–</b>');setHTML('sW','Ziehe eine Ecke von der Geraden weg.');['sSin','sCos','sA','sFl'].forEach(i=>setHTML(i,'–'));return}
  setHTML('sV',`<span class="s">a</span><b>${L(T.a)+u}</b><span class="c">b</span><b>${L(T.b)+u}</b><span class="t">c</span><b>${L(T.c)+u}</b><span class="s">α</span><b>${G1(T.al)}</b><span class="c">β</span><b>${G1(T.be)}</b><span class="t">γ</span><b>${G1(T.ga)}</b>`);
  setHTML('sW',`α + β + γ = ${G1(T.al)} + ${G1(T.be)} + ${G1(T.ga)} = 180°`);
  if($('#sSin')){let h=`<span class="s">a : sin α</span> = ${L(T.a)} : ${F(Math.sin(T.al),3)} = ${F(T.a*k/Math.sin(T.al),2)}<br><span class="c">b : sin β</span> = ${L(T.b)} : ${F(Math.sin(T.be),3)} = ${F(T.b*k/Math.sin(T.be),2)}<br><span class="t">c : sin γ</span> = ${L(T.c)} : ${F(Math.sin(T.ga),3)} = ${F(T.c*k/Math.sin(T.ga),2)}`;
    if(lvlShow(3))h+=`<br>Durchmesser des Umkreises: 2r = ${F(2*T.r*k,2)}`;setHTML('sSin',h)}
  if($('#sCos')){const cg=Math.cos(T.ga);let h=`c² = a² + b² − 2ab · cos γ<br>${F((T.c*k)**2,2)} = ${F((T.a*k)**2,2)} + ${F((T.b*k)**2,2)} − 2 · ${L(T.a)} · ${L(T.b)} · ${F(cg,3)}<br>`;
    h+=Math.abs(cg)<.004?'γ = 90°: cos γ = 0, es bleibt der Satz des Pythagoras.':cg<0?'γ ist stumpf: cos γ < 0, also ist c² größer als a² + b².':'γ ist spitz: cos γ > 0, also ist c² kleiner als a² + b².';
    if(lvlShow(3))h+=`<br>Umgekehrt: cos γ = (a² + b² − c²) : (2ab) → γ = ${G1(T.ga)}`;setHTML('sCos',h)}
  let h=`A = c · h<sub>c</sub> : 2 = ${L(T.c)} · ${L(T.hc)} : 2 = ${F(T.area*k*k,2)} ${U.u}²`;if(lvlShow(2))h+=`<br>A = ½ · a · b · sin γ = ½ · ${L(T.a)} · ${L(T.b)} · ${F(Math.sin(T.ga),3)} = ${F(.5*T.a*T.b*Math.sin(T.ga)*k*k,2)} ${U.u}²`;setHTML('sA',h);
  if($('#sFl')){const b=T.c*Math.sin(T.be)/Math.sin(T.ga);setHTML('sFl',`Gemessen: c = ${L(T.c)} m, α = ${G1(T.al)}, β = ${G1(T.be)}<br>γ = 180° − α − β = ${G1(T.ga)}<br>b = c · sin β : sin γ = ${F(b*k,2)} m<br>Abstand h = b · sin α = ${F(b*Math.sin(T.al)*k,2)} m`)}}
MODES.saetze={enter(){if(!S.init){S.init=true;sLoad(0)}else{sTools();sPanel();renderLib('Versuche: Sinus- und Kosinussatz',SP,S.pi,sLoad)}},panel:sPanel,
  frame(){},draw:sDraw,upd:sUpd,down:sDown,move:sMove,up(){S.drag=-1},key(){return false}};

/* =====================================================================
   Start, Umschalten, Schleife
   ===================================================================== */
function fit(){const r=$('#cvw').getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);CW=Math.max(50,r.width);CH=Math.max(50,r.height);cv.width=Math.round(CW*d);cv.height=Math.round(CH*d);ctx.setTransform(d,0,0,d,0,0)}
const ro=new ResizeObserver(()=>fit());ro.observe($('#cvw'));
const thObs=new MutationObserver(()=>readCols());thObs.observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readCols)}catch(e){}
function setMode(m){if(!MODES[m])m='kreis';if(m===APP.mode)return;APP.mode=m;
  $$('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.mode===m)));MODES[m].enter();MODES[m].upd()}
function setLvl(l){APP.lvl=l;try{localStorage.setItem('trig-lvl',String(l))}catch(e){}$$('.lvl button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.lvl===l)));MODES[APP.mode].panel();MODES[APP.mode].upd()}
$$('.tabs button').forEach(b=>b.onclick=()=>{location.hash=b.dataset.mode;setMode(b.dataset.mode)});
$$('.lvl button').forEach(b=>b.onclick=()=>setLvl(+b.dataset.lvl));
addEventListener('hashchange',()=>setMode(location.hash.slice(1)));
$('#bFull').onclick=()=>{const d=document;try{if(d.fullscreenElement)d.exitFullscreen();else d.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};
const pos=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}MODES[APP.mode].down(...pos(e))});
cv.addEventListener('pointermove',e=>MODES[APP.mode].move(...pos(e)));
const up=()=>MODES[APP.mode].up();cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;const M=MODES[APP.mode];
  if(e.key===' '&&e.target.tagName==='BUTTON')return;if(e.key===' '||e.key==='ArrowLeft'||e.key==='ArrowRight'){if(M.key(e.key,e.shiftKey))e.preventDefault()}});
let lv=2;try{lv=+localStorage.getItem('trig-lvl')||2}catch(e){}APP.lvl=clamp(lv,1,3);$$('.lvl button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.lvl===APP.lvl)));
readCols();fit();setMode(location.hash.slice(1)||'kreis');
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;APP.frame++;const M=MODES[APP.mode];try{M.frame(dt);M.draw();if(APP.frame%6===0)M.upd()}catch(err){console.error(err)}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
}
</script>
