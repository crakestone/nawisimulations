<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quantenlabor – Photoeffekt, Spektren, Doppelspalt, Interferometer</title>
<style>
  :root{
    --ink:#1d2230; --muted:#5b6477; --line:#d9dde6; --bg:#f4f6fa; --panel:#ffffff;
    --accent:#0f766e; --warn:#b91c1c;
    font-size:17px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.35}
  header{display:flex;align-items:center;gap:.8rem 1.2rem;flex-wrap:wrap;padding:.6rem 1rem;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  header h1{font-size:1.25rem;margin:0;flex:1 1 auto;white-space:nowrap}
  header h1 a{color:inherit;text-decoration:none}
  header h1 a:hover{text-decoration:underline;text-underline-offset:4px}
  header h1 small{font-weight:400;color:var(--muted);font-size:.85rem;margin-left:.4rem}
  .lvl{display:flex;align-items:center;gap:.5rem}
  .lvl > span{color:var(--muted);font-size:.9rem}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#eef1f6;flex-wrap:wrap}
  .seg button{border:0;background:transparent;padding:.42rem .75rem;font:inherit;font-size:.92rem;cursor:pointer;color:var(--ink)}
  .seg button + button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--accent);color:#fff;font-weight:600}
  .seg.small{flex-wrap:nowrap}
  .seg.small button{padding:.3rem .45rem;font-size:.8rem;white-space:nowrap}
  .btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:.42rem .8rem;font:inherit;font-size:.92rem;cursor:pointer;color:var(--ink)}
  .btn:hover{background:#f0f3f8}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  .btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:1rem;padding:1rem;align-items:start}
  aside{display:flex;flex-direction:column;gap:.8rem}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.8rem .9rem}
  .card h2{font-size:1rem;margin:0 0 .55rem}
  .field{margin:.4rem 0 .7rem}
  .field > label{display:flex;justify-content:space-between;gap:.5rem;font-size:.9rem;margin-bottom:.15rem}
  .field > label b{font-variant-numeric:tabular-nums;font-weight:600}
  input[type=range]{accent-color:var(--accent);width:100%}
  input.spectrum{-webkit-appearance:none;appearance:none;height:14px;border-radius:7px;outline:none}
  input.spectrum::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid #1d2230;cursor:pointer}
  input.spectrum::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #1d2230;cursor:pointer}
  select{font:inherit;font-size:.93rem;padding:.35rem;border-radius:8px;border:1px solid var(--line);width:100%;background:#fff}
  .check{display:flex;align-items:center;gap:.5rem;margin:.35rem 0;font-size:.92rem;cursor:pointer}
  .check input{width:1.1rem;height:1.1rem;accent-color:var(--accent)}
  .btnrow{display:flex;gap:.4rem;flex-wrap:wrap;margin:.4rem 0}
  .note{font-size:.84rem;color:var(--muted);margin:.35rem 0}
  .tasks{display:flex;flex-direction:column;gap:.35rem}
  .tasks button{font:inherit;font-size:.88rem;text-align:left;border:1px solid var(--line);background:#fafbfd;border-radius:9px;padding:.4rem .55rem;cursor:pointer;color:var(--ink)}
  .tasks button:hover{background:#eef6f5;border-color:#b8dcd7}
  .tasks button.on{background:#e3f3f1;border-color:var(--accent);font-weight:600}
  #taskInfo p{margin:.45rem 0;font-size:.92rem}
  #taskInfo .q{background:#fff8e6;border:1px solid #f4dfa5;border-radius:9px;padding:.45rem .6rem}
  #taskInfo .a{background:#eef7f2;border:1px solid #c5e4d2;border-radius:9px;padding:.45rem .6rem}
  .stage{min-width:0}
  .viewbox{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;height:calc(100vh - 100px);min-height:520px}
  #cv{display:block;width:100%;height:100%;touch-action:none}
  .tip{position:absolute;pointer-events:none;background:#1d2230;color:#fff;font-size:.82rem;border-radius:8px;padding:.25rem .5rem;white-space:nowrap;display:none;z-index:4}
  @media (max-width: 900px){ .layout{grid-template-columns:1fr} aside{order:2} .viewbox{height:70vh;min-height:420px} }
</style>
</head>
<body>
<header>
  <h1><a href="../index.html" title="Zur Startseite">Quantenlabor</a> <small>Licht und Materie im Kleinsten</small></h1>
  <div class="seg" id="stSeg"><button data-s="0" class="on">Photoeffekt</button><button data-s="1">Spektren</button><button data-s="2">Doppelspalt</button><button data-s="3">Interferometer</button></div>
  <div class="lvl"><span>Niveau:</span>
    <div class="seg" id="lvlSeg"><button data-v="easy" class="on">Einfach</button><button data-v="mid">Mittel</button><button data-v="hard">Anspruchsvoll</button></div>
  </div>
  <button class="btn" id="fsBtn">Vollbild</button>
</header>
<div class="layout">
  <aside>
    <div class="card"><h2 id="ctrlTitle">Einstellungen</h2><div id="ctrl"></div></div>
    <div class="card"><h2>Aufträge</h2><div class="tasks" id="tasks"></div><div id="taskInfo"></div></div>
  </aside>
  <section class="stage">
    <div class="viewbox" id="vb"><canvas id="cv"></canvas><div class="tip" id="tip"></div></div>
  </section>
</div>

<script>
"use strict";
/* =====================================================================
   Quantenlabor – vier Stationen:
   0 Photoeffekt  · 1 Spektren  · 2 Doppelspalt  · 3 Mach-Zehnder-Interferometer
   ===================================================================== */
const $ = s => document.querySelector(s);
const HC = 1239.84193;            /* h·c in eV·nm */
const H_PLANCK = 6.62607015e-34, E_CH = 1.602176634e-19, C_LIGHT = 2.99792458e8, M_E = 9.1093837e-31;
const S = { st:0, level:'easy', task:-1, showAnswer:false };
const lvlNum = () => ({easy:0, mid:1, hard:2})[S.level];

/* ---------- Zahlen und Farben ---------- */
function fmt(v, d){ if (!isFinite(v)) return '–'; return (Math.abs(v) < 0.5*Math.pow(10,-d) ? 0 : v).toFixed(d).replace('.', ','); }
function sci(v, d){ if (v === 0) return '0'; const ex = Math.floor(Math.log10(Math.abs(v))); const m = v/Math.pow(10,ex); return fmt(m,d) + '·10' + sup(ex); }
function sup(n){ const m = {'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'}; return String(n).split('').map(c => m[c]).join(''); }
function nmRGB(nm){
  if (nm < 380) return [150, 90, 220];
  if (nm > 780) return [140, 30, 30];
  let r = 0, g = 0, b = 0;
  if (nm < 440){ r = -(nm-440)/60; b = 1; }
  else if (nm < 490){ g = (nm-440)/50; b = 1; }
  else if (nm < 510){ g = 1; b = -(nm-510)/20; }
  else if (nm < 580){ r = (nm-510)/70; g = 1; }
  else if (nm < 645){ r = 1; g = -(nm-645)/65; }
  else r = 1;
  const f = nm < 420 ? 0.35 + 0.65*(nm-380)/40 : nm > 700 ? 0.35 + 0.65*(780-nm)/80 : 1;
  return [r,g,b].map(v => Math.round(255*Math.pow(v*f, 0.8)));
}
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const spectrumCSS = (a, b) => { const st = []; for (let nm = a; nm <= b; nm += 10) st.push(`${rgba(nmRGB(nm),1)} ${((nm-a)/(b-a)*100).toFixed(1)}%`); return `linear-gradient(90deg,${st.join(',')})`; };
function region(nm){ return nm < 380 ? 'UV (unsichtbar)' : nm > 750 ? 'Infrarot (unsichtbar)' : 'sichtbar'; }

/* ---------- Canvas ---------- */
const cv = $('#cv'), ctx = cv.getContext('2d'), vb = $('#vb');
let W = 0, H = 0;
function resize(){
  const r = vb.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  W = r.width; H = r.height; cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  if (DS.layer) DS.rebuild = true;
}
new ResizeObserver(resize).observe(vb);
function line(x1,y1,x2,y2,col,w){ ctx.strokeStyle = col; ctx.lineWidth = w || 1; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
function text(t, x, y, o){
  o = o || {}; ctx.font = `${o.weight || 500} ${o.size || 13}px ${o.mono ? 'ui-monospace,Menlo,Consolas,monospace' : 'system-ui'}`;
  ctx.fillStyle = o.col || '#1d2230'; ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'middle'; ctx.fillText(t, x, y);
}
function box(x, y, w, h, fill, stroke, r){ ctx.beginPath(); ctx.roundRect(x, y, w, h, r ?? 8); if (fill){ ctx.fillStyle = fill; ctx.fill(); } if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = 1.2; ctx.stroke(); } }
function pill(t, x, y, o){
  o = o || {}; ctx.font = `${o.weight || 600} ${o.size || 13}px system-ui`;
  const w = ctx.measureText(t).width + 14, h = (o.size || 13) + 10;
  const bx = o.align === 'left' ? x : o.align === 'right' ? x - w : x - w/2;
  box(bx, y - h/2, w, h, o.bg || '#10231f', null, 8);
  text(t, bx + w/2, y + 0.5, {col:o.col || '#7ff5d2', align:'center', weight:o.weight || 600, size:o.size || 13});
}
function wrapText(t, x, y, maxW, o){
  o = o || {}; ctx.font = `${o.weight || 500} ${o.size || 13}px system-ui`;
  const words = t.split(' '); let ln = '';
  const lh = (o.size || 13) + 4;
  for (const w of words){
    const test = ln ? ln + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && ln){ text(ln, x, y, o); y += lh; ln = w; } else ln = test;
  }
  if (ln){ text(ln, x, y, o); y += lh; }
  return y;
}
function arrow(x1,y1,x2,y2,col,w){
  line(x1,y1,x2,y2,col,w || 2);
  const a = Math.atan2(y2-y1, x2-x1), h = 8 + (w || 2);
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(x2 - h*Math.cos(a-0.45), y2 - h*Math.sin(a-0.45)); ctx.lineTo(x2 - h*Math.cos(a+0.45), y2 - h*Math.sin(a+0.45)); ctx.fill();
}
function wiggle(x, y, ang, len, col, amp){
  ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.strokeStyle = col; ctx.lineWidth = 2.2; ctx.beginPath();
  for (let k = 0; k <= 24; k++){ const t = k/24, px = -len/2 + t*len, env = Math.sin(Math.PI*t); ctx.lineTo(px, env*(amp || 4)*Math.sin(t*Math.PI*6)); }
  ctx.stroke(); ctx.restore();
}

/* ---------- Bedienelemente links ---------- */
const UI = {
  el: $('#ctrl'),
  clear(){ this.el.innerHTML = ''; },
  slider(label, o){
    const d = document.createElement('div'); d.className = 'field';
    d.innerHTML = `<label><span>${label}</span><b></b></label><input type="range" min="${o.min}" max="${o.max}" step="${o.step}">`;
    const b = d.querySelector('b'), inp = d.querySelector('input');
    if (o.cls) inp.className = o.cls; if (o.bg) inp.style.background = o.bg;
    inp.value = o.get(); b.innerHTML = o.fmt(o.get());
    inp.oninput = () => { o.set(+inp.value); b.innerHTML = o.fmt(+inp.value); };
    this.el.appendChild(d); return d;
  },
  select(label, opts, get, set){
    const d = document.createElement('div'); d.className = 'field';
    d.innerHTML = `<label><span>${label}</span></label><select>${opts.map(([v,t]) => `<option value="${v}">${t}</option>`).join('')}</select>`;
    const s = d.querySelector('select'); s.value = get(); s.onchange = () => set(s.value);
    this.el.appendChild(d); return d;
  },
  seg(label, opts, get, set){
    const d = document.createElement('div'); d.className = 'field';
    d.innerHTML = (label ? `<label><span>${label}</span></label>` : '') + `<div class="seg small">${opts.map(([v,t]) => `<button data-v="${v}">${t}</button>`).join('')}</div>`;
    const btns = [...d.querySelectorAll('button')];
    const upd = () => btns.forEach(b => b.classList.toggle('on', b.dataset.v === String(get())));
    btns.forEach(b => b.onclick = () => { set(b.dataset.v); upd(); });
    upd(); this.el.appendChild(d); return d;
  },
  check(label, get, set){
    const d = document.createElement('label'); d.className = 'check';
    d.innerHTML = `<input type="checkbox"> ${label}`; const c = d.querySelector('input'); c.checked = get(); c.onchange = () => set(c.checked);
    this.el.appendChild(d); return d;
  },
  buttons(list){
    const d = document.createElement('div'); d.className = 'btnrow';
    for (const [t, fn, cls] of list){ const b = document.createElement('button'); b.className = 'btn ' + (cls || ''); b.innerHTML = t; b.onclick = fn; d.appendChild(b); }
    this.el.appendChild(d); return d;
  },
  note(html){ const p = document.createElement('p'); p.className = 'note'; p.innerHTML = html; this.el.appendChild(p); return p; }
};

/* =====================================================================
   Station 0: Photoeffekt
   ===================================================================== */
const METALS = { Cs:['Cäsium',2.14], K:['Kalium',2.29], Na:['Natrium',2.36], Zn:['Zink',4.33], Cu:['Kupfer',4.65], Pt:['Platin',5.65] };
const PE = { lam:450, inten:40, metal:'Cs', U:0, photons:[], electrons:[], acc:0, rate:0, pts:[], msg:'' };
const peE = () => HC/PE.lam;
const peW = () => METALS[PE.metal][1];
function peGeo(){
  const wide = W > 980;
  const aw = wide ? W*0.58 : W, ah = wide ? H : H*0.56;
  const tube = { x:aw*0.1, y:ah*0.3, w:aw*0.8, h:ah*0.42 };
  return {
    wide, aw, ah, tube,
    cat:{ x:tube.x + tube.w*0.12, y1:tube.y + tube.h*0.15, y2:tube.y + tube.h*0.85 },
    an:{ x:tube.x + tube.w*0.88, y1:tube.y + tube.h*0.15, y2:tube.y + tube.h*0.85 },
    lamp:{ x:tube.x + tube.w*0.62, y:ah*0.1 },
    panel: wide ? { x:W*0.6, y:12, w:W*0.4 - 16, h:H - 24 } : { x:12, y:ah + 6, w:W - 24, h:H - ah - 18 }
  };
}
function peStep(dt, g){
  /* Photonen erzeugen */
  PE.acc += PE.inten*dt;
  while (PE.acc >= 1){
    PE.acc -= 1;
    const ty = g.cat.y1 + Math.random()*(g.cat.y2 - g.cat.y1);
    PE.photons.push({ x:g.lamp.x, y:g.lamp.y + 18, tx:g.cat.x + 5, ty, t:0 });
  }
  const gap = g.an.x - g.cat.x - 8, K = Math.max(260, gap*1.4);
  for (const p of PE.photons){
    const L = Math.hypot(p.tx - p.x, p.ty - p.y); p.t += 520*dt/L;
    if (p.t >= 1){
      p.dead = true;
      const Ek = peE() - peW();
      if (Ek > 0) PE.electrons.push({ s:0, dir:1, Ek:Ek*Math.sqrt(Math.random()), y:p.ty });
    }
  }
  PE.photons = PE.photons.filter(p => !p.dead);
  for (const e of PE.electrons){
    const E = e.Ek + PE.U*(e.s/gap);
    if (e.dir > 0 && E <= 0.003) e.dir = -1;
    const v = K*Math.sqrt(Math.max(E, 0.004));
    e.s += e.dir*v*dt;
    if (e.s >= gap){ e.dead = true; PE.rate += 1/0.8; }
    else if (e.s <= 0 && e.dir < 0) e.dead = true;
  }
  PE.electrons = PE.electrons.filter(e => !e.dead);
  PE.rate *= Math.exp(-dt/0.8);
}
function peCurrent(){ return PE.rate*0.1; }   /* nA, schematisch */
function peDraw(dt){
  const g = peGeo();
  peStep(dt, g);
  const t = g.tube, lam = PE.lam, col = nmRGB(lam), Eph = peE(), Wm = peW(), lv = lvlNum();
  /* Lichtkegel */
  ctx.fillStyle = rgba(col, lam < 380 || lam > 780 ? 0.07 : 0.13);
  ctx.beginPath(); ctx.moveTo(g.lamp.x - 10, g.lamp.y + 14); ctx.lineTo(g.lamp.x + 10, g.lamp.y + 14); ctx.lineTo(g.cat.x + 6, g.cat.y2); ctx.lineTo(g.cat.x + 6, g.cat.y1); ctx.closePath(); ctx.fill();
  /* Röhre */
  box(t.x, t.y, t.w, t.h, 'rgba(226,236,248,.55)', '#9fb3cc', t.h*0.16);
  text('Vakuumröhre', t.x + t.w/2, t.y + t.h + 14, {col:'#64748b', size:12, align:'center'});
  /* Kathode und Anode */
  ctx.fillStyle = '#8b97a8'; ctx.fillRect(g.cat.x - 7, g.cat.y1, 12, g.cat.y2 - g.cat.y1);
  ctx.fillStyle = '#475569'; ctx.fillRect(g.an.x - 3, g.an.y1, 6, g.an.y2 - g.an.y1);
  text(METALS[PE.metal][0] + (lv ? '-Platte' : ''), g.cat.x - 2, g.cat.y2 + 14, {size:12, align:'center', weight:600, col:'#334155'});
  text('Auffänger', g.an.x, g.an.y2 + 14, {size:12, align:'center', weight:600, col:'#334155'});
  /* Lampe */
  ctx.fillStyle = '#334155'; ctx.beginPath(); ctx.roundRect(g.lamp.x - 22, g.lamp.y - 16, 44, 30, 6); ctx.fill();
  ctx.fillStyle = rgba(col, 1); ctx.beginPath(); ctx.arc(g.lamp.x, g.lamp.y + 14, 9, 0, Math.PI); ctx.fill();
  text(lv ? `${fmt(lam,0)} nm` : (lam < 380 ? 'UV-Licht' : lam > 750 ? 'Infrarot' : 'Licht'), g.lamp.x + 30, g.lamp.y, {size:13, weight:600});
  if (lam < 380 || lam > 750) text(region(lam), g.lamp.x + 30, g.lamp.y + 17, {size:11, col:'#64748b'});
  /* Photonen */
  for (const p of PE.photons){
    const x = p.x + (p.tx - p.x)*p.t, y = p.y + (p.ty - p.y)*p.t;
    wiggle(x, y, Math.atan2(p.ty - p.y, p.tx - p.x), 22, rgba(col, 1), 4);
  }
  /* Elektronen */
  const gap = g.an.x - g.cat.x - 8;
  for (const e of PE.electrons){
    const x = g.cat.x + 6 + e.s;
    ctx.fillStyle = '#1d4ed8'; ctx.beginPath(); ctx.arc(x, e.y, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(29,78,216,.18)'; ctx.beginPath(); ctx.arc(x - e.dir*7, e.y, 3, 0, Math.PI*2); ctx.fill();
  }
  /* Stromkreis mit Spannungsquelle und Strommesser */
  const yb = t.y + t.h + 52;
  line(g.cat.x - 1, g.cat.y2, g.cat.x - 1, yb, '#334155', 2.5); line(g.an.x, g.an.y2, g.an.x, yb, '#334155', 2.5);
  line(g.cat.x - 1, yb, g.an.x, yb, '#334155', 2.5);
  const mx = g.cat.x + (g.an.x - g.cat.x)*0.32, ax = g.cat.x + (g.an.x - g.cat.x)*0.7;
  box(mx - 58, yb - 17, 116, 34, '#fff', '#334155', 8);
  text(lv ? `U = ${PE.U > 0 ? '+' : ''}${fmt(PE.U,2)} V` : (PE.U < -0.01 ? 'bremst' : PE.U > 0.01 ? 'beschleunigt' : 'aus'), mx, yb, {align:'center', weight:600});
  text(lv ? 'Spannung (Auffänger gegen Platte)' : 'Spannung', mx, yb + 29, {align:'center', size:11, col:'#64748b'});
  const I = peCurrent();
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#334155'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(ax, yb, 17, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  text('A', ax, yb + 1, {align:'center', weight:700, size:15});
  pill(lv ? `I = ${fmt(I, 1)} nA` : (I > 0.05 ? 'Strom fließt' : 'kein Strom'), ax, yb + 34);
  /* Feld zwischen den Platten */
  if (Math.abs(PE.U) > 0.01 && lv){
    const n = 4;
    for (let k = 0; k < n; k++){
      const y = g.cat.y1 + (k+0.5)/n*(g.cat.y2 - g.cat.y1), x1 = g.cat.x + 30, x2 = g.an.x - 30;
      ctx.save(); ctx.setLineDash([4,6]);
      if (PE.U < 0) arrow(x1, y, x2, y, 'rgba(220,38,38,.35)', 1.2); else arrow(x2, y, x1, y, 'rgba(22,163,74,.35)', 1.2);
      ctx.restore();
    }
  }
  /* Meldung */
  const Ek = Eph - Wm;
  let msg = Ek > 0 ? 'Elektronen werden herausgelöst.' : 'Es werden keine Elektronen herausgelöst – egal wie hell das Licht ist.';
  pill(msg, t.x + t.w/2, t.y - 24, {bg: Ek > 0 ? '#e7f6ef' : '#fff1f1', col: Ek > 0 ? '#166534' : '#b91c1c', size:13});
  peDrawPanel(g, Eph, Wm);
}
function peDrawPanel(g, Eph, Wm){
  const p = g.panel, lv = lvlNum();
  box(p.x, p.y, p.w, p.h, '#f8fafc', '#e2e8f0', 12);
  const hasGraph = lv === 2;
  const dh = hasGraph ? p.h*0.48 : p.h;
  /* Energiediagramm */
  const Emax = 7, x0 = p.x + 56, y0 = p.y + dh - 34, top = p.y + 40, sc = (y0 - top)/Emax;
  text('Energie', p.x + 14, p.y + 20, {weight:700, size:14});

   Station 1: Spektren
   ===================================================================== */
const R_H = 1.09677583e7;
const hLam = (m, n) => 1e9/(R_H*(1/(m*m) - 1/(n*n)));
const ELEMENTS = {
  H:  { name:'Wasserstoff', lines: [[656.3,1],[486.1,.5],[434.0,.3],[410.2,.2],[397.0,.12]] },
  He: { name:'Helium', lines: [[388.9,.35],[447.1,.5],[471.3,.2],[492.2,.2],[501.6,.4],[587.6,1],[667.8,.5],[706.5,.4]] },
  Na: { name:'Natrium', lines: [[589.0,1],[589.6,.9],[568.8,.1],[498.3,.06],[616.1,.07]] },
  Hg: { name:'Quecksilber', lines: [[404.7,.5],[407.8,.2],[435.8,.9],[546.1,1],[577.0,.5],[579.1,.5]] },
  Ne: { name:'Neon', lines: [[540.1,.2],[585.2,.8],[588.2,.4],[594.5,.5],[597.6,.2],[603.0,.3],[607.4,.5],[609.6,.5],[614.3,.7],[616.4,.3],[621.7,.4],[626.6,.5],[633.4,.6],[638.3,.6],[640.2,1],[650.7,.6],[659.9,.4],[667.8,.3],[692.9,.4],[703.2,.6]] }

const SP = { el:'H', mode:'emission', auto:true, rate:9, acc:0, cnt:{}, flyers:[], level:1, jumps:[], uv:0, ir:0, uvList:[], irList:[], riddle:null, reveal:false, refs:false };
function spEl(){ return SP.riddle || SP.el; }
function spReset(){ SP.cnt = {}; SP.flyers = []; SP.uv = 0; SP.ir = 0; SP.uvList = []; SP.irList = []; SP.jumps = []; SP.level = 1; }
function tubeColor(el){
  let r = 0, g = 0, b = 0, s = 0;
  for (const [nm,w] of ELEMENTS[el].lines){ const c = nmRGB(nm); r += c[0]*w; g += c[1]*w; b += c[2]*w; s += w; }
  const m = Math.max(r,g,b)/s || 1;

}
function spGeo(){
  const lvlX = W*0.64;

    tube:{ x:W*0.05, y:H*0.14, w:W*0.24, h:Math.max(34, H*0.07) },
    prism:{ x:W*0.44, y:H*0.175 },

}

function spStep(dt, g){

function spX(nm, s){ return s.x + (nm - SPA)/(SPB - SPA)*s.w; }
function drawStrip(s, el, mode, counts, small){

function spClick(x, y){

/* =====================================================================
   Station 2: Doppelspalt mit einzelnen Quantenobjekten
   ===================================================================== */
const DS = { obj:'photon', lam:600, kV:10, d:0.5, b:0.05, de:1.5, be:0.3, open:'both', which:false, rate:'slow', run:true, acc:0, hits:[], bins:new Array(120).fill(0), anims:[], showCurve:false, pointer:false, px:null, layer:null, rebuild:true, omega:0 };
const L_SCR = 1;   /* Abstand Doppelspalt – Schirm in m */
function dsLam(){ return DS.obj === 'photon' ? DS.lam*1e-9 : H_PLANCK/Math.sqrt(2*M_E*E_CH*DS.kV*1000); }
function dsD(){ return DS.obj === 'photon' ? DS.d*1e-3 : DS.de*1e-6; }
function dsB(){ return DS.obj === 'photon' ? DS.b*1e-3 : DS.be*1e-6; }
function dsRange(){ return DS.obj === 'photon' ? 15e-3 : 60e-6; }

function dsI(x){

}
function dsSample(){ const X = dsRange(); for (let k = 0; k < 4000; k++){ const x = (Math.random()*2 - 1)*X; if (Math.random() < dsI(x)) return x; } return 0; }
function dsClear(){ DS.hits = []; DS.bins.fill(0); DS.anims = []; DS.rebuild = true; }
function dsGeo(){

}
function dsSlitY(g){

  const sep = 36 + 110*dn;
  const bn = DS.obj === 'photon' ? (DS.b - 0.02)/0.13 : (DS.be - 0.1)/0.5;

}
function dsYofX(x, g){ return (g.scr.top + g.scr.bot)/2 - x/dsRange()*(g.scr.bot - g.scr.top)/2; }
function dsAddHit(x, g){

}
function dsColor(){ return DS.obj === 'photon' ? nmRGB(DS.lam) : [37, 99, 235]; }
function dsEnsureLayer(g){

}
function dsPlot(x, hz, g){

const RATES = { single:0, slow:1.5, mid:25, fast:600 };
function dsStep(dt, g){

function dsLaunch(g){

function dsDraw(dt){

  for (const a of DS.anims) if (a.done && a.t < 1.35){ const y = dsYofX(a.x, g); ctx.fillStyle = rgba([255,255,255], 1.35 - a.t); ctx.beginPath(); ctx.arc(g.scr.x + g.scr.w/2, y, 9*(1.4 - a.t), 0, Math.PI*2); ctx.fill(); }
  /* Histogramm */

function dsDrawPointer(g, sl, open1, open2){

/* =====================================================================
   Station 3: Mach-Zehnder-Interferometer
   ===================================================================== */
const MZ = { mode:'photon', phase:0, blockA:false, blockB:false, polA:'none', polB:'none', eraser:false, bs2:true, rate:'slow', run:true, acc:0, cnt:[0,0,0], anims:[], flash:[0,0,0] };
/* komplexe Zahlen [re, im] */
const cm = (a,b) => [a[0]*b[0] - a[1]*b[1], a[0]*b[1] + a[1]*b[0]];
const cs = (a,b) => [a[0]+b[0], a[1]+b[1]];
const cabs2 = a => a[0]*a[0] + a[1]*a[1];
const I_ = [0,1], ONE = [1,0], R2 = 1/Math.SQRT2;
function polVec(p){ return p === 'H' ? [1,0] : p === 'V' ? [0,1] : p === 'D' ? [R2,R2] : null; }
/* Amplituden (Polarisation H/V) der Wege A (unten) und B (links/oben) an den Detektoren */
function mzAmps(){
  const lv = lvlNum();
  const pin = [R2, R2];                      /* Photonen diagonal polarisiert */
  const proj = (v, p) => { const q = polVec(p); if (!q) return v; const s = v[0]*q[0] + v[1]*q[1]; return [s*q[0], s*q[1]]; };
  const pA = lv === 2 ? proj(pin, MZ.polA) : pin, pB = lv === 2 ? proj(pin, MZ.polB) : pin;
  const ph = [Math.cos(MZ.phase), Math.sin(MZ.phase)];
  /* Weg A: BS1 durch (1/√2) · Spiegel (i) · Phasenschieber; Weg B: BS1 reflektiert (i/√2) · Spiegel (i) */
  let aA = cm(cm([R2,0], I_), ph), aB = cm([0,R2], I_);
  if (MZ.blockA) aA = [0,0]; if (MZ.blockB) aB = [0,0];
  /* am zweiten Strahlteiler: A kommt von unten, B von links. D1 rechts, D2 oben */
  let d1A, d1B, d2A, d2B;
  if (MZ.bs2){ d1A = cm(aA, [0,R2]); d2A = cm(aA, [R2,0]); d1B = cm(aB, [R2,0]); d2B = cm(aB, [0,R2]); }
  else { d1A = [0,0]; d2A = aA; d1B = aB; d2B = [0,0]; }
  return { pA, pB, d1:[d1A, d1B], d2:[d2A, d2B] };
}
function mzProbs(){
  const A = mzAmps(), lv = lvlNum(), out = [];
  for (const [xa, xb] of [A.d1, A.d2]){
    /* Gesamtamplitude als Vektor (H, V) mit komplexen Einträgen */
    let vH = cs(cm(xa, [A.pA[0],0]), cm(xb, [A.pB[0],0])), vV = cs(cm(xa, [A.pA[1],0]), cm(xb, [A.pB[1],0]));
    if (lv === 2 && MZ.eraser){ const s = cs(cm(vH,[R2,0]), cm(vV,[R2,0])); vH = cm(s,[R2,0]); vV = cm(s,[R2,0]); }
    out.push(cabs2(vH) + cabs2(vV));
  }
  out.push(Math.max(0, 1 - out[0] - out[1]));
  return out;
}
function mzGeo(){
  const px = W*0.73;
  const s = Math.min((px - 150)/1.66, H*0.5);

function mzPathPts(g, which){

function along(pts, t){

const MZRATES = { single:0, slow:1, mid:30, fast:500 };
function mzOutcome(){ const p = mzProbs(), r = Math.random(); return r < p[0] ? 0 : r < p[0] + p[1] ? 1 : 2; }

function mzStep(dt){

      a:'Nein! Mit beiden Spalten gibt es Stellen, an denen kein Photon mehr ankommt, obwohl dort mit nur einem Spalt Photonen ankamen. Die Möglichkeiten „durch Spalt 1“ und „durch Spalt 2“ überlagern sich.' },
    { n:'Welcher Weg?', min:0, setup(){ Object.assign(DS, {obj:'photon', rate:'mid', open:'both', which:true, run:true}); dsClear(); },
      q:'Ein Detektor misst bei jedem Photon, durch welchen Spalt es geht. Was passiert mit dem Muster?',
      a:'Das Interferenzmuster verschwindet. Sobald die Weginformation vorliegt, gibt es keine zwei ununterscheidbaren Möglichkeiten mehr, die sich überlagern können.' },
    { n:'Elektronen am Doppelspalt', min:0, setup(){ Object.assign(DS, {obj:'electron', rate:'fast', open:'both', which:false, run:true}); dsClear(); },
      q:'Statt Photonen werden Elektronen geschickt. Was beobachtest du? Ändere die Beschleunigungsspannung.',
      a:'Auch Elektronen erzeugen ein Interferenzmuster. Ihre Wellenlänge ist λ = h/p (de Broglie). Höhere Spannung → größerer Impuls → kleinere Wellenlänge → engere Streifen.' },
    { n:'Zeigermodell', min:1, setup(){ Object.assign(DS, {obj:'photon', rate:'mid', open:'both', which:false, pointer:true, showCurve:true, run:true}); dsClear(); },
      q:'Tippe auf verschiedene Stellen am Schirm. Wie stehen die beiden Zeiger zueinander, wo es hell ist – und wo es dunkel ist?',
      a:'Jeder Spalt liefert einen Zeiger, der sich mit der Weglänge dreht. Am Schirm werden die Zeiger addiert. Zeigen sie in dieselbe Richtung, ist die Summe lang (hohe Wahrscheinlichkeit); zeigen sie entgegengesetzt, heben sie sich auf (Minimum).' }
  ],
  [ /* Interferometer */
    { n:'Ein Photon nach dem anderen', min:0, setup(){ Object.assign(MZ, {mode:'photon', phase:0, blockA:false, blockB:false, bs2:true, polA:'none', polB:'none', eraser:false, rate:'slow', run:true}); mzReset(); },
      q:'Jedes Photon kann am ersten Strahlteiler Weg A oder Weg B nehmen. Welcher Detektor klickt? Warum ist das erstaunlich?',
      a:'Es klickt immer nur Detektor 1. Würde jedes Photon zufällig einen der Wege nehmen, müssten beide Detektoren je zur Hälfte klicken. Die beiden Möglichkeiten überlagern sich: Bei D2 löschen sie sich aus, bei D1 verstärken sie sich.' },
    { n:'Einen Weg blockieren', min:0, setup(){ Object.assign(MZ, {mode:'photon', phase:0, blockA:false, blockB:true, bs2:true, polA:'none', polB:'none', eraser:false, rate:'mid', run:true}); mzReset(); },
      q:'Weg B ist blockiert. Wie verteilen sich jetzt die Photonen? Warum klickt jetzt auch Detektor 2?',
      a:'Die Hälfte der Photonen wird blockiert, je ein Viertel landet bei D1 und D2. Ohne zweite Möglichkeit gibt es nichts mehr, das sich bei D2 auslöschen könnte.' },
    { n:'Glasplatte verschieben', min:0, setup(){ Object.assign(MZ, {mode:'photon', phase:0, blockA:false, blockB:false, bs2:true, polA:'none', polB:'none', eraser:false, rate:'mid', run:true}); mzReset(); },
      q:'Mache die Glasplatte in Weg A langsam dicker. Wie ändert sich die Verteilung auf D1 und D2? Vergleiche mit Laserlicht.',
      a:'Die Glasplatte verzögert Weg A. Je nach Dicke landen die Photonen bei D1, bei D2 oder verteilt: P(D1) = cos²(φ/2). Einzelne Photonen ergeben auf Dauer genau die Helligkeitsverteilung des Laserlichts.' },
    { n:'Zweiten Strahlteiler entfernen', min:0, setup(){ Object.assign(MZ, {mode:'photon', phase:0, blockA:false, blockB:false, bs2:false, polA:'none', polB:'none', eraser:false, rate:'mid', run:true}); mzReset(); },
      q:'Ohne zweiten Strahlteiler führt Weg A nur zu D2 und Weg B nur zu D1. Wie verteilen sich die Photonen? Hat die Glasplatte noch eine Wirkung?',
      a:'Je die Hälfte klickt bei D1 und D2, die Glasplatte ändert nichts mehr. Jetzt verrät der Detektor den Weg – und ohne zwei ununterscheidbare Möglichkeiten gibt es keine Interferenz.' },
    { n:'Weginformation durch Polarisation', min:2, setup(){ Object.assign(MZ, {mode:'photon', phase:0, blockA:false, blockB:false, bs2:true, polA:'H', polB:'V', eraser:false, rate:'mid', run:true}); mzReset(); },
      q:'In Weg A steht ein waagrechter, in Weg B ein senkrechter Polarisationsfilter. Was passiert mit der Interferenz? Verändere auch die Glasplatte.',
      a:'Die Interferenz verschwindet: An der Polarisation könnte man ablesen, welchen Weg ein Photon genommen hat – auch wenn es niemand tut. D1 und D2 erhalten je ein Viertel, unabhängig von der Glasplatte.' },
    { n:'Quantenradierer', min:2, setup(){ Object.assign(MZ, {mode:'photon', phase:0, blockA:false, blockB:false, bs2:true, polA:'H', polB:'V', eraser:true, rate:'mid', run:true}); mzReset(); },
      q:'Zusätzlich steht vor beiden Detektoren ein 45°-Filter. Kommt die Interferenz zurück? Verändere die Glasplatte.',
      a:'Ja: Der 45°-Filter „radiert“ die Weginformation aus, weil nach ihm beide Wege dieselbe Polarisation haben. Von den durchgelassenen Photonen landen wieder alle bei D1 (bzw. je nach Glasplatte verteilt) – allerdings bleiben insgesamt drei Viertel der Photonen in den Filtern hängen.' }
  ]
];
function renderTasks(){
  const el = $('#tasks'); el.innerHTML = '';
  TASKS[S.st].forEach((t, k) => {
    if (t.min > lvlNum()) return;
    const b = document.createElement('button'); b.textContent = t.n; b.classList.toggle('on', k === S.task);
    b.onclick = () => { S.task = k; S.showAnswer = false; t.setup(); buildControls(); renderTasks(); };
    el.appendChild(b);
  });
  const info = $('#taskInfo');
  const t = TASKS[S.st][S.task];
  if (!t || t.min > lvlNum()){ info.innerHTML = '<p class="note">Wähle einen Auftrag oder probiere frei aus.</p>'; return; }
  info.innerHTML = `<p class="q"><b>Auftrag:</b> ${t.q}</p>` + (S.showAnswer ? `<p class="a">${t.a}</p>` : '') + `<button class="btn" id="ansBtn">${S.showAnswer ? 'Erklärung ausblenden' : 'Erklärung zeigen'}</button>`;
  $('#ansBtn').onclick = () => { S.showAnswer = !S.showAnswer; renderTasks(); };
}

/* =====================================================================
   Stationen umschalten, Zeichenschleife, Eingaben
   ===================================================================== */
const STATIONS = [
  { name:'Photoeffekt', controls:peControls, draw:peDraw },
  { name:'Spektren', controls:spControls, draw:spDraw, click:spClick },
  { name:'Doppelspalt', controls:dsControls, draw:dsDraw, click:dsClick },
  { name:'Interferometer', controls:mzControls, draw:mzDraw, click:mzClick }
];
function buildControls(){ UI.clear(); $('#ctrlTitle').textContent = 'Einstellungen: ' + STATIONS[S.st].name; STATIONS[S.st].controls(); }
function setStation(i){
  S.st = i; S.task = -1; S.showAnswer = false;
  for (const b of $('#stSeg').children) b.classList.toggle('on', +b.dataset.s === i);
  buildControls(); renderTasks();
  try { history.replaceState(null, '', '#' + ['photoeffekt','spektren','doppelspalt','interferometer'][i]); } catch(_){}
}
function setLevel(l){
  S.level = l; for (const b of $('#lvlSeg').children) b.classList.toggle('on', b.dataset.v === l);
  if (l !== 'hard'){ PE.U = Math.max(-4, PE.U); if (l === 'easy') PE.U = 0; MZ.polA = 'none'; MZ.polB = 'none'; MZ.eraser = false; }
  if (l === 'easy') DS.pointer = false;
  buildControls(); renderTasks();
}
$('#stSeg').onclick = e => { const b = e.target.closest('button'); if (b) setStation(+b.dataset.s); };
$('#lvlSeg').onclick = e => { const b = e.target.closest('button'); if (b) setLevel(b.dataset.v); };
$('#fsBtn').onclick = () => { const d = document; try { if (d.fullscreenElement) d.exitFullscreen(); else d.documentElement.requestFullscreen().catch(() => {}); } catch(_){} };
let dragPointer = false;
cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  const st = STATIONS[S.st];
  if (st.click && st.click(x, y) !== false && S.st === 2 && DS.pointer){ dragPointer = true; cv.setPointerCapture(e.pointerId); }
});
cv.addEventListener('pointermove', e => {
  if (!dragPointer) return;
  const r = cv.getBoundingClientRect(); dsClick(e.clientX - r.left, e.clientY - r.top);
});
cv.addEventListener('pointerup', () => dragPointer = false);
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === ' '){ if (S.st === 2) dsLaunch(dsGeo()); if (S.st === 3) mzFire(); e.preventDefault(); }
});
let last = performance.now();
function frame(ts){
  const dt = Math.min(0.05, (ts - last)/1000); last = ts;
  ctx.clearRect(0, 0, W, H);
  STATIONS[S.st].draw(dt);
  requestAnimationFrame(frame);
}
resize();
const startHash = ['photoeffekt','spektren','doppelspalt','interferometer'].indexOf(location.hash.slice(1));
setStation(startHash >= 0 ? startHash : 0);
requestAnimationFrame(frame);
</script>
</body>
