<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schrödinger-Labor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE school lab for quantum mechanics, legible on a projector, rigorous enough for first-year students
   IDEA a physics bench where wave functions are drawn on their energy levels, like the figures in a textbook, but alive
   PICTURE the live canvas: potentials, energy levels, ψ and |ψ|², wave packets, orbitals
   COLOUR white ground, dark ink, blue for Re ψ, red for Im ψ, violet for |ψ|², amber for energies (same family as the other labs)
   TYPE Atkinson Hyperlegible
   LAYOUT laptop: tasks | stage | panel; phone: stage, panel, tasks */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#10161b);--ink:light-dark(#14212b,#e6ecf1);--mut:light-dark(#5a6772,#9babb7);--line:light-dark(#dde3e8,#29343d);--pan:light-dark(#f2f5f7,#18212a);--red:light-dark(#df4329,#ff6b4f);--blue:light-dark(#2762c9,#6198ff);--vio:light-dark(#7b3cc4,#bb90ff);--fld:light-dark(#ffffff,#0c1115);--ok:light-dark(#1f7a4d,#53c98a);--amb:light-dark(#c47a00,#f0b24a);--pot:light-dark(#e9edf1,#1f2a33)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
button,select,input{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{flex:none}
h1{font-size:26px;line-height:1.05;margin:0;letter-spacing:-.02em}
h1 a{color:inherit;text-decoration:none}
h1 a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.tabs{display:flex;gap:3px;background:var(--pan);padding:4px;border-radius:12px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 9px;border-radius:9px;cursor:pointer;font-weight:700;min-height:40px;font-size:14px}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.btn{border:1px solid var(--line);background:var(--bg);padding:7px 12px;border-radius:9px;cursor:pointer;min-height:38px;white-space:nowrap}
.btn:hover{border-color:var(--mut)}
.btn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.hot{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.lvl{display:flex;gap:3px;background:var(--pan);padding:4px;border-radius:12px}
.lvl button{border:0;background:none;padding:6px 9px;border-radius:8px;cursor:pointer;font-size:14px;min-height:34px}
.lvl button[aria-pressed=true]{background:var(--bg);box-shadow:0 0 0 1px var(--line);font-weight:700}
main{display:grid;grid-template-columns:250px minmax(0,1fr) 330px;min-height:0}
#lib{overflow:auto;border-right:1px solid var(--line);padding:12px}
#lib h2{font-size:13px;color:var(--mut);margin:14px 4px 6px;font-weight:700}
#lib h2:first-child{margin-top:2px}
.pre{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px}
.pre b{display:block;font-size:15px}
.pre span{display:block;font-size:13px;color:var(--mut);line-height:1.3}
.pre:hover{background:var(--pan)}
.pre[aria-current=true]{background:var(--pan);box-shadow:inset 3px 0 0 var(--vio)}
#stage{display:flex;flex-direction:column;min-height:0}
#tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);min-height:55px}
#tools .sep{width:1px;height:26px;background:var(--line);margin:0 4px}
#cvw{position:relative;flex:1;min-height:320px;background:var(--fld)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#status{font-size:13px;color:var(--mut);padding:5px 12px;border-top:1px solid var(--line);min-height:28px}
#panel{overflow:auto;border-left:1px solid var(--line);padding:6px 14px 20px}
.card{border-bottom:1px solid var(--line);padding:10px 0 12px}
.card:last-child{border-bottom:0}
.card h3{font-size:17px;margin:0 0 6px;line-height:1.2}
.card p{margin:4px 0}
.obs{background:var(--pan);border-radius:10px;padding:9px 11px;margin:6px 0}
details summary{cursor:pointer;font-weight:700;margin-top:6px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;margin:8px 0 2px;font-size:14px}
.row output{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--vio);height:26px;margin:0}
.seg{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.seg button{flex:1 1 auto;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;cursor:pointer;min-height:36px;font-size:14px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chk{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;margin:6px 0}
.chk label{display:flex;align-items:center;gap:6px;min-height:32px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--vio)}
select.full{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px;background:var(--bg);font-size:15px;min-height:40px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;font-size:14px;margin-top:6px}
.kv b{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.formel{background:var(--pan);border-radius:10px;padding:9px 11px;font-size:15px;line-height:1.6;margin-top:6px}
.small{font-size:13px;color:var(--mut)}
.lab{font-size:13px;color:var(--mut);font-weight:700;margin:10px 0 0}
.sw{display:inline-block;width:1.1em;height:1.1em;border-radius:4px;vertical-align:-.2em;border:1px solid var(--line);margin-right:4px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
#probe{display:none}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}#dlg[hidden]{display:none}
.dbox{background:var(--bg);border-radius:14px;padding:16px 18px;width:min(640px,100%);max-height:90vh;display:flex;flex-direction:column;gap:6px;box-shadow:0 10px 40px rgba(0,0,0,.3)}.dbox h3{margin:0;font-size:18px}
#csvT{width:100%;min-height:240px;flex:1;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:9px;padding:8px;background:var(--pan);color:var(--ink)}
@media(max-width:1520px){.tabs button{padding:8px 7px;font-size:13.5px}h1{font-size:23px}}
@media(max-width:1200px){main{grid-template-columns:215px minmax(0,1fr) 300px}.tabs button{padding:8px 6px;font-size:13.5px}h1{font-size:22px}}
@media(max-width:900px){
  html,body,#app{height:auto}
  main{grid-template-columns:minmax(0,1fr)}
  #stage{order:1}
  #cvw{flex:none;height:min(66vh,580px)}
  #panel{order:2;border:0;border-top:1px solid var(--line);overflow:visible}
  #lib{order:3;border:0;border-top:1px solid var(--line);overflow:visible}
  h1{font-size:22px}
}
</style>
</head>

<div id="app">
<header>

<div id="dlg" hidden><div class="dbox" role="dialog" aria-modal="true" aria-labelledby="dlgT"><h3 id="dlgT">Messwerte als CSV</h3><p class="small">Trennzeichen Strichpunkt, Dezimalkomma – passt direkt für Excel (de-AT). Für GeoGebra „Kopieren“ und in die Tabelle einfügen.</p><textarea id="csvT" readonly spellcheck="false"></textarea><div class="seg"><button class="btn hot" id="cCopy">Kopieren</button><button class="btn" id="cDown">Herunterladen</button><button class="btn" id="cClose">Schließen</button></div><p class="small" id="cMsg"></p></div></div>
<script>
{
/* ---------- Numerik-Kern (Einheiten: nm, eV, fs, Masse in m_e) ---------- */
const HB=0.6582119569, C0=0.0380998212, HC=1239.84198; // ħ in eV·fs, ħ²/2mₑ in eV·nm², h·c in eV·nm
/* Tridiagonale Matrix H = −c∂² + V auf Gitter (Dirichlet). Eigenwerte per Sturm-Bisektion, Vektoren per inverser Iteration */
function eigTri(V,dx,c,k){
  const N=V.length,o=-c/(dx*dx),d=new Float64Array(N);let lo=Infinity,hi=-Infinity;
  for(let i=0;i<N;i++){d[i]=2*c/(dx*dx)+V[i];if(V[i]<lo)lo=V[i];if(d[i]-2*o>hi)hi=d[i]-2*o}
  const e2=o*o;
  const cnt=x=>{let q=d[0]-x,n=q<0?1:0;for(let i=1;i<N;i++){q=d[i]-x-e2/(q===0?1e-300:q);if(q<0)n++}return n};
  const E=[],P=[];k=Math.min(k,N);let a0=lo;
  for(let j=0;j<k;j++){let a=a0,b=hi;
    for(let it=0;it<64&&b-a>1e-13*(1+Math.abs(a));it++){const m=(a+b)/2;if(cnt(m)>j)b=m;else a=m}
    const lam=(a+b)/2;E.push(lam);a0=a}
  for(const lam of E)P.push(invIt(d,o,lam,dx));
  return {E,P};
}
function thomasR(d,o,s,b){const N=d.length,cp=new Float64Array(N),x=new Float64Array(N);
  let den=d[0]-s;if(Math.abs(den)<1e-300)den=1e-300;cp[0]=o/den;x[0]=b[0]/den;
  for(let i=1;i<N;i++){den=d[i]-s-o*cp[i-1];if(Math.abs(den)<1e-300)den=1e-300;cp[i]=o/den;x[i]=(b[i]-o*x[i-1])/den}
  for(let i=N-2;i>=0;i--)x[i]-=cp[i]*x[i+1];return x}
function invIt(d,o,lam,dx){const N=d.length;let x=new Float64Array(N);for(let i=0;i<N;i++)x[i]=1+.5*Math.sin(i*1.7)+.3*Math.cos(i*.37);
  for(let it=0;it<4;it++){x=thomasR(d,o,lam,x);let s=0;for(let i=0;i<N;i++)s+=x[i]*x[i];s=Math.sqrt(s*dx)||1;for(let i=0;i<N;i++)x[i]/=s}
  let mx=0;for(let i=0;i<N;i++)mx=Math.max(mx,Math.abs(x[i]));
  for(let i=0;i<N;i++)if(Math.abs(x[i])>.05*mx){if(x[i]<0)for(let j=0;j<N;j++)x[j]=-x[j];break}
  return x}
/* Numerov-Integration von links: ψ'' = −(E−V)/c · ψ, ψ(0)=0 */
function numerov(V,dx,c,E,out){const N=V.length,h=dx*dx/12;out=out||new Float64Array(N);
  const k2=i=>(E-V[i])/c;out[0]=0;out[1]=1e-4;
  for(let i=1;i<N-1;i++){out[i+1]=(2*(1-5*h*k2(i))*out[i]-(1+h*k2(i-1))*out[i-1])/(1+h*k2(i+1));
    if(!Number.isFinite(out[i+1])||Math.abs(out[i+1])>1e250){for(let j=i+1;j<N;j++)out[j]=Math.sign(out[i])*1e250;break}}
  return out}
/* Crank-Nicolson-Zeitschritt, komplex. Potential V, Absorber W (≥0). */
function makeCN(V,W,dx,c,dt){
  const N=V.length,al=dt/(2*HB),be=al*c/(dx*dx);
  // A = 1 + iα(H − iW): diag ar+i·ai, off = −iβ
  const cpr=new Float64Array(N),cpi=new Float64Array(N),idr=new Float64Array(N),idi=new Float64Array(N);
  const br=new Float64Array(N),bi=new Float64Array(N);
  let pr=0,pi=0;
  for(let i=0;i<N;i++){
    const ar=1+al*W[i],ai=al*(2*c/(dx*dx)+V[i]);
    br[i]=1-al*W[i];bi[i]=-ai;
    // den = a − o·cp(i−1),  o = −iβ  → o·cp = −iβ(pr+i pi) = β·pi − iβ·pr
    let dr=ar,di=ai;if(i>0){dr-=be*pi;di+=be*pr}
    const m=dr*dr+di*di;idr[i]=dr/m;idi[i]=-di/m;
    // cp = o/den = −iβ·(idr+i·idi) = β·idi − iβ·idr
    pr=be*idi[i];pi=-be*idr[i];cpr[i]=pr;cpi[i]=pi}
  const rr=new Float64Array(N),ri=new Float64Array(N);
  return function step(re,im){
    // r = Bψ, B off = +iβ
    for(let i=0;i<N;i++){let xr=br[i]*re[i]-bi[i]*im[i],xi=br[i]*im[i]+bi[i]*re[i];
      const sr=(i>0?re[i-1]:0)+(i<N-1?re[i+1]:0),si=(i>0?im[i-1]:0)+(i<N-1?im[i+1]:0);
      xr+=-be*si;xi+=be*sr;rr[i]=xr;ri[i]=xi}
    // Vorwärts: y_i = (r_i − o·y_{i−1})/den ; o·y = −iβ(yr+i yi) = β·yi − iβ·yr
    let yr=0,yi=0;
    for(let i=0;i<N;i++){let tr=rr[i],ti=ri[i];if(i>0){tr-=be*yi;ti+=be*yr}
      yr=tr*idr[i]-ti*idi[i];yi=tr*idi[i]+ti*idr[i];re[i]=yr;im[i]=yi}
    for(let i=N-2;i>=0;i--){const xr=re[i+1],xi=im[i+1];re[i]-=cpr[i]*xr-cpi[i]*xi;im[i]-=cpr[i]*xi+cpi[i]*xr}
  }}
/* harmonischer Oszillator: normierte Funktionen φ_n(x), x0 = √(2c/ħω) */
function hoFuncs(nmax,xs,x0){const out=[];for(let n=0;n<=nmax;n++)out.push(new Float64Array(xs.length));
  const nf=1/Math.sqrt(x0)/Math.PI**.25;
  xs.forEach((x,j)=>{const q=x/x0;let p0=nf*Math.exp(-q*q/2),p1=Math.SQRT2*q*p0;out[0][j]=p0;if(nmax>0)out[1][j]=p1;
    for(let n=2;n<=nmax;n++){const p2=Math.sqrt(2/n)*q*p1-Math.sqrt((n-1)/n)*p0;out[n][j]=p2;p0=p1;p1=p2}});return out}
/* Wasserstoff (r in a₀) */
function fact(n){let f=1;for(let i=2;i<=n;i++)f*=i;return f}
function Rnl(n,l,r){const x=2*r/n,a=2*l+1,k=n-l-1;let L0=1,L1=1+a-x,L=k===0?1:L1;
  for(let j=1;j<k;j++){const L2=((2*j+1+a-x)*L1-(j+a)*L0)/(j+1);L0=L1;L1=L2;L=L2}
  const N=Math.sqrt((2/n)**3*fact(k)/(2*n*fact(n+l)));return N*x**l*Math.exp(-x/2)*L}
function Plm(l,m,x){let pmm=1;const s=Math.sqrt(Math.max(0,1-x*x));for(let i=1;i<=m;i++)pmm*=-(2*i-1)*s;if(l===m)return pmm;
  let p1=x*(2*m+1)*pmm;if(l===m+1)return p1;let p2=0;for(let ll=m+2;ll<=l;ll++){p2=((2*ll-1)*x*p1-(ll+m-1)*pmm)/(ll-m);pmm=p1;p1=p2}return p2}
function Ylm(l,m,ct,ph){const am=Math.abs(m),K=Math.sqrt((2*l+1)/(4*Math.PI)*fact(l-am)/fact(l+am)),P=Plm(l,am,ct);
  return m===0?K*P:m>0?Math.SQRT2*K*P*Math.cos(am*ph):Math.SQRT2*K*P*Math.sin(am*ph)}
/* Transmission einer Rechteckbarriere (analytisch) */
function Tbar(E,V0,a,c){if(E<=0)return 0;const k=Math.sqrt(E/c);
  if(Math.abs(E-V0)<1e-9)E+=1e-9;
  if(E<V0){const q=Math.sqrt((V0-E)/c),s=Math.sinh(q*a);return 1/(1+V0*V0*s*s/(4*E*(V0-E)))}
  const q=Math.sqrt((E-V0)/c),s=Math.sin(q*a);return 1/(1+V0*V0*s*s/(4*E*(E-V0)))}
/* ---------- Grundgerüst ---------- */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const cv=$('#cv'),ctx=cv.getContext('2d');
let CW=1,CH=1;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const fmt=(v,d=0)=>Number.isFinite(v)?v.toLocaleString('de-AT',{minimumFractionDigits:d,maximumFractionDigits:d}):'–';
const fmtS=(v,s=3)=>{if(!Number.isFinite(v))return '–';if(v===0)return '0';const d=Math.max(0,s-1-Math.floor(Math.log10(Math.abs(v))));return fmt(v,Math.min(d,6))};
const nice=x=>{const p=10**Math.floor(Math.log10(x)),m=x/p;return (m<1.5?1:m<3.5?2:m<7.5?5:10)*p};
const FONT='"Atkinson Hyperlegible",system-ui,sans-serif';
const MODES={},APP={mode:'',lvl:2,run:true};
const TAU=Math.PI*2;
const lvl=n=>APP.lvl>=n;
const C={};
const rgb=s=>{const m=s.match(/[\d.]+/g)||[0,0,0];return [+m[0],+m[1],+m[2]]};
const cs=(k,a)=>a==null?`rgb(${C[k].join(',')})`:`rgba(${C[k].join(',')},${a})`;
function readCols(){const pr=$('#probe');for(const k of ['bg','ink','mut','line','pan','red','blue','vio','fld','ok','amb','pot']){pr.style.color=`var(--${k})`;C[k]=rgb(getComputedStyle(pr).color)}}
function txt(s,x,y,col,al='left',size=13,bold=false,base='alphabetic'){ctx.font=`${bold?'700 ':''}${size}px ${FONT}`;ctx.textAlign=al;ctx.textBaseline=base;ctx.lineJoin='round';ctx.lineWidth=4;ctx.strokeStyle=cs('fld',.9);ctx.strokeText(s,x,y);ctx.fillStyle=col;ctx.fillText(s,x,y);ctx.textBaseline='alphabetic'}
function line(x1,y1,x2,y2,col,w=1,dash){ctx.strokeStyle=col;ctx.lineWidth=w;if(dash)ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();if(dash)ctx.setLineDash([])}
function arrow(x1,y1,x2,y2,col,w=2){line(x1,y1,x2,y2,col,w);const a=Math.atan2(y2-y1,x2-x1),h=8;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-h*Math.cos(a-.4),y2-h*Math.sin(a-.4));ctx.lineTo(x2-h*Math.cos(a+.4),y2-h*Math.sin(a+.4));ctx.fill()}
/* Koordinatenrahmen */
function frame(x,y,w,h,xa,xb,ya,yb){return {x,y,w,h,xa,xb,ya,yb,X:v=>x+(v-xa)/(xb-xa)*w,Y:v=>y+h-(v-ya)/(yb-ya)*h,iX:p=>xa+(p-x)/w*(xb-xa),iY:p=>ya+(y+h-p)/h*(yb-ya)}}

/* Transfermatrix für stückweise konstante Potentiale: segs = [[x_start, V], …], erstes Segment ab −∞ */
function transT(E,segs){
  const cm=(a,b)=>[a[0]*b[0]-a[1]*b[1],a[0]*b[1]+a[1]*b[0]],ca=(a,b)=>[a[0]+b[0],a[1]+b[1]],cd=(a,b)=>{const m=b[0]*b[0]+b[1]*b[1];return [(a[0]*b[0]+a[1]*b[1])/m,(a[1]*b[0]-a[0]*b[1])/m]};
  const kk=V=>{const d=(E-V)/C0;return d>=0?[Math.sqrt(d),0]:[0,Math.sqrt(-d)]};
  const ex=(k,x)=>{const r=Math.exp(-k[1]*x);return [r*Math.cos(k[0]*x),r*Math.sin(k[0]*x)]}; // e^{ikx}
  const n=segs.length;let A=[1,0],B=[0,0];// im letzten Segment: nur auslaufend
  const kl=kk(segs[n-1][1]);if(kl[0]===0)return 0;
  for(let j=n-1;j>0;j--){const x=segs[j][0],k2=kk(segs[j][1]),k1=kk(segs[j-1][1]);
    const p=ex(k2,x),m=ex([-k2[0],-k2[1]],x);const psi=ca(cm(A,p),cm(B,m)),dps=cm([-k2[1],k2[0]],ca(cm(A,p),cm([-B[0],-B[1]],m)));
    // in Segment j−1: A1 e^{ik1x}+B1 e^{−ik1x} mit gleichem ψ und ψ′
    const e1=ex(k1,x),e2=ex([-k1[0],-k1[1]],x),ik1=[-k1[1],k1[0]];
    const t=cd(dps,ik1);A=cd(ca(psi,t),[2*e1[0],2*e1[1]]);B=cd(ca(psi,[-t[0],-t[1]]),[2*e2[0],2*e2[1]])}
  const k0=kk(segs[0][1]);return (kl[0]/k0[0])/(A[0]*A[0]+A[1]*A[1])}

function chain(N,def){const L=N*a()-S.b,xa=-MG,xb=L+MG,NG=Math.round((xb-xa)/DXk)-1,xs=Float64Array.from({length:NG},(_,i)=>xa+(i+1)*DXk);const mid=Math.floor((N-1)/2);
  const V=xs.map(x=>{if(x<0||x>L)return S.V0;const j=Math.floor(x/a()),r=x-j*a();return r<S.w?(def&&j===mid?-def:0):S.V0});
  const r=eigTri(V,DXk,C0,Math.min(3*N+2,40));const E=[],P=[];r.E.forEach((e,i)=>{if(e<S.V0){E.push(e);P.push(r.P[i])}});return {xs,V,E,P,L,mid}}
function calc(){const key=[S.N,S.w,S.b,S.V0,S.def].join();if(cache&&cache.key===key)return cache;const c=chain(S.N,S.def);c.key=key;

  const A=a(),mc=c.mid*A+S.w/2;c.loc=c.P.map(p=>{if(S.def<=0||S.N<3)return false;let s=0,t=0;for(let i=0;i<p.length;i++){const q=p[i]*p[i];t+=q;if(Math.abs(c.xs[i]-mc)<A*.75)s+=q}return s/t>.45});
  c.band=c.E.map((_,i)=>Math.floor(i/S.N));c.bands=[];for(let j=0;j*S.N<c.E.length;j++){const idx=c.E.map((_,i)=>i).filter(i=>c.band[i]===j&&!c.loc[i]);if(idx.length)c.bands.push({j,lo:c.E[idx[0]],hi:c.E[idx[idx.length-1]],n:c.E.filter((_,i)=>c.band[i]===j).length})}
  if(S.sel>=c.E.length)S.sel=Math.max(0,c.E.length-1);return cache=c}
function calcSplit(){const key=[S.N,S.w,S.b,S.V0].join();if(split&&split.key===key)return split;split={key,cols:[]};for(let n=1;n<=S.N;n++)split.cols.push(chain(n,0).E);return split}
function centers(c){const A=a();return [...Array(S.N).keys()].map(j=>{const x=j*A+S.w*.3,i=clamp(Math.round((x-c.xs[0])/DXk),0,c.xs.length-1);return c.P[S.sel][i]})}
function kOf(c,i){const j=c.band[i],m=i-j*S.N+1;const me=j%2===0?m:S.N+1-m;return me*Math.PI/((S.N+1)*a())}
const P=[
 {g:'Vom Atom zum Kristall',t:'Niveaus spalten auf',d:'Ein Topf, zwei, drei … zwölf',s:{N:1,w:.6,b:.25,V0:4,sel:0,def:0,side:'split',env:false},

 {g:'Vom Atom zum Kristall',t:'Zustände in einem Band',d:'Bindend bis antibindend',s:{N:8,w:.6,b:.25,V0:4,sel:0,def:0,side:'split',env:false},

 {g:'Halbleiter',t:'Bandlücke',d:'Kein Zustand dazwischen',lvl:2,s:{N:10,w:.6,b:.25,V0:4,sel:9,def:0,side:'split',env:false},

     const cw=G.w/S.N;sp.cols.forEach((E,k)=>{const X=G.X(k+1);for(const e of E)line(X-cw*.32,G.Y(e),X+cw*.32,G.Y(e),cs('amb',k===S.N-1?1:.7),1.4);if(S.N<=8||(k+1)%2===0||k===0)txt(String(k+1),X,G.y+G.h+16,cs('mut'),'center',12)});

MODES.atom=(()=>{
const S={pi:0,auto3:true,sub:'h',n:2,l:1,m:0,plane:'xz',view:'psi',nx:1,ny:2,Lx:1,Ly:1,sup:false,nx2:2,ny2:1,veff:false};
let img=null,ikey='',pts=null,t=0,F=null,G=null,list2=[],cl3=null,k3='',rot={yaw:.7,pitch:.35},drag3=null,box3=null;
const RES=170;
const ORB={'0,0':'s','1,0':'p_z','1,1':'p_x','1,-1':'p_y','2,0':'d_z²','2,1':'d_xz','2,-1':'d_yz','2,2':'d_x²−y²','2,-2':'d_xy','3,0':'f_z³','3,1':'f_xz²','3,-1':'f_yz²','3,2':'f_z(x²−y²)','3,-2':'f_xyz','3,3':'f_x(x²−3y²)','3,-3':'f_y(3x²−y²)'};
const orbName=()=>S.n+(ORB[S.l+','+S.m]||'');
const ext=()=>2.2*S.n*S.n+4;
function hval(u,v){let x,y,z;if(S.plane==='xz'){x=u;y=0;z=v}else{x=u;y=v;z=0}const r=Math.hypot(x,y,z)||1e-9;return Rnl(S.n,S.l,r)*Ylm(S.l,S.m,z/r,Math.atan2(y,x))}
function e2(nx,ny){return C0*Math.PI**2*(nx*nx/S.Lx**2+ny*ny/S.Ly**2)}
function d2(nx,ny,u,v){return 2/Math.sqrt(S.Lx*S.Ly)*Math.sin(nx*Math.PI*u/S.Lx)*Math.sin(ny*Math.PI*v/S.Ly)}
function build(tt){const key=S.sub==='h'?['h',S.n,S.l,S.m,S.plane,S.view].join():['b',S.nx,S.ny,S.Lx,S.Ly,S.view,S.sup,S.nx2,S.ny2,S.sup?tt.toFixed(3):''].join();
  if(img&&ikey===key)return img;ikey=key;const val=new Float64Array(RES*RES),im2=new Float64Array(RES*RES);let mx=0;
  if(S.sub==='h'){const R=ext();for(let j=0;j<RES;j++)for(let i=0;i<RES;i++){const u=-R+(i+.5)/RES*2*R,v=R-(j+.5)/RES*2*R,q=hval(u,v);val[j*RES+i]=q;mx=Math.max(mx,S.view==='psi'?Math.abs(q):q*q)}}
  else{const E1=e2(S.nx,S.ny),E2=e2(S.nx2,S.ny2);for(let j=0;j<RES;j++)for(let i=0;i<RES;i++){const u=(i+.5)/RES*S.Lx,v=(1-(j+.5)/RES)*S.Ly;let a=d2(S.nx,S.ny,u,v),b=0;
      if(S.sup){const f=d2(S.nx2,S.ny2,u,v),p1=-E1*tt/HB,p2=-E2*tt/HB;b=(a*Math.sin(p1)+f*Math.sin(p2))/Math.SQRT2;a=(a*Math.cos(p1)+f*Math.cos(p2))/Math.SQRT2}
      val[j*RES+i]=a;im2[j*RES+i]=b;mx=Math.max(mx,S.view==='psi'&&!S.sup?Math.abs(a):a*a+b*b)}}
  const cvs=document.createElement('canvas');cvs.width=cvs.height=RES;const g=cvs.getContext('2d'),id=g.createImageData(RES,RES),bg=C.fld,rd=C.red,bl=C.blue,vi=C.vio;
  for(let q=0;q<RES*RES;q++){const v=val[q];let col,al;
    if(S.view==='psi'&&!(S.sub==='b'&&S.sup)){al=Math.sqrt(Math.abs(v)/mx);col=v>=0?rd:bl}else{al=Math.sqrt((v*v+im2[q]**2)/mx);col=vi}
    if(S.view==='punkte'){al=0}
    for(let ch=0;ch<3;ch++)id.data[q*4+ch]=bg[ch]+(col[ch]-bg[ch])*al;id.data[q*4+3]=255}
  g.putImageData(id,0,0);
  if(S.view==='punkte'){const w=val.map(v=>v*v);let s=0;const cdf=new Float64Array(w.length);w.forEach((v,i)=>{s+=v;cdf[i]=s});pts=[];
    for(let k=0;k<6000;k++){const u=Math.random()*s;let a=0,b=w.length-1;while(a<b){const m=(a+b)>>1;if(cdf[m]<u)a=m+1;else b=m}pts.push([(a%RES+Math.random())/RES,(Math.floor(a/RES)+Math.random())/RES])}}
  return img=cvs}
function cloud3(){const key=[S.n,S.l,S.m].join();if(cl3&&k3===key)return cl3;k3=key;const R=ext(),G3=34,w=new Float64Array(G3**3),sg=new Int8Array(G3**3);let s=0;
  for(let a=0;a<G3;a++)for(let b=0;b<G3;b++)for(let c=0;c<G3;c++){const x=-R+(a+.5)/G3*2*R,y=-R+(b+.5)/G3*2*R,z=-R+(c+.5)/G3*2*R,r=Math.hypot(x,y,z)||1e-9,q=Rnl(S.n,S.l,r)*Ylm(S.l,S.m,z/r,Math.atan2(y,x)),i=(a*G3+b)*G3+c;w[i]=q*q;sg[i]=q>=0?1:-1;s+=q*q}
  const cdf=new Float64Array(w.length);let acc=0;for(let i=0;i<w.length;i++){acc+=w[i];cdf[i]=acc}
  const P=[];for(let k=0;k<9000;k++){const u=Math.random()*s;let lo=0,hi=w.length-1;while(lo<hi){const m=(lo+hi)>>1;if(cdf[m]<u)lo=m+1;else hi=m}
    const a=Math.floor(lo/(G3*G3)),b=Math.floor(lo/G3)%G3,c=lo%G3;P.push([-R+(a+Math.random())/G3*2*R,-R+(b+Math.random())/G3*2*R,-R+(c+Math.random())/G3*2*R,sg[lo]])}
  return cl3=P}
function draw3d(x0,y0,w,h){const R=ext(),P=cloud3(),cx=x0+w/2,cy=y0+h/2,sc=w/(2.3*R),D=4*R,cy_=Math.cos(rot.yaw),sy=Math.sin(rot.yaw),cp=Math.cos(rot.pitch),sp=Math.sin(rot.pitch);
  const prj=(x,y,z)=>{const x1=x*cy_-y*sy,y1=x*sy+y*cy_;const y2=y1*cp+z*sp,z2=-y1*sp+z*cp;const f=D/(D+y2);return [cx+x1*sc*f,cy-z2*sc*f,f,y2]};
  ctx.fillStyle=cs('pan',.5);ctx.fillRect(x0,y0,w,h);
  for(const [ax,lab] of [[[1,0,0],'x'],[[0,1,0],'y'],[[0,0,1],'z']]){const a=prj(-R*ax[0],-R*ax[1],-R*ax[2]),b=prj(R*ax[0],R*ax[1],R*ax[2]);line(a[0],a[1],b[0],b[1],cs('mut',.6),1.2,[4,4]);txt(lab,b[0]+4,b[1]-4,cs('mut'),'left',13,true)}
  const Q=P.map(p=>prj(p[0],p[1],p[2]).concat(p[3])).sort((a,b)=>b[3]-a[3]);
  for(const q of Q){ctx.fillStyle=S.view3==='dichte'?cs('vio',.5):(q[4]>0?cs('red',.5):cs('blue',.5));const r=1.4*q[2];ctx.fillRect(q[0]-r,q[1]-r,2*r,2*r)}
  const k=prj(0,0,0);ctx.fillStyle=cs('ink');ctx.beginPath();ctx.arc(k[0],k[1],3,0,TAU);ctx.fill();box3=[x0,y0,w,h]}
const P=[

  why:'Im Rechteck ist ψ = sin(nₓπx/Lₓ)·sin(n_yπy/L_y) das Produkt zweier Kasten-Lösungen, E = (h²/8m)·(nₓ²/Lₓ² + n_y²/L_y²). Es gibt nₓ − 1 senkrechte und n_y − 1 waagrechte Knotenlinien – wie bei den Chladni’schen Klangfiguren einer schwingenden Platte.'},

  why:'Gleiche Energie bei verschiedenen Zuständen heißt Entartung. Sie hat eine Ursache in der Symmetrie: Das Quadrat sieht nach einer Drehung um 90° gleich aus. Wird die Symmetrie gebrochen, spaltet das Niveau auf. Genauso sind im Atom p_x, p_y, p_z entartet; ein äußeres Magnetfeld hebt das auf (Zeeman-Effekt).'},
 {g:'Zweidimensionaler Kasten',t:'Überlagerung in 2D',d:'Das Elektron kreist',lvl:2,s:{sub:'b',nx:1,ny:1,Lx:1,Ly:1,view:'prob',sup:true,nx2:2,ny2:1},
  obs:'Zwei Zustände mit verschiedener Energie sind überlagert. Beobachte |ψ|². Wähle als zweiten Zustand (1, 2) statt (2, 1). Was bleibt bei zwei entarteten Zuständen?',

  why:'Die Schrödinger-Gleichung für das Coulomb-Potential hat die Lösungen ψ = R_nl(r)·Y_lm(θ, φ). Es gibt insgesamt n − 1 Knotenflächen: l davon gehen durch den Kern (Ebenen oder Kegel, aus Y_lm), n − l − 1 sind Kugelschalen (aus R_nl). Ein Orbital ist keine Bahn, sondern eine Wahrscheinlichkeitswolke. Das Vorzeichen ist für chemische Bindungen entscheidend: Gleiche Vorzeichen überlappen bindend.'},

     !S.klass&&lvl(2)&&['Theorie oben / unten',fmt(100*T.up,1)+' % / '+fmt(100*T.dn,1)+' %'],!S.klass&&lvl(2)&&S.ns>1&&['Theorie: Anteil, der den Schirm erreicht',fmt(100*T.arrive,1)+' %']];
   let h=card('Zählung',kv(rows));
   if(lvl(3)&&!S.klass){const a=S.ns>1?th(S.ns-2)+(S['p'+(S.ns-2)]==='+'?0:Math.PI):null;h+=card('Rechnung',`<div class="formel">P(+) = cos²((θ<sub>Magnet</sub> − θ<sub>Spin</sub>)/2)<br>${a!=null?`Spin vor dem letzten Magneten: θ = ${fmt(a*180/Math.PI%360,0)}°<br>|ψ⟩ = ${fmt(Math.cos(a/2),3)}|↑⟩ + ${fmt(Math.sin(a/2),3)}|↓⟩ (bezogen auf z)`:'Quelle: Mischung aus ↑ und ↓ (je 50 %)'}</div>`)}
   return h},
 roKey(){return cnt.em},
 status(){return S.klass?'Klassische Erwartung: Die Magnete der Atome sind beliebig ausgerichtet – die Ablenkung ist kontinuierlich.':'Silberatome (ein ungepaartes Elektron) fliegen von links durch die Magnete. Jedes Atom landet einzeln auf dem Schirm.'},
 csv(){return [['Magnet','Richtung in Grad','weiter'],...[...Array(S.ns).keys()].map(i=>[i+1,S['t'+i],i<S.ns-1?S['p'+i]:'Schirm']),[],['ausgesandt','oben','unten',...[...Array(S.ns-1).keys()].map(i=>'ausgeblendet '+(i+1))],[cnt.em,cnt.up,cnt.dn,...cnt.blk.slice(0,S.ns-1)]]},
 draw(dt){if(!cnt||ckey!==ckeyNow())reset();const g=geo(),v=(g.scr-g.x0)/1.6;
   acc+=dt*S.rate;while(acc>=1){acc--;atoms.push({x:g.x0-20,f:fate(),c:S.klass?Math.random()*2-1:null,k:(Math.random()-.5)*g.dy*.12});cnt.em++}
   // Quelle
   ctx.fillStyle=cs('pot');ctx.fillRect(g.x0-60,g.cy-26,44,52);ctx.strokeStyle=cs('ink',.7);ctx.lineWidth=1.5;ctx.strokeRect(g.x0-60,g.cy-26,44,52);txt('Ofen',g.x0-38,g.cy+44,cs('mut'),'center',12,true);txt('Ag',g.x0-38,g.cy+5,cs('ink'),'center',14,true);
   line(g.x0-16,g.cy,g.scr,g.cy,cs('line'),1,[3,4]);
   for(let i=0;i<S.ns;i++){const bx=g.box(i);ctx.fillStyle=cs('pot');ctx.fillRect(bx,g.cy-g.dy*1.5,g.bw,g.dy*3);ctx.strokeStyle=cs('ink',.6);ctx.strokeRect(bx,g.cy-g.dy*1.5,g.bw,g.dy*3);
     // Polschuhe: N oben, S unten, gedreht angedeutet durch Zeiger
     const cx=bx+g.bw/2,cy=g.cy+g.dy*2.2,r=18,a=th(i);ctx.strokeStyle=cs('mut');ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.stroke();arrow(cx-Math.sin(a)*r*.2,cy+Math.cos(a)*r*.2,cx+Math.sin(a)*r,cy-Math.cos(a)*r,cs('vio'),2.5);
     txt('Magnet '+(i+1),cx,g.cy-g.dy*1.5-8,cs('ink'),'center',13,true);txt('θ = '+S['t'+i]+'° ('+axisName(S['t'+i])+')',cx,cy+r+16,cs('mut'),'center',12,true);
     if(i<S.ns-1){const e=bx+g.bw,blockUp=S['p'+i]==='-',yb=g.cy+(blockUp?-g.dy:g.dy);ctx.fillStyle=cs('ink');ctx.fillRect(e+14,yb-12,7,24);txt('Blende',e+18,yb+(blockUp?-18:30),cs('mut'),'center',11)}
     if(lvl(2)){txt('+',bx+g.bw+6,g.cy-g.dy+4,cs('red'),'left',14,true);txt('−',bx+g.bw+6,g.cy+g.dy+4,cs('blue'),'left',14,true)}}
   // Schirm
   const sx=g.scr;ctx.fillStyle=cs('pan');ctx.fillRect(sx,g.cy-g.dy*3.2,22,g.dy*6.4);ctx.strokeStyle=cs('ink',.6);ctx.strokeRect(sx,g.cy-g.dy*3.2,22,g.dy*6.4);txt('Schirm',sx+11,g.cy+g.dy*3.2+18,cs('mut'),'center',12,true);
   const ys=c=>g.cy-c*g.dy*2.2;
   ctx.fillStyle=cs('vio',.55);for(const c of hits.slice(-1500))ctx.fillRect(sx+3+Math.abs(Math.sin(c*997))*16,ys(c)-1,2.5,2.5);
   // Atome bewegen
   const keep=[];for(const a of atoms){a.x+=v*dt*(S.fast?3:1);const lastE=g.box(S.ns-1)+g.bw;
     if(a.f.blocked>=0&&a.x>g.box(a.f.blocked)+g.bw+14){cnt.blk[a.f.blocked]++;continue}
     if(a.x>=sx){if(a.c!=null){hits.push(a.c);a.c>0?cnt.up++:cnt.dn++}else{const s=a.f.out[S.ns-1];hits.push(s*(1+(Math.random()-.5)*.25));s>0?cnt.up++:cnt.dn++}if(hits.length>3000)hits.shift();continue}
     let y;if(a.c!=null){const bx=g.box(0);y=a.x<bx?g.cy:a.x<lastE?g.cy-a.c*g.dy*((a.x-bx)/g.bw)**2:g.cy-a.c*g.dy*(1+(a.x-lastE)/(sx-lastE)*1.2)}else y=yAt(a,a.x,g);
     ctx.fillStyle=cs('ink');ctx.beginPath();ctx.arc(a.x,y,3,0,TAU);ctx.fill();keep.push(a)}
   atoms=keep;
   const tot=cnt.up+cnt.dn;if(tot&&!S.klass){txt(fmt(100*cnt.up/tot,0)+' %',sx+30,ys(1)+5,cs('red'),'left',16,true);txt(fmt(100*cnt.dn/tot,0)+' %',sx+30,ys(-1)+5,cs('blue'),'left',16,true)}
 }};
})();
/* =====================================================================
   STEUERUNG
   ===================================================================== */
const cur=()=>MODES[APP.mode];
const inited={};
let deferPanel=false;
function handle(r){if(!r)return;if(r==='panel')renderPanel();else if(r==='tools')renderTools();else if(r==='all'){renderTools();renderPanel()}else if(r==='out')syncOut();else if(r==='ro')updateRo(true)}
function renderLib(){const m=cur(),S=m.S;const list=m.P.map((p,i)=>[p,i]).filter(([p])=>(p.lvl||1)<=APP.lvl);
  const groups=[];for(const [p,i] of list){let g=groups.find(q=>q.h===p.g);if(!g)groups.push(g={h:p.g,items:[]});g.items.push([p,i])}
  $('#lib').innerHTML='<h2>Aufträge</h2>'+groups.map(g=>`<h2>${g.h}</h2>`+g.items.map(([p,i])=>`<button class="pre" data-i="${i}" aria-current="${i===S.pi}"><b>${p.t}</b><span>${p.d}</span></button>`).join('')).join('');
  $('#lib').onclick=e=>{const b=e.target.closest('.pre');if(!b)return;applyPreset(+b.dataset.i);if(innerWidth<900)$('#stage').scrollIntoView({behavior:'smooth'})}}
function applyPreset(i){const m=cur(),p=m.P[i];Object.assign(m.S,JSON.parse(JSON.stringify(p.s)));m.S.pi=i;m.applied?.();renderLib();renderTools();renderPanel()}
function bindControls(root){const m=cur(),S=m.S;
  root.querySelectorAll('input[type=range][data-k]').forEach(el=>{const k=el.dataset.k;
    el.oninput=()=>{S[k]=+el.value;const o=$('#o-'+k);if(o&&FMT[k])o.textContent=FMT[k](S[k]);const r=m.changed?.(k);if(r==='panel')deferPanel=true;else handle(r)};
    el.onchange=()=>{if(deferPanel){deferPanel=false;renderPanel()}}});
  root.querySelectorAll('input[type=range][data-arr]').forEach(el=>{const a=el.dataset.arr,i=+el.dataset.i,k=(a==='c'?'c':'p')+i;
    el.oninput=()=>{S[a][i]=+el.value;const o=$('#o-'+k);if(o&&FMT[k])o.textContent=FMT[k](S[a][i]);handle(m.changed?.(k))}});
  root.querySelectorAll('[data-seg]').forEach(b=>b.onclick=()=>{const k=b.dataset.seg;let v=b.dataset.v;if(v!==''&&!isNaN(+v))v=+v;S[k]=v;const r=m.changed?.(k);renderTools();renderPanel();handle(r==='panel'||r==='tools'?null:r)});
  root.querySelectorAll('input[type=checkbox][data-k]').forEach(el=>el.onchange=()=>{S[el.dataset.k]=el.checked;const r=m.changed?.(el.dataset.k);renderPanel();handle(r==='panel'?null:r)});
  root.querySelectorAll('select[data-k]').forEach(el=>el.onchange=()=>{let v=el.value;if(v!==''&&!isNaN(+v))v=+v;S[el.dataset.k]=v;const r=m.changed?.(el.dataset.k);renderPanel();handle(r==='panel'?null:r)});
  root.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>handle(m.act?.(b.dataset.act)))}
function renderTools(){const m=cur();$('#tools').innerHTML=m.tools?.()||'';bindControls($('#tools'));m.bindTools?.()}
let lastRo='';
function renderPanel(){const m=cur();$('#panel').innerHTML=infoCard(m.P[m.S.pi])+m.panel();bindControls($('#panel'));lastRo='';updateRo(true)}
function syncOut(){const S=cur().S;$$('#panel input[type=range][data-k]').forEach(el=>{const k=el.dataset.k;el.value=S[k];const o=$('#o-'+k);if(o&&FMT[k])o.textContent=FMT[k](S[k])})}
function updateRo(force){const m=cur(),ro=$('#ro');if(!ro||!m.ro)return;const h=m.ro();if(force||h!==lastRo){if(h!==lastRo){ro.innerHTML=h;lastRo=h;m.afterRo?.()}}}
function setMode(k){if(!MODES[k])k='kasten';APP.mode=k;$$('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.mode===k)));
  try{history.replaceState(null,'','#'+k)}catch(e){}
  if(!inited[k]){inited[k]=true;applyPreset(0)}else{renderLib();renderTools();renderPanel()}}
function setLvl(n){APP.lvl=n;try{localStorage.setItem('sl-lvl',String(n))}catch(e){}$$('.lvl button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.lvl===n)));if(APP.mode){renderLib();renderTools();renderPanel()}}
$$('.tabs button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
$$('.lvl button').forEach(b=>b.onclick=()=>setLvl(+b.dataset.lvl));
$('#bFull').onclick=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};
/* CSV-Export */
const csvStr=rows=>rows.map(r=>r.map(v=>typeof v==='number'?(Number.isFinite(v)?String(Math.abs(v)<1e-12?0:+v.toPrecision(7)).replace('.',','):''):'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');
$('#bCsv').onclick=()=>{const m=cur();let rows=[['Keine Messwerte in dieser Station']];try{if(m.csv)rows=m.csv()}catch(e){console.error(e)}
  $('#csvT').value='Schrödinger-Labor – '+$('.tabs button[aria-selected=true]').textContent+'\r\n'+csvStr(rows);$('#cMsg').textContent='';$('#dlg').hidden=false;$('#cCopy').focus()};
$('#cClose').onclick=()=>{$('#dlg').hidden=true};$('#dlg').onclick=e=>{if(e.target.id==='dlg')$('#dlg').hidden=true};
addEventListener('keydown',e=>{if(e.key==='Escape')$('#dlg').hidden=true});
const selCopy=()=>{const t=$('#csvT');t.focus();t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}$('#cMsg').textContent=ok?'Kopiert.':'Text ist markiert – mit Strg+C (Mac: ⌘+C) kopieren.'};
$('#cCopy').onclick=()=>{const t=$('#csvT').value;try{navigator.clipboard.writeText(t).then(()=>{$('#cMsg').textContent='Kopiert – jetzt in Excel oder GeoGebra einfügen.'},selCopy)}catch(e){selCopy()}};
let DL=null;try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{DL=d},()=>{})}catch(e){}
$('#cDown').onclick=async()=>{const txt='\ufeff'+$('#csvT').value,name='schroedinger-'+APP.mode+'.csv';
  if(DL){try{await DL.save({filename:name,data:new Blob([txt],{type:'text/csv'})});$('#cMsg').textContent='Gespeichert als '+name+'.'}catch(e){$('#cMsg').textContent='Speichern abgebrochen oder nicht erlaubt – „Kopieren“ geht immer.'}return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();a.remove();$('#cMsg').textContent='Download gestartet ('+name+').'}catch(e){$('#cMsg').textContent='Download hier nicht möglich – bitte „Kopieren“ verwenden.'}};
/* Zeichenfläche */
function resize(){const r=$('#cvw').getBoundingClientRect(),d=devicePixelRatio||1;CW=Math.max(1,r.width);CH=Math.max(1,r.height);cv.width=Math.round(CW*d);cv.height=Math.round(CH*d);ctx.setTransform(d,0,0,d,0,0)}
const ro=new ResizeObserver(resize);ro.observe($('#cvw'));
const pos=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}const [x,y]=pos(e);handle(cur().down?.(x,y))});
cv.addEventListener('pointermove',e=>{if(!e.buttons&&e.pointerType==='mouse')return;const [x,y]=pos(e);handle(cur().move?.(x,y))});
cv.addEventListener('pointerup',()=>cur().up?.());cv.addEventListener('pointercancel',()=>cur().up?.());
/* Farben bei Themenwechsel neu lesen */
const reTheme=()=>{readCols();for(const m of Object.values(MODES))m.retheme?.()};
new MutationObserver(reTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',reTheme)}catch(e){}
/* Schleife */
let last=performance.now(),fr=0,errShown=false;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;fr++;
  ctx.clearRect(0,0,CW,CH);ctx.fillStyle=cs('fld');ctx.fillRect(0,0,CW,CH);
  try{cur().draw(dt)}catch(err){if(!errShown){errShown=true;console.error(err)}}
  if(fr%6===0){try{updateRo();const s=cur().status?.()||'';if($('#status').textContent!==s)$('#status').textContent=s}catch(err){console.error(err)}}
  requestAnimationFrame(loop)}
readCols();resize();
let L0=2;try{L0=+(localStorage.getItem('sl-lvl')||2)||2}catch(e){}
setLvl(L0);
setMode((location.hash||'').slice(1)||'kasten');
addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(MODES[k]&&k!==APP.mode)setMode(k)});
requestAnimationFrame(loop);
}
</script>
