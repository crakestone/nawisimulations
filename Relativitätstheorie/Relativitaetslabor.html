<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relativitätslabor – Lichtuhr, Gleichzeitigkeit, Zwillinge, Raumzeit</title>
<style>
  :root{
    --ink:#1d2230; --muted:#5b6477; --line:#d9dde6; --bg:#f4f6fa; --panel:#ffffff;
    --accent:#0f766e; --warn:#b91c1c; --frame:#4f46e5;
    font-size:17px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.35}
  header{display:flex;align-items:center;gap:.6rem 1rem;flex-wrap:wrap;padding:.55rem 1rem;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  header h1{font-size:1.25rem;margin:0;white-space:nowrap}
  header h1 a{color:inherit;text-decoration:none}
  header h1 a:hover{text-decoration:underline;text-underline-offset:4px}
  header h1 small{font-weight:400;color:var(--muted);font-size:.85rem;margin-left:.4rem}
  .grow{flex:1 1 auto}
  .lvl{display:flex;align-items:center;gap:.5rem}
  .lvl > span{color:var(--muted);font-size:.9rem}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#eef1f6;flex-wrap:wrap}
  .seg button{border:0;background:transparent;padding:.4rem .7rem;font:inherit;font-size:.9rem;cursor:pointer;color:var(--ink)}
  .seg button + button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--accent);color:#fff;font-weight:600}
  .seg.small{flex-wrap:nowrap}
  .seg.small button{padding:.3rem .45rem;font-size:.8rem;white-space:nowrap}
  #stSeg button{padding:.38rem .58rem;font-size:.86rem}
  .btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:.42rem .8rem;font:inherit;font-size:.92rem;cursor:pointer;color:var(--ink)}
  .btn:hover{background:#f0f3f8}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  .btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:1rem;padding:1rem;align-items:start}
  aside{display:flex;flex-direction:column;gap:.8rem}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.8rem .9rem}
  .card h2{font-size:1rem;margin:0 0 .55rem}
  .field{margin:.4rem 0 .7rem}
  .field > label{display:flex;justify-content:space-between;gap:.5rem;font-size:.9rem;margin-bottom:.15rem}
  .field > label b{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
  input[type=range]{accent-color:var(--accent);width:100%}
  input.spectrum{-webkit-appearance:none;appearance:none;height:14px;border-radius:7px;outline:none}
  input.spectrum::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid #1d2230;cursor:pointer}
  input.spectrum::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #1d2230;cursor:pointer}
  select{font:inherit;font-size:.93rem;padding:.35rem;border-radius:8px;border:1px solid var(--line);width:100%;background:#fff}
  .check{display:flex;align-items:center;gap:.5rem;margin:.35rem 0;font-size:.92rem;cursor:pointer}
  .check input{width:1.1rem;height:1.1rem;accent-color:var(--accent)}
  .btnrow{display:flex;gap:.4rem;flex-wrap:wrap;margin:.4rem 0}
  .note{font-size:.84rem;color:var(--muted);margin:.35rem 0}
  .tasks{display:flex;flex-direction:column;gap:.35rem}
  .tasks button{font:inherit;font-size:.88rem;text-align:left;border:1px solid var(--line);background:#fafbfd;border-radius:9px;padding:.4rem .55rem;cursor:pointer;color:var(--ink)}
  .tasks button:hover{background:#eef6f5;border-color:#b8dcd7}
  .tasks button.on{background:#e3f3f1;border-color:var(--accent);font-weight:600}
  #taskInfo p{margin:.45rem 0;font-size:.92rem}
  #taskInfo .q{background:#fff8e6;border:1px solid #f4dfa5;border-radius:9px;padding:.45rem .6rem}
  #taskInfo .a{background:#eef7f2;border:1px solid #c5e4d2;border-radius:9px;padding:.45rem .6rem}
  .stage{min-width:0}
  .viewbox{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;height:calc(100vh - 100px);min-height:560px}
  #cv{display:block;width:100%;height:100%;touch-action:none}
  .ovl{position:absolute;left:10px;top:10px;z-index:5;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:12px;padding:.3rem .45rem}
  .ovl .lab{font-size:.85rem;color:var(--muted);margin-left:.2rem}
  #frSeg button.on{background:var(--frame)}
  #frWrap{display:flex;gap:.4rem;align-items:center}
  .ovl .btn{padding:.3rem .6rem;font-size:.88rem}
  .ovl .seg.small button{padding:.28rem .45rem}
  @media (max-width: 900px){ .layout{grid-template-columns:1fr} aside{order:2} .viewbox{height:78vh;min-height:520px} }
</style>
</head>
<body>
<header>
  <h1><a href="../index.html" title="Zur Startseite">Relativitätslabor</a> <small>Raum und Zeit bei hohen Geschwindigkeiten</small></h1>
  <span class="grow"></span>
  <div class="lvl"><span>Welt:</span>
    <div class="seg" id="worldSeg"><button data-v="real" class="on">Echte Welt</button><button data-v="slow" title="Gedankenexperiment wie bei Mr Tompkins: Licht ist nur 20 km/h schnell">c = 20 km/h</button></div>
  </div>
  <div class="lvl"><span>Niveau:</span>
    <div class="seg" id="lvlSeg"><button data-v="easy" class="on">Einfach</button><button data-v="mid">Mittel</button><button data-v="hard">Anspruchsvoll</button></div>
  </div>

</header>
<div class="layout">
  <aside>
    <div class="card"><h2 id="ctrlTitle">Einstellungen</h2><div id="ctrl"></div></div>

        <div class="seg small" id="spdSeg"><button data-v="0.25">¼×</button><button data-v="0.5">½×</button><button data-v="1" class="on">1×</button><button data-v="2">2×</button></div>
      </div>
    </div>
  </section>
</div>

<script>
"use strict";
/* =====================================================================
   Relativitätslabor – neun Stationen:
   0 Lichtuhr & Myonen · 1 Gleichzeitigkeit · 2 Längenkontraktion · 3 Geschwindigkeiten
   4 Zwillinge · 5 Raumzeit · 6 Lichtmauer & E = mc² · 7 GPS · 8 Doppler-Effekt
   Gerechnet wird in Einheiten mit c = 1. Alle Szenen (außer 3, 6, 7) sind als Weltlinien
   im Ruhesystem des Bahnsteigs / der Erde beschrieben und werden für die Anzeige mit der
   Lorentz-Transformation in das gewählte Bezugssystem umgerechnet.
   ===================================================================== */
const $ = s => document.querySelector(s);
const C_REAL = 299792458, C_SLOW = 20/3.6;
const S = { st:0, level:'easy', task:-1, showAnswer:false, world:'real', run:true, speed:1 };
const lvlNum = () => ({easy:0, mid:1, hard:2})[S.level];
const cNow = () => S.world === 'slow' ? C_SLOW : C_REAL;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a)*t;

/* ---------- Zahlen ---------- */
function fmt(v, d){ if (!isFinite(v)) return '–'; const s = (Math.abs(v) < 0.5*Math.pow(10,-d) ? 0 : v).toFixed(d); return s.replace('-', '−').replace('.', ','); }
function grp(v, d){
  if (!isFinite(v)) return '–';
  const neg = v < 0 && Math.abs(v) >= 0.5*Math.pow(10,-d);
  const p = Math.abs(v).toFixed(d).split('.'); p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (neg ? '−' : '') + p.join(',');
}
function sig(v, n){ if (!isFinite(v)) return '–'; if (v === 0) return '0'; const e = Math.floor(Math.log10(Math.abs(v))); return grp(v, clamp(n - 1 - e, 0, 9)); }
function sup(n){ const m = {'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'}; return String(n).split('').map(c => m[c]).join(''); }
function sci(v, d){ if (v === 0) return '0'; const ex = Math.floor(Math.log10(Math.abs(v))); if (ex >= -2 && ex <= 4) return sig(v, d + 1); const m = v/Math.pow(10, ex); return fmt(m, d) + '·10' + sup(ex); }
function fmtSec(s){
  const a = Math.abs(s); if (a < 1e-15) return '0 s';
  if (a < 1e-6) return sig(s*1e9, 3) + ' ns';
  if (a < 1e-3) return sig(s*1e6, 3) + ' µs';
  if (a < 1) return sig(s*1e3, 3) + ' ms';
  return sig(s, 3) + ' s';
}
function fmtLen(u, um){
  const m = u*um, a = Math.abs(m);
  if (a >= 1e5) return sig(m/1000, 3) + ' km';
  if (a >= 1000) return grp(m/1000, 2) + ' km';
  if (a >= 10) return grp(m, 0) + ' m';
  if (a >= 0.01 || a === 0) return grp(m, 2) + ' m';
  return sig(m*1000, 3) + ' mm';
}
/* Zeit in Szenen-Einheiten (Lichtlaufzeit für eine Einheit Länge) */
const fmtTime = (u, um) => fmtSec(u*um/cNow());
function fmtV(b){ return S.world === 'slow' ? grp(b*20, Math.abs(b*20) < 10 ? 2 : 1) + ' km/h' : grp(b*299792.458, 0) + ' km/s'; }
function bTxt(b){ const a = Math.abs(b); return (a >= 0.9995 && a < 1 ? fmt(b, 5) : a >= 0.995 && a < 1 ? fmt(b, 4) : a >= 0.95 && a < 1 ? fmt(b, 3) : fmt(b, 2)) + ' c'; }
function niceStep(x){ const p = Math.pow(10, Math.floor(Math.log10(x))), m = x/p; return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10)*p; }

/* ---------- Farben des Lichts ---------- */
function nmRGB(nm){
  if (nm < 380) return [150, 90, 220];
  if (nm > 780) return [140, 30, 30];
  let r = 0, g = 0, b = 0;
  if (nm < 440){ r = -(nm-440)/60; b = 1; }
  else if (nm < 490){ g = (nm-440)/50; b = 1; }
  else if (nm < 510){ g = 1; b = -(nm-510)/20; }
  else if (nm < 580){ r = (nm-510)/70; g = 1; }
  else if (nm < 645){ r = 1; g = -(nm-645)/65; }
  else r = 1;
  const f = nm < 420 ? 0.35 + 0.65*(nm-380)/40 : nm > 700 ? 0.35 + 0.65*(780-nm)/80 : 1;
  return [r,g,b].map(v => Math.round(255*Math.pow(v*f, 0.8)));
}
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const spectrumCSS = (a, b) => { const st = []; for (let nm = a; nm <= b; nm += 10) st.push(`${rgba(nmRGB(nm),1)} ${((nm-a)/(b-a)*100).toFixed(1)}%`); return `linear-gradient(90deg,${st.join(',')})`; };
const region = nm => nm < 380 ? 'UV' : nm > 750 ? 'Infrarot' : 'sichtbar';

/* ---------- Canvas ---------- */
const cv = $('#cv'), ctx = cv.getContext('2d'), vb = $('#vb');
let W = 0, H = 0;
function resize(){
  const r = vb.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  W = r.width; H = r.height; cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
}
new ResizeObserver(resize).observe(vb);
function line(x1,y1,x2,y2,col,w,dash){ ctx.strokeStyle = col; ctx.lineWidth = w || 1; if (dash) ctx.setLineDash(dash); ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); if (dash) ctx.setLineDash([]); }
function text(t, x, y, o){
  o = o || {}; ctx.font = `${o.italic ? 'italic ' : ''}${o.weight || 500} ${o.size || 13}px ${o.mono ? 'ui-monospace,Menlo,Consolas,monospace' : 'system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif'}`;
  ctx.fillStyle = o.col || '#1d2230'; ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'middle'; ctx.fillText(t, x, y);
}
function tw(t, size, weight){ ctx.font = `${weight || 500} ${size || 13}px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif`; return ctx.measureText(t).width; }
function box(x, y, w, h, fill, stroke, r){ ctx.beginPath(); ctx.roundRect(x, y, w, h, r ?? 8); if (fill){ ctx.fillStyle = fill; ctx.fill(); } if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = 1.2; ctx.stroke(); } }
function circle(x, y, r, fill, stroke, lw){ ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI*2); if (fill){ ctx.fillStyle = fill; ctx.fill(); } if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1.2; ctx.stroke(); } }
function pill(t, x, y, o){
  o = o || {}; const sz = o.size || 12.5;
  const w = tw(t, sz, o.weight || 600) + 14, h = sz + 9;
  const bx = o.align === 'left' ? x : o.align === 'right' ? x - w : x - w/2;
  box(bx, y - h/2, w, h, o.bg || '#1d2230', o.stroke || null, 7);
  text(t, bx + w/2, y + 0.5, {col:o.col || '#fff', align:'center', weight:o.weight || 600, size:sz});
  return w;
}
function wrapText(t, x, y, maxW, o){
  o = o || {}; const sz = o.size || 13, fnt = `${o.weight || 500} ${sz}px ${o.mono ? 'ui-monospace,Menlo,Consolas,monospace' : 'system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif'}`; ctx.font = fnt;
  const words = String(t).split(' '); let ln = '';
  const lh = sz + 5;
  for (const w of words){
    const test = ln ? ln + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && ln){ text(ln, x, y, o); y += lh; ln = w; ctx.font = fnt; } else ln = test;
  }
  if (ln){ text(ln, x, y, o); y += lh; }
  return y;
}
function arrow(x1,y1,x2,y2,col,w){
  line(x1,y1,x2,y2,col,w || 2);
  const a = Math.atan2(y2-y1, x2-x1), h = 7 + (w || 2);
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(x2 - h*Math.cos(a-0.45), y2 - h*Math.sin(a-0.45)); ctx.lineTo(x2 - h*Math.cos(a+0.45), y2 - h*Math.sin(a+0.45)); ctx.fill();
}
function dimArrow(x1, x2, y, col, label){
  line(x1, y, x2, y, col, 1.5);
  for (const [xa, d] of [[x1, 1], [x2, -1]]){ ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(xa, y); ctx.lineTo(xa + d*8, y - 4); ctx.lineTo(xa + d*8, y + 4); ctx.fill(); line(xa, y - 7, xa, y + 7, col, 1.5); }
  if (label) pill(label, (x1 + x2)/2, y - 14, {bg:'#fff', col, stroke:col, size:12});
}
function clip(r){ ctx.save(); ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h); ctx.clip(); }
/* Infotafel rechts bzw. unten */
function card(r, title){ box(r.x, r.y, r.w, r.h, '#fbfcfe', '#d9dde6', 12); if (title) text(title, r.x + 14, r.y + 20, {weight:700, size:15}); return r.y + 44; }
function para(x, y, maxW, arr){
  for (const l of arr){
    if (!l) continue;
    if (typeof l === 'string') y = wrapText(l, x, y, maxW, {size:13.5});
    else if (l.gap) y += l.gap;
    else if (l.kv){ text(l.kv[0], x, y, {size:l.size || 13.5, col:l.col0 || '#5b6477'}); text(l.kv[1], x + maxW, y, {size:l.size || 13.5, align:'right', weight:700, col:l.col || '#1d2230', mono:l.mono}); y += (l.size || 13.5) + 7; }
    else y = wrapText(l.t, x, y, maxW, Object.assign({size:13.5}, l));
  }
  return y;
}
/* Aufteilung der Zeichenfläche: Szene + Infotafel */
function lay(sideW){
  const top = 62;
  if (W >= 880){ const sw = Math.min(sideW || 380, W*0.4); return { wide:true, scene:{x:12, y:top, w:W - sw - 36, h:H - top - 12}, side:{x:W - sw - 12, y:top, w:sw, h:H - top - 12} }; }
  const sh = clamp(H*0.44, 250, 520);
  return { wide:false, scene:{x:10, y:top, w:W - 20, h:H - sh - top - 18}, side:{x:10, y:H - sh - 8, w:W - 20, h:sh} };
}
function clockFace(x, y, r, frac, col, sub){
  circle(x, y, r, '#fff', col, 2.2);
  for (let k = 0; k < 12; k++){ const a = k/12*Math.PI*2; line(x + Math.sin(a)*r*0.78, y - Math.cos(a)*r*0.78, x + Math.sin(a)*r*0.92, y - Math.cos(a)*r*0.92, '#9aa3b5', 1.2); }
  const a = frac*Math.PI*2; ctx.lineCap = 'round'; line(x, y, x + Math.sin(a)*r*0.78, y - Math.cos(a)*r*0.78, col, 2.6); ctx.lineCap = 'butt';
  circle(x, y, 2.5, col);
  if (sub) text(sub, x, y + r + 12, {align:'center', size:12, weight:700, col});
}
function person(x, y, col, s){
  s = s || 1;
  circle(x, y - 30*s, 7*s, col);
  ctx.strokeStyle = col; ctx.lineWidth = 3.2*s; ctx.lineCap = 'round'; ctx.beginPath();
  ctx.moveTo(x, y - 22*s); ctx.lineTo(x, y - 9*s); ctx.moveTo(x, y - 9*s); ctx.lineTo(x - 6*s, y); ctx.moveTo(x, y - 9*s); ctx.lineTo(x + 6*s, y);
  ctx.moveTo(x - 8*s, y - 18*s); ctx.lineTo(x + 8*s, y - 18*s); ctx.stroke(); ctx.lineCap = 'butt';
}
function flash(x, y, r, a){
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1);
  const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, 'rgba(255,250,200,1)'); g.addColorStop(0.4, 'rgba(255,214,10,.8)'); g.addColorStop(1, 'rgba(255,200,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill(); ctx.restore();
}
function bolt(x, y1, y2){
  ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 3.5; ctx.lineJoin = 'round'; ctx.beginPath();
  const n = 5; ctx.moveTo(x, y1); for (let i = 1; i <= n; i++){ ctx.lineTo(x + (i % 2 ? 9 : -6), y1 + (y2 - y1)*i/n); } ctx.lineTo(x, y2); ctx.stroke();
}

/* =====================================================================
   Lorentz-Transformation (c = 1)
   Ereignis im Bahnsteig-/Erdsystem (t, x)  →  Sichtsystem mit Geschwindigkeit u
   ===================================================================== */
const gam = u => 1/Math.sqrt(1 - u*u);
const V = { u:0, T:0, fi:0, rate:2 };
function toV(t, x, u){ if (u === undefined) u = V.u; const g = gam(u); return [g*(t - u*x), g*(x - u*t)]; }
function toG(tp, xp, u){ if (u === undefined) u = V.u; const g = gam(u); return [g*(tp + u*xp), g*(xp + u*tp)]; }
const relV = (w, u) => (w - u)/(1 - w*u);
/* Weltlinie x = x0 + w·t: Zeit im Bahnsteigsystem, zu der das Sichtsystem die Zeit T anzeigt */
function solveLin(x0, w, T, u){ if (T === undefined) T = V.T; if (u === undefined) u = V.u; return (T/gam(u) + u*x0)/(1 - u*w); }
function placeLin(x0, w, T, u){ if (T === undefined) T = V.T; if (u === undefined) u = V.u; const t = solveLin(x0, w, T, u); return { t, x: gam(u)*(x0 + w*t - u*t) }; }
/* beliebige Weltlinie x(t) (|dx/dt| ≤ 1): Bisektion */
function placeFn(xf, X, T, u){
  if (T === undefined) T = V.T; if (u === undefined) u = V.u;
  const g = gam(u); let t;
  if (Math.abs(u) < 1e-12) t = T;
  else { let lo = T/g - Math.abs(u)*X - 1, hi = T/g + Math.abs(u)*X + 1; for (let i = 0; i < 48; i++){ const m = (lo + hi)/2; if (g*(m - u*xf(m)) < T) lo = m; else hi = m; } t = (lo + hi)/2; }
  return { t, x: g*(xf(t) - u*t) };
}
/* Lichtstrahl ab Ereignis e trifft Weltlinie x0 + w·t */
function rayHit(e, x0, w){
  const xo = x0 + w*e.t; if (Math.abs(xo - e.x) < 1e-9) return e.t;
  return xo > e.x ? (x0 - e.x + e.t)/(1 - w) : (e.x + e.t - x0)/(1 + w);
}

/* ---------- Minkowski-Diagramm (im aktuellen Sichtsystem) ---------- */
function mink(r, o){
  const u = o.u === undefined ? V.u : o.u;
  box(r.x, r.y, r.w, r.h, '#fff', '#d9dde6', 10);
  if (o.title) text(o.title, r.x + 10, r.y + 13, {size:12.5, weight:700, col:'#5b6477'});
  const top = o.title ? 24 : 6;
  const R = {x:r.x + 4, y:r.y + top, w:r.w - 8, h:r.h - top - 4};
  const [x0, x1, t0, t1] = o.range;

const DO = { v:0.4, lam:550, cls:false, quer:false, P:1.1, R:13, yq:6 };
function doFrames(){ return [{lab:'Beobachter (Erde)', u:() => 0}, {lab:'Quelle (Rakete)', u:() => DO.v}]; }
function doControls(){
  UI.speed('Geschwindigkeit der Rakete', () => DO.v, v => DO.v = v, {after:snapFrame, min:0.01, max:0.95});

  if (lvlNum() >= 1) UI.check('Vergleich: Rechnung ohne Zeitdilatation', () => DO.cls, c => DO.cls = c);
  if (lvlNum() >= 2) UI.check('Dritte Person seitlich der Flugbahn', () => DO.quer, c => DO.quer = c);
  UI.note('Die Kreise sind Wellenberge des Lichts. Der Abstand der Wellenberge ist der Anschaulichkeit halber riesig vergrößert. Die Farbe bei den Personen zeigt, was sie tatsächlich sehen.');
}
function doRecv(xo, yo, to){
  const v = DO.v, a = v*v - 1, B = 2*(to - v*xo), C = xo*xo + yo*yo - to*to, disc = Math.sqrt(Math.max(0, B*B - 4*a*C));
  const te = Math.min((-B + disc)/(2*a), (-B - disc)/(2*a));
  const dx = xo - v*te, d = Math.hypot(dx, yo), cos = d > 1e-9 ? dx/d : 0;
  return { te, cos, ratio:gam(v)*(1 - v*cos), cl:1 - v*cos };
}
function doDraw(){
  const L = lay(400), sc = L.scene, v = DO.v, g = gam(v), u = V.u, R = DO.R;
  const k = sc.w/(2*R + 6), cx = sc.x + sc.w/2, cy = sc.y + sc.h*0.5, X = x => cx + x*k, Y = y => cy - y*k;
  clip(sc); box(sc.x, sc.y, sc.w, sc.h, '#0b1020', null, 0);

    const te = n*Pg, [tv, xv] = toV(te, v*te), rr = V.T - tv; if (rr <= 0 || rr > 2.2*R) continue;

  const res = [];

  if (Math.abs(relV(v, u)) > 0.02) arrow(X(pr.x) - 30, cy - 34, X(pr.x) + 30*Math.sign(relV(v, u)) - (Math.sign(relV(v, u)) < 0 ? 0 : 0), cy - 34, '#fde68a', 2.5);

    ...res.map(q => ({kv:['bei der Person ' + q.o.n, Math.round(q.lam) + ' nm (' + region(q.lam) + ')' + (DO.cls && lvlNum() >= 1 ? ' · ohne ZD: ' + Math.round(q.cl) + ' nm' : '')], col:rgba(nmRGB(q.lam), 1).replace('rgba', 'rgba')})),

  const grd = ctx.createLinearGradient(nm2x(380), 0, nm2x(780), 0); for (let nm = 380; nm <= 780; nm += 20) grd.addColorStop((nm - 380)/400, rgba(nmRGB(nm), 1));

  mk(DO.lam, 'ausgesandt', true); res.forEach((q, i) => { const px = nm2x(q.lam); line(px, sy - 4, px, sy + 24, '#1d2230', 2); text(q.o.n, px, i === 1 ? sy - 10 : sy + 32 + (i === 2 ? 13 : 0), {align:'center', size:11, weight:700}); });
  y = sy + 60;

    lvlNum() >= 1 ? {t:'λ = λ₀·√((1 + β)/(1 − β))  (Quelle entfernt sich)', mono:true, size:12} : null,

    DO.cls && lvlNum() >= 1 ? 'Ohne Zeitdilatation (wie beim Schall) wäre λ = λ₀·(1 ∓ β). Weil die Uhr der Rakete langsamer geht, sendet sie ihre Wellenberge seltener aus: Alle Wellenlängen sind um γ = ' + fmt(g, 3) + ' länger.' : null,
    DO.quer && lvlNum() >= 2 ? 'Seitlich: Licht, das an der Stelle des kleinsten Abstands ausgesandt wird, kommt um γ rotverschoben an (transversaler Doppler-Effekt) – klassisch gäbe es dort keine Verschiebung.' : null

}

function renderTasks(){
  const el = $('#tasks'); el.innerHTML = '';
  TASKS[S.st].forEach((t, k) => {
    if (t.min > lvlNum()) return;
    const b = document.createElement('button'); b.textContent = t.n; b.classList.toggle('on', k === S.task);
    b.onclick = () => { S.task = k; S.showAnswer = false; t.setup(); buildControls(); frameReset(); renderTasks(); };
    el.appendChild(b);
  });
  const info = $('#taskInfo');
  const t = TASKS[S.st][S.task];
  if (!t || t.min > lvlNum()){ info.innerHTML = '<p class="note">Wähle einen Auftrag oder probiere frei aus.</p>'; return; }
  info.innerHTML = `<p class="q"><b>Auftrag:</b> ${t.q}</p>` + (S.showAnswer ? `<p class="a">${t.a}</p>` : '') + `<button class="btn" id="ansBtn">${S.showAnswer ? 'Erklärung ausblenden' : 'Erklärung zeigen'}</button>`;
  $('#ansBtn').onclick = () => { S.showAnswer = !S.showAnswer; renderTasks(); };
}

function curFrames(){ const st = STATIONS[S.st]; return st.frames ? st.frames() : null; }
function curFrameName(){ const fr = curFrames(); return fr ? fr[Math.min(V.fi, fr.length - 1)].lab : ''; }
const pivotX = () => { const st = STATIONS[S.st]; return st.pivot ? st.pivot() : 0; };
function buildFrameSeg(){
  const fr = curFrames(), seg = $('#frSeg'); seg.innerHTML = '';
  $('#frWrap').style.display = fr && fr.length > 1 ? '' : 'none';
  if (!fr) return;
  fr.forEach((f, i) => { const b = document.createElement('button'); b.textContent = f.lab; b.classList.toggle('on', i === V.fi); b.onclick = () => setFrame(i); seg.appendChild(b); });
}
function setFrame(i){ const fr = curFrames(); if (!fr || i >= fr.length) return; V.fi = i; V.rate = Math.max(0.6, Math.abs(Math.atanh(fr[i].u()) - Math.atanh(V.u))/1.1); buildFrameSeg(); }
function frameReset(){ V.fi = 0; V.u = 0; buildFrameSeg(); stReset(); }
function snapFrame(){ const fr = curFrames(); if (!fr) return; const tgt = fr[Math.min(V.fi, fr.length - 1)].u(); const [tg, xg] = toG(V.T, pivotX(), V.u); V.u = tgt; V.T = toV(tg, xg, tgt)[0]; }
function setRun(r){ S.run = r; $('#playBtn').textContent = r ? '⏸ Pause' : '▶ Start'; }
function stReset(){ const st = STATIONS[S.st]; if (st.rate) st.rate(); V.T = st.start ? st.start() : 0; setRun(true); }
function frameStep(dt){
  const fr = curFrames(); if (!fr){ V.u = 0; return; }
  if (V.fi >= fr.length){ V.fi = 0; buildFrameSeg(); }
  const tgt = fr[V.fi].u();
  if (Math.abs(tgt - V.u) > 1e-9){
    const p0 = Math.atanh(V.u), p1 = Math.atanh(tgt), stp = V.rate*dt;
    const p = Math.abs(p1 - p0) <= stp ? p1 : p0 + Math.sign(p1 - p0)*stp, nu = Math.tanh(p);
    const [tg, xg] = toG(V.T, pivotX(), V.u); V.u = nu; V.T = toV(tg, xg, nu)[0];
  }
}
function buildControls(){ UI.clear(); $('#ctrlTitle').textContent = 'Einstellungen: ' + STATIONS[S.st].name; STATIONS[S.st].controls(); }
function setStation(i){
  S.st = i; S.task = -1; S.showAnswer = false;
  for (const b of $('#stSeg').children) b.classList.toggle('on', +b.dataset.s === i);
  buildControls(); renderTasks(); frameReset();
  try { history.replaceState(null, '', '#' + STATIONS[i].hash); } catch(_){}
}
function setLevel(l){
  S.level = l; for (const b of $('#lvlSeg').children) b.classList.toggle('on', b.dataset.v === l);
  if (l !== 'hard'){ if (LK.scene !== 'tunnel'){ LK.scene = 'tunnel'; if (S.st === 2) frameReset(); } ZW.simul = false; GP.korr = false; DO.quer = false; RZ.hyp = false; }
  if (l === 'easy'){ GL.clocks = false; RZ.grid2 = false; DO.cls = false; LM.part = 'e'; }
  buildControls(); renderTasks();
}
$('#stSeg').innerHTML = STATIONS.map((s, i) => `<button data-s="${i}">${s.name}</button>`).join('');
$('#stSeg').onclick = e => { const b = e.target.closest('button'); if (b) setStation(+b.dataset.s); };
$('#lvlSeg').onclick = e => { const b = e.target.closest('button'); if (b) setLevel(b.dataset.v); };
$('#worldSeg').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.world = b.dataset.v; for (const x of $('#worldSeg').children) x.classList.toggle('on', x === b); buildControls(); };
$('#spdSeg').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.speed = +b.dataset.v; for (const x of $('#spdSeg').children) x.classList.toggle('on', x === b); };
$('#playBtn').onclick = () => { const st = STATIONS[S.st]; if (!S.run && st.end && V.T >= st.end() - 1e-6) stReset(); else setRun(!S.run); };
$('#resetBtn').onclick = () => stReset();
$('#fsBtn').onclick = () => { const d = document; try { if (d.fullscreenElement) d.exitFullscreen(); else d.documentElement.requestFullscreen().catch(() => {}); } catch(_){} };
let dragging = false;
cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect(), st = STATIONS[S.st];
  if (st.click && st.click(e.clientX - r.left, e.clientY - r.top)){ dragging = true; cv.setPointerCapture(e.pointerId); }
});
cv.addEventListener('pointermove', e => { if (!dragging) return; const r = cv.getBoundingClientRect(), st = STATIONS[S.st]; if (st.move) st.move(e.clientX - r.left, e.clientY - r.top); });
cv.addEventListener('pointerup', () => { dragging = false; RZ.drag = -1; });
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === ' '){ $('#playBtn').click(); e.preventDefault(); }
  if (e.key === 'r' || e.key === 'R') stReset();
  if (e.key === 'b' || e.key === 'B'){ const fr = curFrames(); if (fr && fr.length > 1) setFrame((V.fi + 1) % fr.length); }
});
let last = performance.now();
function frame(ts){
  const dt = Math.min(0.05, (ts - last)/1000); last = ts;
  const st = STATIONS[S.st];
  frameStep(dt);
  if (S.run){
    V.T += dt*S.speed*(st.rate ? st.rate() : 1);
    if (st.end){ const e = st.end(); if (V.T >= e){ V.T = e; setRun(false); } }
  } else if (st.rate) st.rate();
  ctx.clearRect(0, 0, W, H);
  try { st.draw(dt); } catch (err){ console.error(err); }
  requestAnimationFrame(frame);
}
resize();
const startHash = STATIONS.findIndex(s => s.hash === location.hash.slice(1));
setStation(startHash >= 0 ? startHash : 0);
requestAnimationFrame(frame);
</script>
