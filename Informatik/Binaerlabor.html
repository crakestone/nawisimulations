<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Binärlabor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday school lab, calm and exact, legible on a projector
   IDEA the electronics kit on the desk: switches, lamps, logic chips, a breadboard, the column sum in the exercise book
   PICTURE the live canvas (bit lamps, gates with glowing wires, adder chains, column arithmetic)
   COLOUR white ground, dark ink; signal 1 orange, signal 0 grey, A blue, B magenta, carry violet, accent cyan (Informatik)
   TYPE Atkinson Hyperlegible, JetBrains Mono for bits
   LAYOUT laptop: experiments | stage | panel; phone: stage, panel, experiments */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#10161b);--ink:light-dark(#14212b,#e6ecf1);--mut:light-dark(#5a6772,#9babb7);--line:light-dark(#dde3e8,#29343d);--pan:light-dark(#f2f5f7,#18212a);--fld:light-dark(#ffffff,#0c1115);
  --on:light-dark(#e8590c,#ff8a3d);--off:light-dark(#aab4bd,#4a5661);--acc:light-dark(#0e7490,#22b8cf);--a:light-dark(#2762c9,#6198ff);--b:light-dark(#c2255c,#f06595);--c:light-dark(#7b3cc4,#bb90ff);--ok:light-dark(#1f7a4d,#53c98a);--no:light-dark(#d6336c,#ff6b8b);--amb:light-dark(#c27a0e,#f2b443)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
button,select,input{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{flex:none}
h1{font-size:26px;line-height:1.05;margin:0;letter-spacing:-.02em}
h1 a{color:inherit;text-decoration:none}
h1 a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.tabs{display:flex;gap:3px;background:var(--pan);padding:4px;border-radius:12px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 11px;border-radius:9px;cursor:pointer;font-weight:700;min-height:40px}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.btn{border:1px solid var(--line);background:var(--bg);padding:7px 12px;border-radius:9px;cursor:pointer;min-height:38px;white-space:nowrap}
.btn:hover{border-color:var(--mut)}
.btn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.hot{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
.tsep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.lvl{display:flex;gap:3px;background:var(--pan);padding:4px;border-radius:12px}
.lvl button{border:0;background:none;padding:6px 9px;border-radius:8px;cursor:pointer;font-size:14px;min-height:34px}
.lvl button[aria-pressed=true]{background:var(--bg);box-shadow:0 0 0 1px var(--line);font-weight:700}
main{display:grid;grid-template-columns:250px minmax(0,1fr) 340px;min-height:0}
#lib{overflow:auto;border-right:1px solid var(--line);padding:12px}
#lib h2{font-size:13px;color:var(--mut);margin:14px 4px 6px;font-weight:700}
#lib h2:first-child{margin-top:2px}
.pre{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px}
.pre b{display:block;font-size:15px}
.pre span{display:block;font-size:13px;color:var(--mut);line-height:1.3}
.pre:hover{background:var(--pan)}
.pre[aria-current=true]{background:var(--pan);box-shadow:inset 3px 0 0 var(--acc)}
#stage{display:flex;flex-direction:column;min-height:0}
#tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);min-height:55px}
#cvw{position:relative;flex:1;min-height:320px;background:var(--fld)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#status{font-size:13px;color:var(--mut);padding:5px 12px;border-top:1px solid var(--line);min-height:28px}
#panel{overflow:auto;border-left:1px solid var(--line);padding:6px 14px 20px}
.card{border-bottom:1px solid var(--line);padding:10px 0 12px}
.card:last-child{border-bottom:0}
.card h3{font-size:17px;margin:0 0 6px;line-height:1.2}
.card p{margin:4px 0}
.obs{background:var(--pan);border-radius:10px;padding:9px 11px;margin:6px 0}
details summary{cursor:pointer;font-weight:700;margin-top:6px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;margin:8px 0 2px;font-size:14px}
.row output{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--acc);height:26px;margin:0}
.seg{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.seg button{flex:1 1 auto;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;cursor:pointer;min-height:36px;font-size:14px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chk{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px}
.chk label{display:flex;align-items:center;gap:6px;min-height:32px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--acc)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;font-size:15px;margin-top:6px}
.kv b{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.formel{background:var(--pan);border-radius:10px;padding:9px 11px;font-size:15px;line-height:1.7;margin-top:6px;font-variant-numeric:tabular-nums;overflow-x:auto}
.mono,.inp.mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace}
.small{font-size:13px;color:var(--mut)}
.big{font-size:clamp(28px,4vw,40px);font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.inp{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--bg);font-size:16px;min-height:40px;width:9em;flex:1 1 8em}
.fl{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:6px 8px;align-items:center;margin-top:6px}
.fl label{font-size:14px;color:var(--mut)}
.fl .inp{width:100%}
.res{font-weight:700;margin-top:6px}
.res.ok{color:var(--ok)}.res.no{color:var(--no)}
.tt{border-collapse:collapse;font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;font-size:14px;margin-top:6px}
.tt th,.tt td{border:1px solid var(--line);padding:3px 9px;text-align:center}
.tt th{background:var(--pan)}
.tt tr.cur td{background:color-mix(in srgb,var(--on) 18%,transparent);font-weight:700}
.tt td.o{font-weight:700}
.tt td.bad{color:var(--no)}
.tt tbody tr{cursor:pointer}
.ttw{overflow:auto;max-height:430px}
.on{color:var(--on);font-weight:700}.ca{color:var(--a);font-weight:700}.cb{color:var(--b);font-weight:700}.cc{color:var(--c);font-weight:700}.cok{color:var(--ok);font-weight:700}
.sch{border-collapse:collapse;font-size:18px;margin-top:4px}
.sch th{padding:1px 8px 1px 0;color:var(--mut);font-weight:700;text-align:right}
.sch td{padding:1px 5px;text-align:center;min-width:1.1em}
.sch tr.tl td{border-top:2px solid var(--ink)}
.sch td.sv{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:13px;color:var(--mut);text-align:left;padding-left:12px}
.sch td.bad{color:var(--no);font-weight:700}.sch td.on{color:var(--on);font-weight:700}.sch td.ca{color:var(--a)}.sch td.cb{color:var(--b)}.sch td.cc{color:var(--c);font-size:13px}
#probe{display:none}
@media(max-width:1150px){main{grid-template-columns:215px minmax(0,1fr) 300px}.tabs button{padding:8px 8px}}
@media(max-width:900px){
  html,body,#app{height:auto}
  main{grid-template-columns:minmax(0,1fr)}
  #stage{order:1}
  #cvw{flex:none;height:min(64vh,560px)}
  #panel{order:2;border:0;border-top:1px solid var(--line);overflow:visible}
  #lib{order:3;border:0;border-top:1px solid var(--line);overflow:visible}
  h1{font-size:22px}
}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="2.5" y="6" width="13" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="2.4"/><text x="9" y="22.5" font-size="14" font-weight="700" text-anchor="middle" fill="currentColor" font-family="sans-serif">0</text><rect x="18.5" y="6" width="13" height="22" rx="3" fill="#e8590c"/><text x="25" y="22.5" font-size="14" font-weight="700" text-anchor="middle" fill="#fff" font-family="sans-serif">1</text></svg>
    <h1><a href="../index.html" title="Zur Startseite">Binärlabor</a></h1>
  </div>
  <nav class="tabs" role="tablist" aria-label="Stationen">
    <button role="tab" data-mode="zahlen">Zahlensysteme</button>
    <button role="tab" data-mode="gatter">Logikgatter</button>
    <button role="tab" data-mode="bauen">Schaltungen bauen</button>
    <button role="tab" data-mode="addierer">Addierer</button>
    <button role="tab" data-mode="minus">Negative Zahlen</button>
    <button role="tab" data-mode="rechner">Binärrechner</button>
  </nav>
  <div class="lvl" role="group" aria-label="Niveau"><button data-lvl="1">Einfach</button><button data-lvl="2">Mittel</button><button data-lvl="3">Anspruchsvoll</button></div>
  <button class="btn" id="bFull">Vollbild</button>
</header>
<main>
  <aside id="lib" aria-label="Versuche"></aside>
  <section id="stage">
    <div id="tools"></div>
    <div id="cvw"><canvas id="cv" aria-label="Simulation"></canvas></div>
    <div id="status"></div>
  </section>
  <aside id="panel" aria-label="Einstellungen"></aside>
</main>
</div>
<div id="probe"></div>
<script>
{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const cv=$('#cv'),ctx=cv.getContext('2d'),PN=$('#panel'),TL=$('#tools');
let CW=1,CH=1,DPR=1;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const PI=Math.PI,TAU=PI*2;
const mod=(x,m)=>((x%m)+m)%m;
const FONT='"Atkinson Hyperlegible",system-ui,sans-serif',MONO='"JetBrains Mono",ui-monospace,Consolas,monospace';
const MODES={},APP={mode:'',frame:0,lvl:2};
const lvlShow=n=>APP.lvl>=n;
const F=v=>(v<0?'−':'')+Math.abs(v).toLocaleString('de-AT');
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const bitsOf=(v,n)=>{const r=[];for(let i=n-1;i>=0;i--)r.push((v>>>i)&1);return r};
/* Binärzahl mit Vierergruppen */
function bstr(v,n,gap=' '){let s='';for(let i=n-1;i>=0;i--){s+=(v>>>i)&1;if(i&&i%4===0)s+=gap}return s}
const hstr=(v,n)=>(v>>>0).toString(16).toUpperCase().padStart(Math.ceil(n/4),'0');
const ostr=v=>(v>>>0).toString(8);
const sub2=s=>s+'₂';
const SUPD='⁰¹²³⁴⁵⁶⁷⁸⁹',sup=n=>String(n).split('').map(c=>SUPD[+c]).join('');
const signed=(v,n)=>v>=2**(n-1)?v-2**n:v;

/* ---------- Farben ---------- */
const C={};
const rgb=s=>{const m=s.match(/[\d.]+/g)||[0,0,0];return [+m[0],+m[1],+m[2]]};
const cs=(k,a)=>a==null?`rgb(${C[k].join(',')})`:`rgba(${C[k].join(',')},${a})`;
const CK=['bg','ink','mut','line','pan','fld','on','off','acc','a','b','c','ok','no','amb'];
function readCols(){const pr=$('#probe');for(const k of CK){pr.style.color=`var(--${k})`;C[k]=rgb(getComputedStyle(pr).color)}}

/* ---------- Weltkoordinaten: jede Station zeichnet in einer festen Fläche ---------- */
const V={s:1,ox:0,oy:0,w:1000,h:600};
function bg(){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle=cs('fld');ctx.fillRect(0,0,CW,CH)}
function view(w,h){V.w=w;V.h=h;V.s=Math.min((CW-12)/w,(CH-12)/h);V.ox=(CW-w*V.s)/2;V.oy=(CH-h*V.s)/2;ctx.setTransform(DPR*V.s,0,0,DPR*V.s,DPR*V.ox,DPR*V.oy)}
const wx=x=>(x-V.ox)/V.s,wy=y=>(y-V.oy)/V.s;
/* Tippflächen, die beim Zeichnen angelegt werden */
let HITS=[];
const hit=(x,y,w,h,fn,data)=>HITS.push({x,y,w,h,fn,data});
function hitAt(x,y){for(let i=HITS.length-1;i>=0;i--){const h=HITS[i];if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h)return h}return null}

function txt(s,x,y,col,al='left',size=14,bold=false,font=FONT){ctx.font=`${bold?'700 ':''}${size}px ${font}`;ctx.textAlign=al;ctx.lineJoin='round';ctx.lineWidth=4;ctx.strokeStyle=cs('fld',.92);ctx.strokeText(s,x,y);ctx.fillStyle=col;ctx.fillText(s,x,y)}
function txtn(s,x,y,col,al='left',size=14,bold=false,font=FONT){ctx.font=`${bold?'700 ':''}${size}px ${font}`;ctx.textAlign=al;ctx.fillStyle=col;ctx.fillText(s,x,y)}
function tw(s,size,bold=false,font=FONT){ctx.font=`${bold?'700 ':''}${size}px ${font}`;return ctx.measureText(s).width}
function line(x1,y1,x2,y2,col,w=1,dash){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';if(dash)ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();if(dash)ctx.setLineDash([])}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function box(x,y,w,h,r,fill,stroke,lw=2){rr(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function dot(x,y,r,col){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=col;ctx.fill()}
function arrow(x1,y1,x2,y2,col,w=2.5,hs=9){line(x1,y1,x2,y2,col,w);const a=Math.atan2(y2-y1,x2-x1);ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-hs*Math.cos(a-.45),y2-hs*Math.sin(a-.45));ctx.lineTo(x2-hs*Math.cos(a+.45),y2-hs*Math.sin(a+.45));ctx.closePath();ctx.fillStyle=col;ctx.fill()}
/* Leitung: Signal 1 orange und dick, Signal 0 grau */
const sigCol=v=>v?cs('on'):cs('off');
function wire(pts,v,w){ctx.strokeStyle=sigCol(v);ctx.lineWidth=w||(v?4:3);ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.stroke()}
const orth=(x1,y1,x2,y2,mx)=>{if(Math.abs(y1-y2)<.5)return [[x1,y1],[x2,y2]];mx=mx==null?(x1+x2)/2:mx;return [[x1,y1],[mx,y1],[mx,y2],[x2,y2]]};
const knot=(x,y,v)=>dot(x,y,5,sigCol(v));

/* ---------- Gatter ---------- */
const GT={
 AND:{de:'UND',din:'&',neg:false,f:a=>a.every(x=>x)},
 OR:{de:'ODER',din:'≥1',neg:false,f:a=>a.some(x=>x)},
 NOT:{de:'NICHT',din:'1',neg:true,f:a=>!a[0]},
 NAND:{de:'NAND',din:'&',neg:true,f:a=>!a.every(x=>x)},
 NOR:{de:'NOR',din:'≥1',neg:true,f:a=>!a.some(x=>x)},
 XOR:{de:'XOR',din:'=1',neg:false,f:a=>a.reduce((s,x)=>s^x,0)===1},
 XNOR:{de:'XNOR',din:'=',neg:true,f:a=>a.reduce((s,x)=>s^x,0)===0}
};
const gEval=(t,a)=>GT[t].f(a)?1:0;
const GW=74;
const gH=n=>Math.max(58,n*26+6);
/* Lage der Anschlüsse eines Gatters, Körper links oben bei (x,y) */
function gPins(t,x,y,n){if(t==='NOT')n=1;const h=gH(n),ins=[];for(let i=0;i<n;i++)ins.push([x-18,n===1?y+h/2:y+h*(i+1)/(n+1)]);return {ins,out:[x+GW+18,y+h/2],h}}
let NORM='din';
function drawGate(t,x,y,n,ins,out,opt={}){if(t==='NOT')n=1;const P=gPins(t,x,y,n),h=P.h,ym=y+h/2,g=GT[t],w=GW;
  const ink=opt.col||cs('ink'),fill=opt.fill||cs('fld');
  /* Eingangsstummel */
  P.ins.forEach((p,i)=>{let x2=x;if(NORM==='us'&&(t==='OR'||t==='NOR'||t==='XOR'||t==='XNOR')){const u=(p[1]-y)/h;x2=x+.5*w*.5*u*(1-u)*2}wire([[p[0],p[1]],[x2+1,p[1]]],ins[i]??0,3.5)});
  const bub=g.neg;
  wire([[bub?x+w+12:x+w,ym],P.out],out??0,3.5);
  ctx.lineWidth=2.6;ctx.strokeStyle=ink;ctx.fillStyle=fill;ctx.lineJoin='round';
  if(opt.secret){rr(x,y,w,h,6);ctx.fill();ctx.stroke();txtn('?',x+w/2,ym+11,ink,'center',30,true)}
  else if(NORM==='din'){rr(x,y,w,h,4);ctx.fill();ctx.stroke();txtn(g.din,x+w/2,y+24,ink,'center',21,true)}
  else{ctx.beginPath();
    if(t==='AND'||t==='NAND'){const r=h/2;ctx.moveTo(x,y);ctx.lineTo(x+w-r,y);ctx.arc(x+w-r,ym,r,-PI/2,PI/2);ctx.lineTo(x,y+h);ctx.closePath()}
    else if(t==='NOT'){ctx.moveTo(x+4,y+6);ctx.lineTo(x+w-2,ym);ctx.lineTo(x+4,y+h-6);ctx.closePath()}
    else{ctx.moveTo(x,y);ctx.quadraticCurveTo(x+w*.55,y,x+w,ym);ctx.quadraticCurveTo(x+w*.55,y+h,x,y+h);ctx.quadraticCurveTo(x+w*.25,ym,x,y)}
    ctx.fill();ctx.stroke();
    if(t==='XOR'||t==='XNOR'){ctx.beginPath();ctx.moveTo(x-9,y);ctx.quadraticCurveTo(x-9+w*.25,ym,x-9,y+h);ctx.stroke()}}
  if(bub&&!opt.secret){ctx.beginPath();ctx.arc(x+w+6,ym,6,0,TAU);ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=2.4;ctx.strokeStyle=ink;ctx.stroke()}
  if(opt.label)txt(opt.label,x+w/2,y-8,cs('mut'),'center',13,true);
  return P}
/* Schalter als Eingang: Mitte (cx,cy), Ausgang rechts */
function drawSwitch(cx,cy,name,v,fn,opt={}){const w=opt.w||66,h=opt.h||46,x=cx-w/2,y=cy-h/2;
  box(x,y,w,h,10,v?cs('on'):cs('pan'),v?cs('on'):cs('ink'),2.4);
  txtn(v?'1':'0',cx,cy+10,v?'#fff':cs('ink'),'center',27,true,MONO);
  if(name)txt(name,opt.right?x+w+10:x-10,cy+7,opt.col||cs('ink'),opt.right?'left':'right',opt.size||20,true);
  if(fn)hit(x-6,y-6,w+12,h+12,fn);
  return [x+w,cy]}
/* Lämpchen als Ausgang: Eingang links */
function drawLamp(cx,cy,r,v,name,opt={}){
  if(v){const g=ctx.createRadialGradient(cx,cy,r*.3,cx,cy,r*2.3);g.addColorStop(0,cs('on',.45));g.addColorStop(1,cs('on',0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r*2.3,0,TAU);ctx.fill()}
  ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fillStyle=v?cs('on'):cs('pan');ctx.fill();ctx.lineWidth=2.4;ctx.strokeStyle=v?cs('on'):cs('ink');ctx.stroke();
  txtn(v==null?'?':v?'1':'0',cx,cy+r*.36,v?'#fff':cs('mut'),'center',r*.95,true,MONO);
  if(name){if(opt.below)txt(name,cx,cy+r+22,opt.col||cs('ink'),'center',opt.size||20,true);else txt(name,opt.left?cx-r-10:cx+r+10,cy+7,opt.col||cs('ink'),opt.left?'right':'left',opt.size||20,true)}
  return [cx-r,cy]}
/* Wahrheitstafel auf der Bühne */
function drawTable(x,y,heads,rows,nIn,cur,opt={}){const cw=opt.cw||46,rh=opt.rh||34,W=heads.length*cw;
  box(x,y,W,rh,6,cs('pan'));
  heads.forEach((hd,j)=>txtn(hd,x+cw*j+cw/2,y+rh/2+6,j<nIn?cs('ink'):cs('on'),'center',16,true));
  rows.forEach((r,i)=>{const yy=y+rh*(i+1);

function contact(x1,x2,y,nc,pressed,label,fn,v){const closed=nc?!pressed:pressed,col=v?cs('on'):cs('ink');

  if(nc){line(x2,y,x2,y-L*.12-4,cs('ink'),2.5)}
  /* Taster-Knopf */
  const mx=x1+L*.55,my=y+Math.sin(a)*L*.55,top=y-Math.min(L*.45,50)-(pressed?0:10);
  line(mx,my-3,mx,top+10,cs('mut'),2,[4,4]);box(mx-16,top-4,32,14,4,pressed?cs('on'):cs('pan'),cs('ink'),2);

    steps.forEach((s,k)=>tr.push(cell(la+2+ld+k,s.q,'on',k+1)));P.rows.push({lab:'',cells:tr});
    P.ex[0]=`Wir nehmen so viele Stellen von A, bis ${sd}₂ hineinpasst.`;
    steps.forEach((s,k)=>{const last=k===steps.length-1,v=last?s.r:s.r*2+ +sa[s.i+1],bs=bin(v),endc=last?s.i:s.i+1,cl=[];
      [...bs].forEach((x,j)=>cl.push(cell(endc-bs.length+1+j,x,last?'c':'ink',k+1,{bring:!last&&j===bs.length-1})));P.rows.push({lab:'',cells:cl});
      P.hl[k+1]=s.i;P.ex[k+1]=`${bin(s.cur)}₂ (${s.cur}) : ${sd}₂ (${b}) → ${s.q?`passt einmal, schreibe 1, Rest ${bin(s.r)}₂`:'passt nicht, schreibe 0'}`+(last?`. Ergebnis: ${F(a)} : ${F(b)} = ${F(q)} Rest ${F(r)}.`:', nächste Ziffer herunterholen.')});
    P.n=steps.length;P.res=q;P.rem=r;return P}
  return P}
function rLoad(i){R.pi=i;const p=RP[i];if(p.lvl&&APP.lvl<p.lvl)setLvl(p.lvl,true);Object.assign(R,{b:0,play:false},p.s);rClampStep();rTools();rPanel();renderLib('Versuche: Binärrechner',RP,i,rLoad)}
function rClampStep(){const P=rPlan();R.step=clamp(R.step,0,P.n)}
function rTools(){TL.innerHTML=`<button class="btn hot" id="rStep">Schritt</button><button class="btn" id="rBack">Zurück</button><button class="btn" id="rAll">Alles</button><button class="btn" id="rReset">Von vorn</button><button class="btn" id="rPlay" aria-pressed="${R.play}">${R.play?'Anhalten':'Abspielen'}</button>`;
  TL.onclick=e=>{const b=e.target.closest('button');if(!b)return;const P=rPlan();
    if(b.id==='rStep')R.step=Math.min(P.n,R.step+1);if(b.id==='rBack')R.step=Math.max(0,R.step-1);if(b.id==='rAll')R.step=P.n;if(b.id==='rReset')R.step=0;
    if(b.id==='rPlay'){R.play=!R.play;if(R.play&&R.step>=P.n)R.step=0;R.acc=0;rTools()}}}
function rPanel(){const p=RP[R.pi];let h=infoCard(p);
  h+=`<div class="card"><h3>Rechenart</h3>${seg('ro',ROPS,R.op)}${rUsesN()?'<div class="row"><span>Bits</span></div>'+seg('rn',[['4',4],['8',8],['16',16]],R.n):''}</div>`;
  const lb=R.op==='shl'||R.op==='shr'?'Schritte':'B';
  h+=`<div class="card"><h3>Zahlen</h3><div class="fl"><label for="rA" class="ca">A</label><input class="inp" id="rA" inputmode="numeric" autocomplete="off">${rOne()?'':`<label for="rB" class="cb">${lb}</label><input class="inp" id="rB" inputmode="numeric" autocomplete="off">`}</div><div class="small" id="rRange"></div><div class="kv" id="rIn"></div></div>`;
  h+=`<div class="card"><h3>Ergebnis</h3><div class="kv" id="rKV"></div><div class="res" id="rRes"></div>${R.op==='xor'?'<button class="btn" id="rTake" style="margin-top:8px">Ergebnis als A übernehmen</button>':''}</div>`;
  if(R.op==='sub')h+=`<div class="card"><h3>Hinweis</h3><p class="small">Hier wird mit dem Ergänzungsverfahren gerechnet wie in der Schule. Ein Computer rechnet A + (−B) mit dem Zweierkomplement, siehe Station „Negative Zahlen“.</p></div>`;
  PN.innerHTML=h;
  PN.onclick=e=>{const b=e.target.closest('button');if(!b)return;const P0=rPlan(),full=R.step>=P0.n;
    if(b.dataset.ro){R.op=b.dataset.ro;if(R.op==='shl'||R.op==='shr')R.b=Math.min(R.b,R.n);if(R.op==='div'&&R.b===0)R.b=1;R.step=full?99:0;rClampStep();rPanel();return}
    if(b.dataset.rn){R.n=+b.dataset.rn;R.a&=rMask();R.b=R.op==='shl'||R.op==='shr'?Math.min(R.b,R.n):R.b&rMask();if(full)R.step=99;rClampStep();rPanel();return}
    if(b.id==='rTake'){const P=rPlan();R.a=P.res;if(full)R.step=99;rClampStep()}};
  PN.oninput=e=>{const id=e.target.id;if(id!=='rA'&&id!=='rB')return;const v=parseNum(e.target.value,10);const mx=rUsesN()?rMask():1023;
    const hi=id==='rB'&&(R.op==='shl'||R.op==='shr')?R.n:mx;if(v==null||v<0||v>hi){setTxt('rRange',`Bitte eine ganze Zahl von 0 bis ${hi}.`);return}setTxt('rRange','');
    const P0=rPlan(),full=R.step>=P0.n;R[id==='rA'?'a':'b']=v;if(full)R.step=99;rClampStep()}}
function rDraw(){bg();view(1000,560);HITS=[];const P=rPlan(),st=R.step;
  if(P.note){txt(P.note,500,280,cs('no'),'center',26,true);return}
  const W=P.W,cw=Math.min(54,(840)/W),gx=960-W*cw;
  const nBig=P.rows.filter(r=>!r.small).length,rh=Math.min(60,410/Math.max(1,nBig)),sh=Math.min(30,rh*.55),fs=Math.min(34,rh*.62,cw*.72);
  let y=60;const ys=[];P.rows.forEach(r=>{ys.push(y);y+=r.small?sh:rh});const bottom=y;
  const hc=P.hl[st];if(hc!=null&&st>0)box(gx+hc*cw+2,40,cw-4,bottom-30,8,cs('acc',.12));
  P.rows.forEach((r,k)=>{const yy=ys[k]+(r.small?sh*.75:rh*.66);
    if(r.lab)txt(r.lab,gx-16,yy,r.small?cs('c'):cs('ink'),'right',r.small?15:Math.min(26,fs*.8),true);
    r.cells.forEach(c=>{if(c.s>st)return;const x=gx+c.c*cw+cw/2,col=cs(c.col==='ink'?'ink':c.col);
      txtn(c.t,x,yy,col,'center',r.small?Math.min(20,fs*.62):fs,true,MONO);
      if(c.strike)line(x-cw*.32,yy-fs*.7,x+cw*.32,yy+fs*.1,cs('no'),2.5);
      if(c.bring)line(x-cw*.3,yy+6,x+cw*.3,yy+6,cs('acc'),2.5)})});
  P.rules.forEach(rl=>{if(rl.s>st)return;const yy=ys[rl.after+1]-2;line(gx-8,yy+(P.rows[rl.after+1]?.small?0:2),960,yy+2,cs('ink'),2)});
  /* bei Strich unter Ü-Zeile: Linie vor der Ergebniszeile */
  const ex=P.ex[Math.min(st,P.n)]||'';let fsz=19;while(fsz>13&&tw(ex,fsz,true)>950)fsz--;
  if(tw(ex,fsz,true)>950){const words=ex.split(' ');let l1='';for(const w of words){if(tw(l1+' '+w,fsz,true)>930)break;l1+=(l1?' ':'')+w}txt(l1,500,505,cs('ink'),'center',fsz,true);txt(ex.slice(l1.length).trim(),500,532,cs('ink'),'center',fsz,true)}
  else txt(ex,500,520,cs('ink'),'center',fsz,true);
  if(st<P.n)txtn(`Schritt ${st} von ${P.n}`,40,40,cs('mut'),'left',13,true);else txtn('fertig',40,40,cs('ok'),'left',13,true)}
function rUpd(){const P=rPlan(),n=R.n;syncVal('rA',R.a);syncVal('rB',R.b);
  const ib=rUsesN()?n:Math.max(1,bin(Math.max(R.a,R.b)).length);
  setHTML('rIn',`<span class="ca">A binär</span><b class="mono">${rUsesN()?bstr(R.a,n):bin(R.a)}</b>${rOne()||R.op==='shl'||R.op==='shr'?'':`<span class="cb">B binär</span><b class="mono">${rUsesN()?bstr(R.b,n):bin(R.b)}</b>`}`);
  if(P.res==null){setHTML('rKV','');setHTML('rRes',P.note);return}
  const sym={add:'+',sub:'−',mul:'·',div:':',and:'UND',or:'ODER',xor:'XOR',shl:'⇐',shr:'⇒'}[R.op];
  let txtR=R.op==='not'?`NICHT ${R.a} = ${P.res}`:`${R.a} ${sym} ${R.b} = ${F(P.res)}`+(R.op==='div'?` Rest ${P.rem}`:'');
  const bs=P.res<0?'−'+bin(-P.res):bin(P.res);
  setHTML('rKV',`<span>Dezimal</span><b>${F(P.res)}${R.op==='div'?' Rest '+P.rem:''}</b><span>Binär</span><b class="mono">${bs}₂</b>${lvlShow(2)&&P.res>=0?`<span>Hex</span><b class="mono">${P.res.toString(16).toUpperCase()}</b>`:''}${R.op==='or'||R.op==='xor'||R.op==='and'?`<span>als ASCII-Zeichen</span><b>${P.res>=33&&P.res<127?'„'+String.fromCharCode(P.res)+'“':'–'}</b>`:''}`);
  let warn='';if(R.op==='add'&&P.res>rMask())warn=`Überlauf: ${F(P.res)} passt nicht in ${n} Bit, übrig bleiben ${F(P.res&rMask())}.`;
  if(R.op==='mul'&&P.res>255)warn=`Das Produkt braucht ${bin(P.res).length} Bit.`;
  setHTML('rRes',warn?`<span style="color:var(--no)">${warn}</span>`:`<span class="cok">${txtR}</span>`);
  $('#status').textContent='Schriftliches Rechnen im Zweiersystem. „Schritt“ zeigt die nächste Spalte bzw. Zeile.'}
MODES.rechner={enter(){if(!R.init){R.init=true;rLoad(0)}else{rTools();rPanel();renderLib('Versuche: Binärrechner',RP,R.pi,rLoad)}},panel:rPanel,
  frame(dt){if(R.play){R.acc+=dt;if(R.acc>1.1){R.acc=0;const P=rPlan();if(R.step<P.n)R.step++;else{R.play=false;rTools()}}}},
  draw:rDraw,upd:rUpd,down:tapDown,move(){},up(){},key(k){if(k===' '||k==='ArrowRight'){$('#rStep')?.click();return true}if(k==='ArrowLeft'){$('#rBack')?.click();return true}return false}};

/* =====================================================================
   Start, Umschalten, Schleife
   ===================================================================== */
function fit(){const r=$('#cvw').getBoundingClientRect();DPR=Math.min(2,devicePixelRatio||1);CW=Math.max(50,r.width);CH=Math.max(50,r.height);cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR)}
const ro=new ResizeObserver(()=>fit());ro.observe($('#cvw'));
const thObs=new MutationObserver(()=>readCols());thObs.observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readCols)}catch(e){}
function setMode(m){if(!MODES[m])m='zahlen';if(m===APP.mode)return;APP.mode=m;
  $$('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.mode===m)));HITS=[];MODES[m].enter();MODES[m].upd()}
function setLvl(l,quiet){APP.lvl=l;try{localStorage.setItem('bin-lvl',String(l))}catch(e){}$$('.lvl button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.lvl===l)));if(quiet)return;MODES[APP.mode].panel();MODES[APP.mode].upd()}
$$('.tabs button').forEach(b=>b.onclick=()=>{location.hash=b.dataset.mode;setMode(b.dataset.mode)});
$$('.lvl button').forEach(b=>b.onclick=()=>setLvl(+b.dataset.lvl));
addEventListener('hashchange',()=>setMode(location.hash.slice(1)));
$('#bFull').onclick=()=>{const d=document;try{if(d.fullscreenElement)d.exitFullscreen();else d.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};
const pos=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}MODES[APP.mode].down(...pos(e))});
cv.addEventListener('pointermove',e=>MODES[APP.mode].move(...pos(e)));
const up=()=>MODES[APP.mode].up();cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key===' '&&e.target.tagName==='BUTTON')return;if(MODES[APP.mode].key(e.key,e))e.preventDefault()});
let lv=2;try{lv=+localStorage.getItem('bin-lvl')||2;NORM=localStorage.getItem('bin-norm')==='us'?'us':'din'}catch(e){}APP.lvl=clamp(lv,1,3);$$('.lvl button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.lvl===APP.lvl)));
readCols();fit();setMode(location.hash.slice(1)||'zahlen');
document.fonts?.ready?.then(()=>{});
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;APP.frame++;const M=MODES[APP.mode];try{M.frame(dt);M.draw();if(APP.frame%6===0)M.upd()}catch(err){console.error(err)}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
}
</script>
