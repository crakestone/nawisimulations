<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halbleiterlabor – Bänder, Dotierung, Diode, Solarzelle, LED</title>
<style>
  :root{
    --ink:#1d2230; --muted:#5b6477; --line:#d9dde6; --bg:#f4f6fa; --panel:#ffffff;
    --accent:#0f766e; --warn:#b91c1c;
    font-size:17px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.35}
  header{display:flex;align-items:center;gap:.7rem 1.1rem;flex-wrap:wrap;padding:.6rem 1rem;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  header h1{font-size:1.25rem;margin:0;flex:1 1 auto;white-space:nowrap}
  header h1 a{color:inherit;text-decoration:none}
  header h1 a:hover{text-decoration:underline;text-underline-offset:4px}
  header h1 small{font-weight:400;color:var(--muted);font-size:.85rem;margin-left:.4rem}
  .lvl{display:flex;align-items:center;gap:.5rem}
  .lvl > span{color:var(--muted);font-size:.9rem}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#eef1f6;flex-wrap:wrap}
  .seg button{border:0;background:transparent;padding:.42rem .7rem;font:inherit;font-size:.92rem;cursor:pointer;color:var(--ink)}
  .seg button + button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--accent);color:#fff;font-weight:600}
  .seg.small{flex-wrap:nowrap}
  .seg.small button{padding:.3rem .45rem;font-size:.8rem;white-space:nowrap}
  .btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:.42rem .8rem;font:inherit;font-size:.92rem;cursor:pointer;color:var(--ink)}
  .btn:hover{background:#f0f3f8}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  .layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:1rem;padding:1rem;align-items:start}
  aside{display:flex;flex-direction:column;gap:.8rem}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.8rem .9rem}
  .card h2{font-size:1rem;margin:0 0 .55rem}
  .field{margin:.4rem 0 .7rem}
  .field > label{display:flex;justify-content:space-between;gap:.5rem;font-size:.9rem;margin-bottom:.15rem}
  .field > label b{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
  input[type=range]{accent-color:var(--accent);width:100%}
  input.spectrum{-webkit-appearance:none;appearance:none;height:14px;border-radius:7px;outline:none}
  input.spectrum::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid #1d2230;cursor:pointer}
  input.spectrum::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #1d2230;cursor:pointer}
  select{font:inherit;font-size:.93rem;padding:.35rem;border-radius:8px;border:1px solid var(--line);width:100%;background:#fff}
  .check{display:flex;align-items:center;gap:.5rem;margin:.35rem 0;font-size:.92rem;cursor:pointer}
  .check input{width:1.1rem;height:1.1rem;accent-color:var(--accent)}
  .btnrow{display:flex;gap:.4rem;flex-wrap:wrap;margin:.4rem 0}
  .note{font-size:.84rem;color:var(--muted);margin:.35rem 0}
  .tasks{display:flex;flex-direction:column;gap:.35rem}
  .tasks button{font:inherit;font-size:.88rem;text-align:left;border:1px solid var(--line);background:#fafbfd;border-radius:9px;padding:.4rem .55rem;cursor:pointer;color:var(--ink)}
  .tasks button:hover{background:#eef6f5;border-color:#b8dcd7}
  .tasks button.on{background:#e3f3f1;border-color:var(--accent);font-weight:600}
  #taskInfo p{margin:.45rem 0;font-size:.92rem}
  #taskInfo .q{background:#fff8e6;border:1px solid #f4dfa5;border-radius:9px;padding:.45rem .6rem}
  #taskInfo .a{background:#eef7f2;border:1px solid #c5e4d2;border-radius:9px;padding:.45rem .6rem}
  .stage{min-width:0}
  .viewbox{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;height:calc(100vh - 100px);min-height:560px}
  #cv{display:block;width:100%;height:100%;touch-action:none}
  @media (max-width: 900px){ .layout{grid-template-columns:1fr} aside{order:2} .viewbox{height:75vh;min-height:460px} }
</style>
</head>
<body>
<header>
  <h1><a href="../index.html" title="Zur Startseite">Halbleiterlabor</a> <small>vom Bändermodell zur Solarzelle</small></h1>
  <div class="seg" id="stSeg"><button data-s="0" class="on">Bänder</button><button data-s="1">Dotierung</button><button data-s="2">Photoeffekt</button><button data-s="3">Diode</button><button data-s="4">Solarzelle</button><button data-s="5">LED</button></div>
  <div class="lvl"><span>Niveau:</span>
    <div class="seg" id="lvlSeg"><button data-v="easy" class="on">Einfach</button><button data-v="mid">Mittel</button><button data-v="hard">Anspruchsvoll</button></div>
  </div>
  <button class="btn" id="fsBtn">Vollbild</button>
</header>
<div class="layout">
  <aside>
    <div class="card"><h2 id="ctrlTitle">Einstellungen</h2><div id="ctrl"></div></div>
    <div class="card"><h2>Aufträge</h2><div class="tasks" id="tasks"></div><div id="taskInfo"></div></div>
  </aside>
  <section class="stage">
    <div class="viewbox" id="vb"><canvas id="cv"></canvas></div>
  </section>
</div>

<script>
"use strict";
/* =====================================================================
   Halbleiterlabor – sechs Stationen:
   0 Bändermodell · 1 Dotierung · 2 Photoeffekt außen & innen
   3 pn-Übergang (Diode) · 4 Solarzelle · 5 LED
   ===================================================================== */
const $ = s => document.querySelector(s);
const HC = 1239.84193;               /* h·c in eV·nm */
const KB = 8.617333e-5;              /* Boltzmann-Konstante in eV/K */
const QE = 1.602176634e-19, C_LIGHT = 2.99792458e8, H_PL = 6.62607015e-34;
const S = { st:0, level:'easy', task:-1, showAnswer:false };
const lvlNum = () => ({easy:0, mid:1, hard:2})[S.level];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random()*(b - a);

/* ---------- Zahlen und Farben ---------- */
function fmt(v, d){ if (!isFinite(v)) return '–'; return (Math.abs(v) < 0.5*Math.pow(10,-d) ? 0 : v).toFixed(d).replace('.', ','); }
function sup(n){ const m = {'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'}; return String(n).split('').map(c => m[c]).join(''); }
function sci(v, d){ if (v === 0) return '0'; const ex = Math.floor(Math.log10(Math.abs(v))); const m = v/Math.pow(10,ex); return fmt(m,d) + '·10' + sup(ex); }
function fmtI(I){ const a = Math.abs(I), s = I < 0 ? '−' : ''; if (a >= 1) return s + fmt(a, 2) + ' A'; if (a >= 1e-3) return s + fmt(a*1000, a < 0.01 ? 2 : 1) + ' mA'; if (a >= 1e-6) return s + fmt(a*1e6, 1) + ' µA'; if (a >= 1e-9) return s + fmt(a*1e9, 1) + ' nA'; return s + fmt(a*1e12, 1) + ' pA'; }
function fmtR(R){ if (R >= 1e6) return fmt(R/1e6, 1) + ' MΩ'; if (R >= 1e3) return fmt(R/1e3, 1) + ' kΩ'; return fmt(R, R < 10 ? 2 : 0) + ' Ω'; }
function nmRGB(nm){
  if (nm < 380) return [150, 90, 220];
  if (nm > 780) return [120, 30, 30];
  let r = 0, g = 0, b = 0;
  if (nm < 440){ r = -(nm-440)/60; b = 1; }
  else if (nm < 490){ g = (nm-440)/50; b = 1; }
  else if (nm < 510){ g = 1; b = -(nm-510)/20; }
  else if (nm < 580){ r = (nm-510)/70; g = 1; }
  else if (nm < 645){ r = 1; g = -(nm-645)/65; }
  else r = 1;
  const f = nm < 420 ? 0.35 + 0.65*(nm-380)/40 : nm > 700 ? 0.35 + 0.65*(780-nm)/80 : 1;
  return [r,g,b].map(v => Math.round(255*Math.pow(v*f, 0.8)));
}
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const spectrumCSS = (a, b) => { const st = []; const step = (b - a)/60; for (let nm = a; nm <= b + 1e-9; nm += step) st.push(`${rgba(nmRGB(nm),1)} ${((nm-a)/(b-a)*100).toFixed(1)}%`); return `linear-gradient(90deg,${st.join(',')})`; };
const region = nm => nm < 380 ? 'UV' : nm > 750 ? 'Infrarot' : 'sichtbar';

/* ---------- Canvas ---------- */
const cv = $('#cv'), ctx = cv.getContext('2d'), vb = $('#vb');
let W = 0, H = 0;
function resize(){
  const r = vb.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  W = r.width; H = r.height; cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
}
new ResizeObserver(resize).observe(vb);
function line(x1,y1,x2,y2,col,w){ ctx.strokeStyle = col; ctx.lineWidth = w || 1; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
function dline(x1,y1,x2,y2,col,w,dash){ ctx.save(); ctx.setLineDash(dash || [5,4]); line(x1,y1,x2,y2,col,w); ctx.restore(); }
function text(t, x, y, o){
  o = o || {}; ctx.font = `${o.weight || 500} ${o.size || 13}px ${o.mono ? 'ui-monospace,Menlo,Consolas,monospace' : 'system-ui'}`;
  ctx.fillStyle = o.col || '#1d2230'; ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'middle'; ctx.fillText(t, x, y);
}
function box(x, y, w, h, fill, stroke, r){ ctx.beginPath(); ctx.roundRect(x, y, w, h, r ?? 8); if (fill){ ctx.fillStyle = fill; ctx.fill(); } if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = 1.2; ctx.stroke(); } }
function circle(x, y, r, fill, stroke, lw){ ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); if (fill){ ctx.fillStyle = fill; ctx.fill(); } if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1.5; ctx.stroke(); } }
function pill(t, x, y, o){
  o = o || {}; ctx.font = `${o.weight || 600} ${o.size || 13}px system-ui`;
  const w = ctx.measureText(t).width + 14, h = (o.size || 13) + 10;
  const bx = o.align === 'left' ? x : o.align === 'right' ? x - w : x - w/2;
  box(bx, y - h/2, w, h, o.bg || '#10231f', o.border || null, 8);
  text(t, bx + w/2, y + 0.5, {col:o.col || '#7ff5d2', align:'center', weight:o.weight || 600, size:o.size || 13});
}
function wrapText(t, x, y, maxW, o){
  o = o || {}; ctx.font = `${o.weight || 500} ${o.size || 13}px system-ui`;
  const words = t.split(' '); let ln = ''; const lh = (o.size || 13) + 4;
  for (const w of words){ const test = ln ? ln + ' ' + w : w; if (ctx.measureText(test).width > maxW && ln){ text(ln, x, y, o); y += lh; ln = w; } else ln = test; }
  if (ln){ text(ln, x, y, o); y += lh; }
  return y;
}
function arrow(x1,y1,x2,y2,col,w){
  line(x1,y1,x2,y2,col,w || 2);
  const a = Math.atan2(y2-y1, x2-x1), h = 7 + (w || 2);
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(x2 - h*Math.cos(a-0.45), y2 - h*Math.sin(a-0.45)); ctx.lineTo(x2 - h*Math.cos(a+0.45), y2 - h*Math.sin(a+0.45)); ctx.fill();
}
function wiggle(x, y, ang, len, col, amp, lw){
  ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.strokeStyle = col; ctx.lineWidth = lw || 2.2; ctx.beginPath();
  for (let k = 0; k <= 24; k++){ const t = k/24, px = -len/2 + t*len, env = Math.sin(Math.PI*t); ctx.lineTo(px, env*(amp || 4)*Math.sin(t*Math.PI*6)); }
  ctx.stroke(); ctx.restore();
}
function heat(x, y, a){ /* kleine Wärmewellen */
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = '#ea580c'; ctx.lineWidth = 1.6;
  for (let k = -1; k <= 1; k++){ ctx.beginPath(); for (let s = 0; s <= 10; s++){ const yy = y - s*1.6, xx = x + k*6 + Math.sin(s*1.2)*2.2; s ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); } ctx.stroke(); }
  ctx.restore();
}
function hole(x, y, r){ circle(x, y, r, '#fff', '#dc2626', 1.8); text('+', x, y + 0.5, {align:'center', size:Math.round(r*1.5), weight:700, col:'#dc2626'}); }
function elec(x, y, r){ circle(x, y, r, '#1d4ed8'); }
/* Diagrammrahmen mit Achsen */
function plot(r, o){
  box(r.x, r.y, r.w, r.h, '#f8fafc', '#e2e8f0', 12);
  if (o.title) text(o.title, r.x + 12, r.y + 16, {weight:700, size:13});
  const L = r.x + (o.left || 50), R = r.x + r.w - (o.right || 14), T = r.y + (o.title ? 36 : 14), B = r.y + r.h - 30;
  const X = v => L + (v - o.x0)/(o.x1 - o.x0)*(R - L), Y = v => B - (v - o.y0)/(o.y1 - o.y0)*(B - T);
  for (const v of o.xt || []){ line(X(v), T, X(v), B, '#e5e9f0', 1); text(o.xf ? o.xf(v) : String(v), X(v), B + 10, {align:'center', size:10, col:'#64748b'}); }
  for (const v of o.yt || []){ line(L, Y(v), R, Y(v), v === 0 ? '#94a3b8' : '#e5e9f0', 1); text(o.yf ? o.yf(v) : String(v), L - 5, Y(v), {align:'right', size:10, col:'#64748b'}); }
  line(L, T, L, B, '#64748b', 1.2); line(L, B, R, B, '#64748b', 1.2);
  if (o.xl) text(o.xl, R, B + 22, {align:'right', size:11, col:'#475569'});
  if (o.yl) text(o.yl, L + 4, T - 8, {size:11, col:'#475569'});
  return { X, Y, L, R, T, B };
}
function clipTo(p){ ctx.save(); ctx.beginPath(); ctx.rect(p.L, p.T - 2, p.R - p.L, p.B - p.T + 4); ctx.clip(); }
function linFit(pts){
  const n = pts.length; if (n < 2) return null;
  const sx = pts.reduce((a,q) => a + q.f, 0), sy = pts.reduce((a,q) => a + q.e, 0), sxx = pts.reduce((a,q) => a + q.f*q.f, 0), sxy = pts.reduce((a,q) => a + q.f*q.e, 0);
  const den = n*sxx - sx*sx; if (Math.abs(den) < 1e-12) return null;
  const m = (n*sxy - sx*sy)/den; return { m, b:(sy - m*sx)/n };
}

/* ---------- Bedienelemente links ---------- */
const UI = {
  el: $('#ctrl'),
  clear(){ this.el.innerHTML = ''; },
  slider(label, o){
    const d = document.createElement('div'); d.className = 'field';
    d.innerHTML = `<label><span>${label}</span><b></b></label><input type="range" min="${o.min}" max="${o.max}" step="${o.step}">`;
    const b = d.querySelector('b'), inp = d.querySelector('input');
    if (o.cls) inp.className = o.cls; if (o.bg) inp.style.background = o.bg;
    inp.value = o.get(); b.innerHTML = o.fmt(o.get());
    inp.oninput = () => { o.set(+inp.value); b.innerHTML = o.fmt(+inp.value); };
    d.refresh = () => { inp.value = o.get(); b.innerHTML = o.fmt(o.get()); };
    this.el.appendChild(d); return d;
  },
  select(label, opts, get, set){
    const d = document.createElement('div'); d.className = 'field';
    d.innerHTML = `<label><span>${label}</span></label><select>${opts.map(([v,t]) => `<option value="${v}">${t}</option>`).join('')}</select>`;
    const s = d.querySelector('select'); s.value = get(); s.onchange = () => set(s.value);
    this.el.appendChild(d); return d;
  },
  seg(label, opts, get, set){
    const d = document.createElement('div'); d.className = 'field';
    d.innerHTML = (label ? `<label><span>${label}</span></label>` : '') + `<div class="seg small">${opts.map(([v,t]) => `<button data-v="${v}">${t}</button>`).join('')}</div>`;
    const btns = [...d.querySelectorAll('button')];
    const upd = () => btns.forEach(b => b.classList.toggle('on', b.dataset.v === String(get())));
    btns.forEach(b => b.onclick = () => { set(b.dataset.v); upd(); });
    upd(); this.el.appendChild(d); return d;
  },
  check(label, get, set){
    const d = document.createElement('label'); d.className = 'check';
    d.innerHTML = `<input type="checkbox"> ${label}`; const c = d.querySelector('input'); c.checked = get(); c.onchange = () => set(c.checked);
    this.el.appendChild(d); return d;
  },
  buttons(list){
    const d = document.createElement('div'); d.className = 'btnrow';
    for (const [t, fn, cls] of list){ const b = document.createElement('button'); b.className = 'btn ' + (cls || ''); b.innerHTML = t; b.onclick = fn; d.appendChild(b); }
    this.el.appendChild(d); return d;
  },
  note(html){ const p = document.createElement('p'); p.className = 'note'; p.innerHTML = html; this.el.appendChild(p); return p; }
};
function flash(t){ const n = UI.note('⚠ ' + t); n.style.color = '#b91c1c'; setTimeout(() => n.remove(), 3500); }

/* =====================================================================
   Station 0: Bändermodell
   ===================================================================== */
const MAT0 = {
  Cu:   { name:'Kupfer', kind:'Leiter', metal:true },
  Ge:   { name:'Germanium', kind:'Halbleiter', Eg:0.66, NN:7.9e18, mu:5800 },
  Si:   { name:'Silizium', kind:'Halbleiter', Eg:1.12, NN:1.7e19, mu:1850 },
  GaAs: { name:'Galliumarsenid', kind:'Halbleiter', Eg:1.42, NN:1.8e18, mu:8900 },
  C:    { name:'Diamant', kind:'Isolator', Eg:5.47, NN:1e19, mu:4000 }
};
const BD = { N:4, a:0.38, mat:'Si', T:300, field:false, light:false, lam:700, inten:50, el:[], ho:[], gens:[], phot:[], acc:0, adj:0 };
const ni = (m, T) => m.metal ? 8.5e22 : m.NN*Math.pow(T/300, 1.5)*Math.exp(-m.Eg/(2*KB*Math.max(T, 1)));
/* spezifischer Widerstand in Ω·m */
function rho(m, T){
  if (m.metal) return 1.68e-8*(1 + 0.0039*(T - 293));
  const n = ni(m, T)*1e6;                       /* in m⁻³ */
  return 1/Math.max(1e-40, n*QE*m.mu*1e-4);
}
/* Anzahl der gezeichneten thermischen Ladungsträgerpaare (logarithmisch, nicht maßstäblich) */
function thermalDots(m, T){ if (m.metal) return 0; const n = ni(m, T); return n < 1e3 ? 0 : clamp(Math.round(2.2*Math.log10(n/1e3)), 0, 34); }
function bdGeo(){
  const wide = W > 900;
  return {
    form: wide ? { x:W*0.03, y:H*0.17, w:W*0.45, h:H*0.79 } : { x:10, y:H*0.08, w:W - 20, h:H*0.4 },
    atoms: wide ? { x:W*0.03, y:H*0.02, w:W*0.45, h:H*0.13 } : null,
    cry: wide ? { x:W*0.52, y:H*0.1, w:W*0.45, h:H*0.5 } : { x:10, y:H*0.5, w:W - 20, h:H*0.28 },
    cond: wide ? { x:W*0.52, y:H*0.64, w:W*0.45, h:H*0.33 } : { x:10, y:H*0.8, w:W - 20, h:H*0.19 }
  };
}
/* Banddiagramm im Kristallfenster */
function bdBands(c, m){
  const top = c.y + 26, bot = c.y + c.h - 12;
  if (m.metal) return { metal:true, top, bot, EF:top + (bot - top)*0.45 };
  const gap = clamp(18 + 30*m.Eg, 30, (bot - top)*0.62);
  const bh = (bot - top - gap)/2;
  return { cbTop:top, cbBot:top + bh, vbTop:top + bh + gap, vbBot:bot, gap };
}
function bdStep(dt, c){
  const m = MAT0[BD.mat];
  const target = thermalDots(m, BD.T);
  BD.adj -= dt;
  const thermal = BD.el.filter(e => !e.photo).length;
  if (BD.adj <= 0 && thermal !== target){
    BD.adj = 0.06;
    if (thermal < target){ const x = Math.random(); BD.el.push({x, y:Math.random(), photo:false}); BD.ho.push({x, y:Math.random(), photo:false}); BD.gens.push({x, t:0, up:true}); }
    else { const i = BD.el.findIndex(e => !e.photo), j = BD.ho.findIndex(e => !e.photo); if (i >= 0){ BD.gens.push({x:BD.el[i].x, t:0, up:false}); BD.el.splice(i,1); } if (j >= 0) BD.ho.splice(j,1); }
  }
  /* Licht: Photonen erzeugen Elektron-Loch-Paare, wenn E ≥ E_g */
  if (BD.light && !m.metal){
    BD.acc += BD.inten/6*dt;
    while (BD.acc >= 1){ BD.acc -= 1; BD.phot.push({x:Math.random(), t:0}); }
  }
  for (const p of BD.phot){
    p.t += dt*1.4;
    if (p.t >= 1 && !p.done){
      p.done = true;
      if (HC/BD.lam >= m.Eg && !m.metal){ BD.el.push({x:p.x, y:0.6, photo:true, life:3.5}); BD.ho.push({x:p.x, y:0.4, photo:true, life:3.5}); BD.gens.push({x:p.x, t:0, up:true, light:true}); }
    }
  }
  BD.phot = BD.phot.filter(p => p.t < (HC/BD.lam >= (m.Eg || 0) ? 1.05 : 2.2));
  for (const arr of [BD.el, BD.ho]) for (const q of arr) if (q.photo){ q.life -= dt; }
  if (BD.el.some(e => e.photo && e.life <= 0)){ BD.el = BD.el.filter(e => !(e.photo && e.life <= 0)); BD.ho = BD.ho.filter(e => !(e.photo && e.life <= 0)); }

/* =====================================================================
   Station 1: Dotierung – Kristallgitter und Bänder nebeneinander
   ===================================================================== */
const DP = { dop:'P', conc:1, T:300, field:false, cols:7, rows:5, bonds:[], dops:[], free:[], holes:[], moves:[], gens:[], adj:0, genAcc:0 };
const E_DON = 0.045;   /* Ionisierungsenergie von P bzw. B in Si (eV) */
const ionFrac = T => 1 - Math.exp(-6*KB*T/E_DON);
function dpBuild(){
  const C = DP.cols, R = DP.rows;
  DP.bonds = []; DP.free = []; DP.holes = []; DP.moves = []; DP.gens = [];
  for (let j = 0; j < R; j++) for (let i = 0; i < C; i++){
    if (i < C - 1) DP.bonds.push({ a:[i,j], b:[i+1,j], e:2 });
    if (j < R - 1) DP.bonds.push({ a:[i,j], b:[i,j+1], e:2 });
  }
  const pos = { 1:[[3,2]], 2:[[2,1],[4,3]], 3:[[1,1],[3,3],[5,1]] }[DP.conc] || [];
  DP.dops = DP.dop === 'none' ? [] : pos.map(([i,j]) => ({ i, j, type:DP.dop, ion:false, ang:Math.random()*6 }));
  for (const d of DP.dops) if (d.type === 'B'){
    const bi = DP.bonds.findIndex(b => b.a[0] === d.i && b.a[1] === d.j && b.b[0] === d.i + 1);
    DP.bonds[bi].e = 1; DP.holes.push({ bond:bi, bound:true, home:d, t:Math.random() });
  }
}
const bondMid = b => [(b.a[0] + b.b[0])/2, (b.a[1] + b.b[1])/2];
const shareAtom = (b, c) => [b.a, b.b].some(p => [c.a, c.b].some(q => p[0] === q[0] && p[1] === q[1]));
function dpGeo(){
  const wide = W > 900;
  const lw = wide ? W*0.56 : W, lh = wide ? H*0.9 : H*0.55;
  const s = Math.min((lw - 60)/(DP.cols - 0.2), (lh - 70)/(DP.rows - 0.2));
  const gw = s*(DP.cols - 1), gh = s*(DP.rows - 1);
  return { s, x0:(lw - gw)/2, y0: (wide ? H*0.08 : 30) + (lh - gh)/2 - 10,
           band: wide ? { x:W*0.6, y:H*0.06, w:W*0.38, h:H*0.6 } : { x:10, y:lh + 10, w:W - 20, h:H - lh - 20 },
           info: wide ? { x:W*0.6, y:H*0.7, w:W*0.38, h:H*0.27 } : null };

function dpStep(dt){

    if (have < want){ const d = don.find(d => !d.ion); d.ion = true; DP.free.push({ x:d.i + 0.3, y:d.j - 0.3, vx:0, vy:0, from:d, life:Infinity }); }

    const acc = DP.dops.filter(d => d.type === 'B');

    if (haveA < wantA){ const h = DP.holes.find(h => h.home && h.bound); if (h){ h.bound = false; h.home.ion = true; } }
    else if (haveA > wantA){ const h = DP.holes.find(h => h.home && !h.bound); if (h){ DP.bonds[h.bond].e = 2; const bi = DP.bonds.findIndex(b => b.a[0] === h.home.i && b.a[1] === h.home.j && b.b[0] === h.home.i + 1); DP.bonds[bi].e = 1; h.bond = bi; h.bound = true; h.home.ion = false; } }

function pfStep(dt){

/* =====================================================================
   Station 3: pn-Übergang (Diode)
   ===================================================================== */
const DIODES = { Si:{ name:'Silizium', Eg:1.12, Is:1e-14, Vbi:0.75 }, Ge:{ name:'Germanium', Eg:0.66, Is:2e-8, Vbi:0.35 } };
const PN = { mat:'Si', U0:0, R:100, h:[], e:[], cross:[], flashes:[], acc:0, init:false, UD:0, I:0, lampOn:true };
const UT0 = KB*300;
function diodeI(d, U){ return d.Is*(Math.exp(Math.min(U/UT0, 80)) - 1); }
function solveDiode(d, U0, R){
  if (R <= 0) return U0;
  let lo = Math.min(U0, 0) - 0.1, hi = Math.max(U0, 0) + 0.1;
  for (let k = 0; k < 80; k++){ const m = (lo + hi)/2; if (U0 - m - R*diodeI(d, m) > 0) lo = m; else hi = m; }
  return (lo + hi)/2;
}
function pnGeo(){
  const wide = W > 900;
  return wide ? { bar:{ x:W*0.04, y:H*0.09, w:W*0.56, h:H*0.27 }, band:{ x:W*0.04, y:H*0.42, w:W*0.56, h:H*0.54 }, circ:{ x:W*0.64, y:H*0.04, w:W*0.33, h:H*0.36 }, kl:{ x:W*0.64, y:H*0.44, w:W*0.33, h:H*0.52 } }
              : { bar:{ x:10, y:H*0.06, w:W - 20, h:H*0.2 }, band:{ x:10, y:H*0.28, w:W - 20, h:H*0.3 }, circ:{ x:10, y:H*0.6, w:W*0.48, h:H*0.38 }, kl:{ x:W*0.5, y:H*0.6, w:W*0.48, h:H*0.38 } };
}
function pnInit(){ PN.h = Array.from({length:30}, () => ({ x:rnd(0, 0.45), y:rnd(0.08, 0.92) })); PN.e = Array.from({length:30}, () => ({ x:rnd(0.55, 1), y:rnd(0.08, 0.92) })); PN.cross = []; PN.init = true; }
function pnWidth(d, UD){ return 0.12*Math.sqrt(Math.max(0.03, (d.Vbi - UD)/d.Vbi)); }   /* halbe Breite relativ zur Balkenlänge */
function pnStep(dt){
  if (!PN.init) pnInit();
  const d = DIODES[PN.mat];
  PN.UD = solveDiode(d, PN.U0, PN.R); PN.I = diodeI(d, PN.UD);
  const w = pnWidth(d, PN.UD), xl = 0.5 - w, xr = 0.5 + w;
  /* Ladungsträger bleiben außerhalb der Sperrschicht */
  for (const h of PN.h){ h.x += rnd(-0.04, 0.04)*dt*3; h.y = clamp(h.y + rnd(-0.3, 0.3)*dt, 0.06, 0.94); if (h.x > xl - 0.012) h.x = xl - 0.012 - Math.random()*0.03; if (h.x < 0.01) h.x = 0.01; }
  for (const e of PN.e){ e.x += rnd(-0.04, 0.04)*dt*3; e.y = clamp(e.y + rnd(-0.3, 0.3)*dt, 0.06, 0.94); if (e.x < xr + 0.012) e.x = xr + 0.012 + Math.random()*0.03; if (e.x > 0.99) e.x = 0.99; }
  /* Durchlassrichtung: Elektronen und Löcher überqueren die Sperrschicht und rekombinieren */
  const rate = clamp(PN.I*1000*0.6, 0, 22);
  PN.acc += rate*dt;
  while (PN.acc >= 1){ PN.acc -= 1; const isE = Math.random() < 0.5; PN.cross.push({ e:isE, x:isE ? xr : xl, y:rnd(0.15, 0.85), t:0, stop: isE ? rnd(0.06, 0.2) : rnd(0.06, 0.2) }); }
  for (const c of PN.cross){
    c.t += dt;
    const v = 0.35*dt;
    if (c.e) c.x -= v; else c.x += v;
    const dist = c.e ? xr - c.x : c.x - xl;
    if (dist > 2*w + c.stop && !c.done){ c.done = true; PN.flashes.push({ x:c.x, y:c.y, t:0 }); }
  }
  PN.cross = PN.cross.filter(c => !c.done);
  for (const f of PN.flashes) f.t += dt*2; PN.flashes = PN.flashes.filter(f => f.t < 1);
}
function pnDraw(dt){
  pnStep(dt);
  const g = pnGeo(), lv = lvlNum(), d = DIODES[PN.mat], b = g.bar;
  const w = pnWidth(d, PN.UD), X = x => b.x + x*b.w, Y = y => b.y + 26 + y*(b.h - 34);

  /* Balken: p links, n rechts */
  box(b.x, b.y + 20, b.w*0.5, b.h - 22, 'rgba(254,226,226,.7)', null, 6);
  box(b.x + b.w*0.5, b.y + 20, b.w*0.5, b.h - 22, 'rgba(219,234,254,.7)', null, 6);
  box(X(0.5 - w), b.y + 20, (2*w)*b.w, b.h - 22, 'rgba(241,245,249,.95)', null, 0);
  box(b.x, b.y + 20, b.w, b.h - 22, null, '#94a3b8', 6);
  text('p-Gebiet', b.x + 8, b.y + 31, {size:12, weight:700, col:'#b91c1c'});
  text('n-Gebiet', b.x + b.w - 8, b.y + 31, {size:12, weight:700, col:'#1d4ed8', align:'right'});
  text(lv ? 'Raumladungszone (Sperrschicht)' : 'Sperrschicht', X(0.5), b.y + b.h + 12, {align:'center', size:11, weight:600, col:'#475569'});
  dline(X(0.5 - w), b.y + 20, X(0.5 - w), b.y + b.h - 2, '#94a3b8', 1); dline(X(0.5 + w), b.y + 20, X(0.5 + w), b.y + b.h - 2, '#94a3b8', 1);
  /* ortsfeste Ionen in der Sperrschicht */
  const nIon = Math.max(1, Math.round(w*b.w/16));

    box(xa - 6, yy - 6, 12, 12, '#fecaca', '#b91c1c', 2); text('−', xa, yy + 0.5, {align:'center', size:12, weight:800, col:'#b91c1c'});
    box(xd - 6, yy - 6, 12, 12, '#bfdbfe', '#1d4ed8', 2); text('+', xd, yy + 0.5, {align:'center', size:12, weight:800, col:'#1d4ed8'});
  }
  if (lv){ const ya = b.y + 20 + 4, fl = Math.min(w*b.w*1.6, 60 + (d.Vbi - PN.UD)*14); arrow(X(0.5) + fl/2, ya + 3, X(0.5) - fl/2, ya + 3, 'rgba(124,58,237,.8)', 2); text('E-Feld', X(0.5) + fl/2 + 4, ya + 3, {size:10, col:'#7c3aed', weight:600}); }
  for (const h of PN.h) hole(X(h.x), Y(h.y), 5);
  for (const e of PN.e) elec(X(e.x), Y(e.y), 4.5);
  for (const c of PN.cross) c.e ? elec(X(c.x), Y(c.y), 4.5) : hole(X(c.x), Y(c.y), 5);
  for (const f of PN.flashes) circle(X(f.x), Y(f.y), 5 + 14*f.t, null, `rgba(234,88,12,${1 - f.t})`, 2);
  /* Kontakte und Polung */
  const pol = PN.U0 > 0.01 ? ['+','−'] : PN.U0 < -0.01 ? ['−','+'] : ['',''];
  box(b.x - 14, b.y + 20, 10, b.h - 22, '#64748b', null, 2); box(b.x + b.w + 4, b.y + 20, 10, b.h - 22, '#64748b', null, 2);
  if (pol[0]) text(pol[0], b.x - 9, b.y + 8, {align:'center', size:18, weight:800, col:pol[0] === '+' ? '#dc2626' : '#334155'});
  if (pol[1]) text(pol[1], b.x + b.w + 9, b.y + 8, {align:'center', size:18, weight:800, col:pol[1] === '+' ? '#dc2626' : '#334155'});
  if (lv) pnDrawBands(g.band, d, w, lv); else pnDrawEasyInfo(g.band);
  pnDrawCircuit(g.circ, d, lv);
  pnDrawCurve(g.kl, d, lv);
}
function pnDrawEasyInfo(r){

function pnDrawBands(r, d, w, lv){

/* =====================================================================
   Station 4: Solarzelle
   Modell: Sonnenspektrum als Schwarzer Strahler (5778 K), auf die
   Bestrahlungsstärke skaliert. Jedes absorbierte Photon (E ≥ E_g) liefert
   mit 90 % Wahrscheinlichkeit ein Elektron (Quantenausbeute).
   Kennlinie: I = I_L − I_0·(e^(U/U_T) − 1), I_0 = C·e^(−E_g/kT).
   C ist so gewählt, dass Silizium bei 25 °C U_oc = 0,63 V hat.
   ===================================================================== */
const CELLMATS = {
  Si:   { name:'Silizium', Eg:1.12, thick:180, Ldiff:200, direct:false, col:'#1e3a8a' },
  CIGS: { name:'CIGS (Dünnschicht)', Eg:1.15, thick:2.5, Ldiff:2, direct:true, col:'#3f3f46' },
  GaAs: { name:'Galliumarsenid', Eg:1.42, thick:3, Ldiff:5, direct:true, col:'#334155' },
  CdTe: { name:'Cadmiumtellurid (Dünnschicht)', Eg:1.45, thick:3, Ldiff:2, direct:true, col:'#44403c' },
  Pero: { name:'Perowskit', Eg:1.6, thick:0.6, Ldiff:1, direct:true, col:'#57534e' },
  Ge:   { name:'Germanium', Eg:0.66, thick:150, Ldiff:150, direct:false, col:'#525252' }
};
const QEFF = 0.9, AREA = 0.01;   /* Quantenausbeute, Zellfläche 100 cm² in m² */
const SPEC = (() => {
  const Es = [], F = []; let P = 0; const kT = KB*5778, dE = 0.01;
  for (let E = 0.31; E <= 4.4; E += dE){ const f = E*E/Math.expm1(E/kT); Es.push(E); F.push(f); P += E*f*dE; }
  const sc = 1000/(P*QE);       /* Photonen pro (m²·s·eV) bei 1000 W/m² */
  const Fs = F.map(v => v*sc);
  const cum = []; let s = 0; for (const v of Fs){ s += v; cum.push(s); }
  return { Es, F:Fs, dE, cum, tot:s };
})();
function photonFlux(Eg){ let n = 0; SPEC.Es.forEach((E,k) => { if (E >= Eg) n += SPEC.F[k]*SPEC.dE; }); return n; }     /* bei 1000 W/m² */
const C_J0 = (() => { const kT = KB*298.15, Jsc = QE*photonFlux(1.12)*QEFF; return Jsc/(Math.expm1(0.63/kT)*Math.exp(-1.12/kT)); })();
const SC = { light:'sun', lam:550, G:1000, mat:'Si', Tc:25, Ns:1, logR:-0.85, ph:[], car:[], heats:[], flashes:[], acc:0, fan:0, wire:0, showEta:false, op:null };
/* Kennwerte einer Zelle für die aktuellen Einstellungen */
function cellParams(matKey, G, lightMode, lam, Tc){
  const m = CELLMATS[matKey], T = Tc + 273.15, kT = KB*T;
  let N, Pin = G;                               /* N: absorbierbare Photonen pro m² und s */
  if (lightMode === 'sun') N = photonFlux(m.Eg)*G/1000;
  else { const E = HC/lam; N = E >= m.Eg ? G/(E*QE) : 0; }
  const IL = QE*N*QEFF*AREA;
  const I0 = C_J0*Math.exp(-m.Eg/kT)*AREA;
  const Voc = IL > 0 ? kT*Math.log(IL/I0 + 1) : 0;
  let Pm = 0, Um = 0;
  for (let k = 1; k <= 400; k++){ const U = Voc*k/400, P = U*(IL - I0*Math.expm1(U/kT)); if (P > Pm){ Pm = P; Um = U; } }
  return { m, kT, IL, I0, Voc, Pm, Um, Im: Um ? Pm/Um : 0, Pin: Pin*AREA, N };
}
const cellI = (c, U) => c.IL - c.I0*Math.expm1(U/c.kT);
/* Arbeitspunkt mit Lastwiderstand R am Modul aus Ns Zellen */
function opPoint(c, Ns, R){
  if (c.IL <= 0) return { U:0, I:0 };
  let lo = 0, hi = c.Voc;
  for (let k = 0; k < 70; k++){ const m = (lo + hi)/2; if (cellI(c, m) - Ns*m/R > 0) lo = m; else hi = m; }
  const U = (lo + hi)/2; return { U, I:Math.max(0, cellI(c, U)) };
}
/* Verlustanalyse pro Zelle (Leistungen in W) */
function losses(c, op, lightMode, lam, G){
  const Eg = c.m.Eg; let Pb = 0, Pt = 0, Pg = 0;
  if (lightMode === 'sun'){
    SPEC.Es.forEach((E,k) => { const p = SPEC.F[k]*SPEC.dE*QE*G/1000*AREA; if (E < Eg) Pb += E*p; else { Pt += (E - Eg)*p; Pg += Eg*p; } });
  } else { const E = HC/lam, Ph = G*AREA; if (E < Eg) Pb = Ph; else { Pt = Ph*(E - Eg)/E; Pg = Ph*Eg/E; } }
  const Pop = op.U*op.I;
  return [
    ['Photonen zu energiearm (E < E_g)', Pb, '#94a3b8'],
    ['Überschussenergie → Wärme', Pt, '#f97316'],
    ['Reflexion, Rekombination', 0.1*Pg, '#a8a29e'],
    ['Spannung kleiner als E_g/e', (Eg - c.Voc)*c.IL, '#facc15'],
    ['Kennlinienform (Füllfaktor)', c.Voc*c.IL - c.Pm, '#fde68a'],
    ['nicht im besten Arbeitspunkt', c.Pm - Pop, '#e5e7eb'],
    ['elektrische Leistung', Pop, '#16a34a']
  ];
}
function absorbDepth(m, E){       /* Eindringtiefe in µm (zufällig gezogen) */
  if (E < m.Eg) return Infinity;
  const lamEff = HC/(E - m.Eg + 1.12);
  const T = [[300,1.7e6],[350,1.04e6],[400,9.5e4],[450,2.6e4],[500,1.1e4],[550,6.4e3],[600,4.1e3],[650,2.8e3],[700,1.9e3],[750,1.3e3],[800,850],[850,540],[900,310],[950,160],[1000,64],[1050,16],[1100,3.5],[1110,1.5]];
  let a = 1.5;
  for (let k = 0; k < T.length - 1; k++) if (lamEff >= T[k][0] && lamEff <= T[k+1][0]){ const f = (lamEff - T[k][0])/(T[k+1][0] - T[k][0]); a = Math.exp(Math.log(T[k][1]) + f*(Math.log(T[k+1][1]) - Math.log(T[k][1]))); }
  if (lamEff < 300) a = 1.7e6;
  if (m.direct) a *= 12;
  return -Math.log(Math.random())/a*1e4;
}
function sampleSunE(){ const r = Math.random()*SPEC.tot; let lo = 0, hi = SPEC.cum.length - 1; while (lo < hi){ const m = (lo + hi) >> 1; if (SPEC.cum[m] < r) lo = m + 1; else hi = m; } return SPEC.Es[lo]; }
let etaCurve = null;
function etaVsEg(){
  if (etaCurve) return etaCurve;
  etaCurve = [];
  for (let Eg = 0.5; Eg <= 2.6; Eg += 0.02){
    const kT = KB*298.15, IL = QE*photonFlux(Eg)*QEFF*AREA, I0 = C_J0*Math.exp(-Eg/kT)*AREA, Voc = kT*Math.log(IL/I0 + 1);
    let Pm = 0; for (let k = 1; k <= 200; k++){ const U = Voc*k/200; Pm = Math.max(Pm, U*(IL - I0*Math.expm1(U/kT))); }
    let ult = 0; SPEC.Es.forEach((E,k) => { if (E >= Eg) ult += Eg*SPEC.F[k]*SPEC.dE*QE; });
    etaCurve.push([Eg, Pm/(1000*AREA), ult/1000]);
  }
  return etaCurve;
}
function scGeo(){
  const wide = W > 900;
  return wide ? { cell:{ x:W*0.06, y:H*0.16, w:W*0.34, h:H*0.5 }, read:{ x:W*0.03, y:H*0.76, w:W*0.53, h:H*0.21 }, iu:{ x:W*0.585, y:H*0.02, w:W*0.4, h:H*0.47 }, loss:{ x:W*0.585, y:H*0.51, w:W*0.4, h:H*0.46 } }
              : { cell:{ x:W*0.08, y:H*0.08, w:W*0.5, h:H*0.3 }, read:{ x:10, y:H*0.43, w:W - 20, h:H*0.13 }, iu:{ x:10, y:H*0.57, w:W - 20, h:H*0.21 }, loss:{ x:10, y:H*0.79, w:W - 20, h:H*0.2 } };
}
function scState(){
  const c = cellParams(SC.mat, SC.G, SC.light, SC.lam, SC.Tc);
  const R = Math.pow(10, SC.logR)*SC.Ns;
  const op = opPoint(c, SC.Ns, R);
  return { c, R, op };
}
function scStep(dt, g, st){
  const m = CELLMATS[SC.mat], cell = g.cell;
  SC.acc += SC.G/1000*30*dt;
  while (SC.acc >= 1){
    SC.acc -= 1;
    const E = SC.light === 'sun' ? sampleSunE() : HC/SC.lam;
    SC.ph.push({ E, x:rnd(0.06, 0.94), t:0, d:absorbDepth(m, E) });
  }
  const yOf = d => cell.y + 14 + (cell.h - 26)*Math.log(1 + d/0.1)/Math.log(1 + m.thick/0.1);
  for (const p of SC.ph){
    p.t += dt;
    const ySun = cell.y - 60, target = p.d <= m.thick ? yOf(p.d) : cell.y + cell.h + 40;
    p.y = ySun + (target - ySun)*Math.min(1, p.t/(p.d <= m.thick ? 0.55 : 1.0));
    if (p.d <= m.thick && p.t >= 0.55 && !p.done){
      p.done = true;
      const dj = m.direct ? 0.5*m.thick : 0.8;           /* bis hierher: n-Schicht und Raumladungszone */
      const collect = p.d <= dj ? 1 : Math.exp(-(p.d - dj)/m.Ldiff);
      const ok = Math.random() < collect;
      SC.car.push({ x:p.x, y:p.y, t:0, ok, e:true }); SC.car.push({ x:p.x, y:p.y, t:0, ok, e:false });
      if (p.E - m.Eg > 0.25) SC.heats.push({ x:p.x, y:p.y, t:0 });
    }
  }
  SC.ph = SC.ph.filter(p => !p.done && p.t < 1.05);
  const frac = st.c.IL > 0 ? st.op.I/st.c.IL : 0;
  for (const q of SC.car){
    q.t += dt;
    if (!q.ok){ if (q.t > 0.5 && !q.gone){ q.gone = true; if (q.e) SC.flashes.push({ x:q.x, y:q.y, t:0 }); } continue; }
    const v = 260*dt;
    if (q.e){ q.y -= v; if (q.y <= cell.y + 6){ q.gone = true; if (Math.random() > frac) SC.flashes.push({ x:q.x, y:cell.y + 6 + (cell.h - 26)*0.2, t:0, junction:true }); } }
    else { q.y += v*0.8; if (q.y >= cell.y + cell.h - 6) q.gone = true; }
  }
  SC.car = SC.car.filter(q => !q.gone);
  for (const h of SC.heats) h.t += dt*1.3; SC.heats = SC.heats.filter(h => h.t < 1);
  for (const f of SC.flashes) f.t += dt*2; SC.flashes = SC.flashes.filter(f => f.t < 1);
  const ref = cellParams(SC.mat, 1000, 'sun', 550, 25).Pm*SC.Ns;
  SC.fan += dt*14*Math.sqrt(clamp(st.op.U*st.op.I*SC.Ns/ref, 0, 2));
  SC.wire += dt*clamp(st.op.I/3, 0, 2)*120;
}
function scDraw(dt){
  const g = scGeo(), st = scState(), lv = lvlNum(), m = CELLMATS[SC.mat], cell = g.cell;
  scStep(dt, g, st);
  SC.op = st;
  /* Sonne bzw. Lampe */
  const sx = cell.x + cell.w*0.12, sy = cell.y - 72;
  if (SC.light === 'sun'){
    const glow = ctx.createRadialGradient(sx, sy, 4, sx, sy, 36); glow.addColorStop(0, `rgba(253,224,71,${0.4 + 0.5*SC.G/1200})`); glow.addColorStop(1, 'rgba(253,224,71,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(sx, sy, 36, 0, Math.PI*2); ctx.fill(); circle(sx, sy, 15, '#facc15', '#eab308', 2);
    text(lv ? `Sonnenlicht ${fmt(SC.G,0)} W/m²` : (SC.G > 800 ? 'volle Sonne' : SC.G > 300 ? 'leicht bewölkt' : 'stark bewölkt'), sx + 26, sy, {size:12, weight:600});
  } else {
    box(sx - 16, sy - 10, 32, 20, '#334155', null, 4); circle(sx, sy + 10, 6, rgba(nmRGB(SC.lam),1));
    text(`${fmt(SC.lam,0)} nm (${region(SC.lam)})` + (lv ? ` · ${fmt(HC/SC.lam,2)} eV` : ''), sx + 26, sy, {size:12, weight:600});
  }
  /* Zellquerschnitt mit logarithmischer Tiefe */
  const yOf = d => cell.y + 14 + (cell.h - 26)*Math.log(1 + d/0.1)/Math.log(1 + m.thick/0.1);
  const dn = m.direct ? 0.05 : 0.3, dj = m.direct ? 0.5*m.thick : 0.8;
  box(cell.x, cell.y + 10, cell.w, yOf(dn) - cell.y - 10, '#bfdbfe', null, 0);
  box(cell.x, yOf(dn), cell.w, yOf(dj) - yOf(dn), '#f1f5f9', null, 0);
  box(cell.x, yOf(dj), cell.w, cell.y + cell.h - 12 - yOf(dj), '#fecaca', null, 0);
  box(cell.x, cell.y + cell.h - 12, cell.w, 12, '#94a3b8', null, 0);
  for (let k = 0; k < 6; k++) box(cell.x + (k + 0.5)*cell.w/6 - 5, cell.y + 2, 10, 10, '#475569', null, 2);
  box(cell.x, cell.y + 2, cell.w, cell.h - 2, null, '#64748b', 2);
  text('Frontkontakt', cell.x + cell.w + 8, cell.y + 6, {size:10, col:'#475569'});
  text(m.direct ? 'n-Schicht' : 'n-Schicht', cell.x + cell.w + 8, (cell.y + 10 + yOf(dn))/2 + 3, {size:10, col:'#1d4ed8', weight:600});
  text(lv ? 'Raumladungszone' : 'Grenzschicht', cell.x + cell.w + 8, (yOf(dn) + yOf(dj))/2, {size:10, col:'#475569', weight:600});
  text('p-Schicht', cell.x + cell.w + 8, (yOf(dj) + cell.y + cell.h - 12)/2, {size:10, col:'#b91c1c', weight:600});
  text('Rückkontakt', cell.x + cell.w + 8, cell.y + cell.h - 6, {size:10, col:'#475569'});
  if (lv){
    for (const d of [0.1, 1, 10, 100].filter(d => d < m.thick)) { line(cell.x - 5, yOf(d), cell.x, yOf(d), '#64748b', 1); text(d < 1 ? fmt(d,1) + ' µm' : fmt(d,0) + ' µm', cell.x - 7, yOf(d), {align:'right', size:9, col:'#64748b'}); }
    text(`Dicke ${fmt(m.thick, m.thick < 10 ? 1 : 0)} µm (Tiefe logarithmisch)`, cell.x, cell.y + cell.h + 14, {size:10, col:'#64748b'});
  }
  /* Photonen */
  for (const p of SC.ph){
    const nm = HC/p.E, x = cell.x + p.x*cell.w;
    wiggle(x, p.y, Math.PI/2, 18, rgba(nmRGB(nm), nm > 780 ? 0.75 : 1), 3.5, 2);
  }

  for (const q of SC.car){ const x = cell.x + q.x*cell.w; q.e ? elec(x, q.y, 3.6) : hole(x, q.y, 3.8); }
  for (const f of SC.flashes) circle(cell.x + f.x*cell.w, f.y, 3 + 10*f.t, null, `rgba(234,88,12,${1 - f.t})`, 1.6);
  /* äußerer Stromkreis mit Ventilator */
  const wx = cell.x + cell.w + 122, top = cell.y + 6, bot = cell.y + cell.h - 6, fy = (top + bot)/2;
  ctx.strokeStyle = '#334155'; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(cell.x + cell.w*0.92, top); ctx.lineTo(cell.x + cell.w*0.92, top - 18); ctx.lineTo(wx, top - 18); ctx.lineTo(wx, fy - 26);
  ctx.moveTo(wx, fy + 26); ctx.lineTo(wx, bot + 18); ctx.lineTo(cell.x + cell.w*0.5, bot + 18); ctx.lineTo(cell.x + cell.w*0.5, bot); ctx.stroke();
  if (st.op.I > 0.01){
    const path = [[cell.x + cell.w*0.92, top], [cell.x + cell.w*0.92, top - 18], [wx, top - 18], [wx, fy - 26]];
    const path2 = [[wx, fy + 26], [wx, bot + 18], [cell.x + cell.w*0.5, bot + 18], [cell.x + cell.w*0.5, bot]];
    for (const pp of [path, path2]){
      let tot = 0; const seg = []; for (let k = 1; k < pp.length; k++){ const l = Math.hypot(pp[k][0] - pp[k-1][0], pp[k][1] - pp[k-1][1]); seg.push(l); tot += l; }
      for (let s = (SC.wire % 22); s < tot; s += 22){ let d = s, k = 0; while (d > seg[k]){ d -= seg[k]; k++; } const f = d/seg[k]; elec(pp[k][0] + (pp[k+1][0] - pp[k][0])*f, pp[k][1] + (pp[k+1][1] - pp[k][1])*f, 3); }

  scDrawReadout(g.read, st, lv);

}
function scDrawReadout(r, st, lv){
  box(r.x, r.y, r.w, r.h, '#f8fafc', '#e2e8f0', 12);
  const c = st.c, U = st.op.U*SC.Ns, I = st.op.I, P = U*I, Pin = c.Pin*SC.Ns;
  const items = lv === 0
    ? [['Spannung', fmt(U, 2) + ' V'], ['Stromstärke', fmt(I, 2) + ' A'], ['Leistung', fmt(P, 2) + ' W']]
    : [['U', fmt(U, 2) + ' V'], ['I', fmt(I, 2) + ' A'], ['P', fmt(P, 2) + ' W'], ['Wirkungsgrad', fmt(Pin > 0 ? P/Pin*100 : 0, 1) + ' %']];
  const cw = (r.w - 20)/items.length;
  items.forEach(([k, v], i) => {
    const x = r.x + 10 + i*cw;
    text(k, x + 6, r.y + 20, {size:12, col:'#64748b'});
    text(v, x + 6, r.y + 46, {size:22, weight:700, mono:true});
  });
  let y = r.y + r.h - 18;
  if (lv) text(`${SC.Ns > 1 ? SC.Ns + ' Zellen in Reihe · ' : ''}Leerlaufspannung ${fmt(c.Voc*SC.Ns,2)} V · Kurzschlussstrom ${fmt(c.IL,2)} A · MPP ${fmt(c.Pm*SC.Ns,2)} W` + (lv === 2 ? ` · Füllfaktor ${fmt(c.IL*c.Voc > 0 ? c.Pm/(c.IL*c.Voc)*100 : 0,0)} %` : ''), r.x + 16, y, {size:12, col:'#334155'});
  else text(P > 0.5*c.Pm*SC.Ns && P > 0.01 ? 'Der Ventilator dreht sich gut.' : P > 0.01 ? 'Der Ventilator dreht sich langsam.' : 'Der Ventilator steht.', r.x + 16, y, {size:13, weight:600, col:'#334155'});
}
function scDrawIU(r, st, lv){
  const c = st.c, Ns = SC.Ns;
  if (lv === 0){
    box(r.x, r.y, r.w, r.h, '#f8fafc', '#e2e8f0', 12);
    text('Was passiert in der Solarzelle?', r.x + 12, r.y + 18, {weight:700, size:13});
    let y = r.y + 44;
    for (const t of ['1. Ein Photon wird absorbiert und erzeugt ein freies Elektron (blau) und ein Loch (rot).', '2. Das elektrische Feld an der Grenzschicht trennt die beiden: Elektronen nach oben, Löcher nach unten.', '3. Die Elektronen fließen über die Kabel durch den Ventilator und kommen von unten zurück.', 'Licht mit zu wenig Energie geht einfach durch.'])

  for (let k = 0; k <= 200; k++){ const U = c.Voc*k/200, y = p.Y(Math.max(0, cellI(c, U))); k ? ctx.lineTo(p.X(U*Ns), y) : ctx.moveTo(p.X(U*Ns), y); }

  for (let k = 0; k <= 200; k++){ const U = c.Voc*k/200, y = YP(U*Ns*Math.max(0, cellI(c, U))); k ? ctx.lineTo(p.X(U*Ns), y) : ctx.moveTo(p.X(U*Ns), y); }
  ctx.stroke();

  const R = st.R; ctx.save(); ctx.setLineDash([4,4]); line(p.X(0), p.Y(0), p.X(Math.min(Umax, Imax*R)), p.Y(Math.min(Imax, Umax/R)), '#94a3b8', 1.5); ctx.restore();
  ctx.restore();
  text('P', p.R + 6, p.T + 4, {size:11, col:'#f97316', weight:700});
  for (let k = 1; k <= 4; k++){ const v = Pmax*k/4.6; text(fmt(v, v < 1 ? 2 : 1) + ' W', p.R + 4, YP(v), {size:9, col:'#f97316'}); }
  /* MPP und Arbeitspunkt */
  if (c.Pm > 0){ circle(p.X(c.Um*Ns), p.Y(c.Im), 5, null, '#16a34a', 2); circle(p.X(c.Um*Ns), YP(c.Pm*Ns), 5, null, '#16a34a', 2); text('MPP', p.X(c.Um*Ns) + 7, YP(c.Pm*Ns) - 9, {size:11, weight:700, col:'#16a34a'}); }
  circle(p.X(st.op.U*Ns), p.Y(st.op.I), 6.5, '#0f766e', '#fff', 2);
  circle(p.X(st.op.U*Ns), YP(st.op.U*Ns*st.op.I), 5.5, '#f97316', '#fff', 2);

const LEDS = {
  ir:     { name:'Infrarot (GaAs)', Eg:1.42 },
  red:    { name:'Rot (AlGaAs)', Eg:1.9 },
  orange: { name:'Orange (GaAsP)', Eg:2.03 },
  yellow: { name:'Gelb (AlGaInP)', Eg:2.1 },
  green:  { name:'Grün (InGaN)', Eg:2.38 },
  blue:   { name:'Blau (InGaN)', Eg:2.65 },
  violet: { name:'Violett (InGaN)', Eg:3.1 },
  white:  { name:'Weiß (blau + Leuchtstoff)', Eg:2.65, white:true }
};
const LD = { led:'red', U0:0, R:100, broken:false, pts:[], ph:[], acc:0, rec:[], UD:0, I:0 };
const ledI = (Eg, U) => 1e-3*Math.exp(Math.min(60, (U - (Eg - 0.05))/(2*UT0)));
function solveLED(Eg, U0, R){
  if (U0 <= 0) return 0;
  if (R <= 0) return U0;
  let lo = 0, hi = U0;
  for (let k = 0; k < 70; k++){ const m = (lo + hi)/2; if (U0 - m - R*ledI(Eg, m) > 0) lo = m; else hi = m; }
  return (lo + hi)/2;
}
function ldGeo(){
  const wide = W > 900;
  return wide ? { led:{ x:W*0.03, y:H*0.03, w:W*0.27, h:H*0.42 }, band:{ x:W*0.03, y:H*0.48, w:W*0.56, h:H*0.49 }, circ:{ x:W*0.32, y:H*0.03, w:W*0.27, h:H*0.42 }, right:{ x:W*0.62, y:H*0.03, w:W*0.36, h:H*0.94 } }
              : { led:{ x:10, y:10, w:W*0.48, h:H*0.3 }, band:{ x:10, y:H*0.32, w:W - 20, h:H*0.3 }, circ:{ x:W*0.51, y:10, w:W*0.47, h:H*0.3 }, right:{ x:10, y:H*0.64, w:W - 20, h:H*0.35 } };
}
function ldStep(dt){
  const L = LEDS[LD.led];
  if (LD.broken){ LD.UD = 0; LD.I = 0; }
  else {
    LD.UD = solveLED(L.Eg, LD.U0, LD.R); LD.I = LD.U0 > 0 ? ledI(L.Eg, LD.UD) : 0;
    if (LD.I > 0.06){ LD.broken = true; buildControls(); }
  }
  const rate = clamp(LD.I*1000*1.2, 0, 30);
  LD.acc += rate*dt;
  while (LD.acc >= 1){ LD.acc -= 1; LD.rec.push({ x:rnd(0.42, 0.58), t:0, nm: ledPhotonNm(L) }); }
  for (const r of LD.rec) r.t += dt*1.2; LD.rec = LD.rec.filter(r => r.t < 1.6);
}
function ledPhotonNm(L){
  const E = L.Eg + KB*300/2 + (Math.random() + Math.random() + Math.random() - 1.5)*0.05;
  if (L.white && Math.random() < 0.55) return rnd(520, 650);   /* Leuchtstoff wandelt blaues Licht in gelbes um */
  return HC/E;
}
function ldDraw(dt){
  ldStep(dt);
  const g = ldGeo(), lv = lvlNum(), L = LEDS[LD.led];
  const lamC = HC/(L.Eg + KB*300/2), col = L.white ? [255, 248, 230] : nmRGB(lamC);
  const bright = LD.broken ? 0 : clamp(LD.I/0.02, 0, 1.4);

    const gl = ctx.createRadialGradient(cx, cy, 5, cx, cy, r.w*0.5*(0.6 + 0.5*bright));
    gl.addColorStop(0, rgba(col, lamC > 780 ? 0.15 : 0.55*Math.min(1, bright))); gl.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(cx, cy, r.w*0.5*(0.6 + 0.5*bright), 0, Math.PI*2); ctx.fill();
  }
  const domeCol = L.white ? [240, 240, 240] : col;
  ctx.fillStyle = rgba(domeCol, 0.35 + 0.5*Math.min(1, bright)); ctx.strokeStyle = '#475569'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx - 26, cy + 30); ctx.lineTo(cx - 26, cy - 8); ctx.arc(cx, cy - 8, 26, Math.PI, 0); ctx.lineTo(cx + 26, cy + 30); ctx.closePath(); ctx.fill(); ctx.stroke();
  box(cx - 32, cy + 30, 64, 8, '#94a3b8', '#475569', 2);
  line(cx - 12, cy + 38, cx - 12, cy + 80, '#64748b', 3); line(cx + 12, cy + 38, cx + 12, cy + 70, '#64748b', 3);
  if (LD.broken){ text('durchgebrannt', cx, cy - 8, {align:'center', size:12, weight:700, col:'#b91c1c'}); }

function ldDrawBand(r, L, lv){
  box(r.x, r.y, r.w, r.h, '#fbfcfe', '#e2e8f0', 12);

  for (let k = 0; k < 14; k++){ const x = 0.05 + (k % 7)*0.05 + 0.01*Math.cos(performance.now()/400 + k); hole(X(x), Yv(EVx(x)) + 6 + Math.floor(k/7)*9, 3.8); }

  for (const q of LD.rec){
    const x = X(q.x), yC = Yv(ECx(q.x)) - 4, yV = Yv(EVx(q.x)) + 4, pc = nmRGB(q.nm);

function ldSpectrumVal(L, nm){
  const E = HC/nm, E0 = L.Eg + KB*300/2, s = 0.035;

}

function ldDrawPlanck(r, L){

function renderTasks(){
  const el = $('#tasks'); el.innerHTML = '';
  TASKS[S.st].forEach((t, k) => {
    if (t.min > lvlNum()) return;
    const b = document.createElement('button'); b.textContent = t.n; b.classList.toggle('on', k === S.task);
    b.onclick = () => { S.task = k; S.showAnswer = false; t.setup(); buildControls(); renderTasks(); };
    el.appendChild(b);
  });
  const info = $('#taskInfo'), t = TASKS[S.st][S.task];
  if (!t || t.min > lvlNum()){ info.innerHTML = '<p class="note">Wähle einen Auftrag oder probiere frei aus.</p>'; return; }
  info.innerHTML = `<p class="q"><b>Auftrag:</b> ${t.q}</p>` + (S.showAnswer ? `<p class="a">${t.a}</p>` : '') + `<button class="btn" id="ansBtn">${S.showAnswer ? 'Erklärung ausblenden' : 'Erklärung zeigen'}</button>`;
  $('#ansBtn').onclick = () => { S.showAnswer = !S.showAnswer; renderTasks(); };
}

/* =====================================================================
   Stationen umschalten, Zeichenschleife
   ===================================================================== */
const STATIONS = [
  { name:'Bändermodell', hash:'baender', controls:bdControls, draw:bdDraw },
  { name:'Dotierung', hash:'dotierung', controls:dpControls, draw:dpDraw },
  { name:'Photoeffekt außen & innen', hash:'photoeffekt', controls:pfControls, draw:pfDraw },
  { name:'pn-Übergang (Diode)', hash:'diode', controls:pnControls, draw:pnDraw },
  { name:'Solarzelle', hash:'solarzelle', controls:scControls, draw:scDraw },
  { name:'LED', hash:'led', controls:ldControls, draw:ldDraw }
];
function buildControls(){ UI.clear(); $('#ctrlTitle').textContent = 'Einstellungen: ' + STATIONS[S.st].name; STATIONS[S.st].controls(); }
function setStation(i){
  S.st = i; S.task = -1; S.showAnswer = false;
  for (const b of $('#stSeg').children) b.classList.toggle('on', +b.dataset.s === i);
  buildControls(); renderTasks();
  try { history.replaceState(null, '', '#' + STATIONS[i].hash); } catch(_){}
}
function setLevel(l){
  S.level = l; for (const b of $('#lvlSeg').children) b.classList.toggle('on', b.dataset.v === l);
  if (l === 'easy'){ SC.Ns = 1; SC.Tc = 25; }
  if (l !== 'hard') SC.showEta = false;
  buildControls(); renderTasks();
}
$('#stSeg').onclick = e => { const b = e.target.closest('button'); if (b) setStation(+b.dataset.s); };
$('#lvlSeg').onclick = e => { const b = e.target.closest('button'); if (b) setLevel(b.dataset.v); };
$('#fsBtn').onclick = () => { const d = document; try { if (d.fullscreenElement) d.exitFullscreen(); else d.documentElement.requestFullscreen().catch(() => {}); } catch(_){} };
let last = performance.now();
function frame(ts){
  const dt = Math.min(0.05, (ts - last)/1000); last = ts;
  ctx.clearRect(0, 0, W, H);
  try { STATIONS[S.st].draw(dt); } catch(err){ console.error(err); }
  requestAnimationFrame(frame);
}
resize();
dpBuild();
const startHash = STATIONS.findIndex(s => s.hash === location.hash.slice(1));
setStation(startHash >= 0 ? startHash : 0);
requestAnimationFrame(frame);
</script>
