<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Klanglabor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday school lab between physics and music, legible on a projector
   IDEA a music room workbench: monochord, organ pipe, synthesizer, tuning forks, wine glass, spectrum analyser
   PICTURE the live canvas (vibrating string, pipe, waveform, beats, resonance, spectrogram)
   COLOUR white ground, dark ink, signal red and blue as in the Schalllabor, violet for partials
   TYPE Atkinson Hyperlegible
   LAYOUT laptop: experiments | stage | panel; phone: stage, panel, experiments */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#10161b);--ink:light-dark(#14212b,#e6ecf1);--mut:light-dark(#5a6772,#9babb7);--line:light-dark(#dde3e8,#29343d);--pan:light-dark(#f2f5f7,#18212a);--red:light-dark(#df4329,#ff6b4f);--blue:light-dark(#2762c9,#6198ff);--vio:light-dark(#7b3cc4,#bb90ff);--fld:light-dark(#ffffff,#0c1115);--ok:light-dark(#1f7a4d,#53c98a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
button,select,input{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{flex:none}
h1{font-size:26px;line-height:1.05;margin:0;letter-spacing:-.02em}
h1 a{color:inherit;text-decoration:none}
h1 a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.tabs{display:flex;gap:3px;background:var(--pan);padding:4px;border-radius:12px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 11px;border-radius:9px;cursor:pointer;font-weight:700;min-height:40px}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.btn{border:1px solid var(--line);background:var(--bg);padding:7px 12px;border-radius:9px;cursor:pointer;min-height:38px;white-space:nowrap}
.btn:hover{border-color:var(--mut)}
.btn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.hot{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.lvl{display:flex;gap:3px;background:var(--pan);padding:4px;border-radius:12px}
.lvl button{border:0;background:none;padding:6px 9px;border-radius:8px;cursor:pointer;font-size:14px;min-height:34px}
.lvl button[aria-pressed=true]{background:var(--bg);box-shadow:0 0 0 1px var(--line);font-weight:700}
main{display:grid;grid-template-columns:250px minmax(0,1fr) 320px;min-height:0}
#lib{overflow:auto;border-right:1px solid var(--line);padding:12px}
#lib h2{font-size:13px;color:var(--mut);margin:14px 4px 6px;font-weight:700}
#lib h2:first-child{margin-top:2px}
.pre{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px}
.pre b{display:block;font-size:15px}
.pre span{display:block;font-size:13px;color:var(--mut);line-height:1.3}
.pre:hover{background:var(--pan)}
.pre[aria-current=true]{background:var(--pan);box-shadow:inset 3px 0 0 var(--red)}
#stage{display:flex;flex-direction:column;min-height:0}
#tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);min-height:55px}
#tools .sep{width:1px;height:26px;background:var(--line);margin:0 4px}
#cvw{position:relative;flex:1;min-height:320px;background:var(--fld)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#status{font-size:13px;color:var(--mut);padding:5px 12px;border-top:1px solid var(--line);min-height:28px}
#panel{overflow:auto;border-left:1px solid var(--line);padding:6px 14px 20px}
.card{border-bottom:1px solid var(--line);padding:10px 0 12px}
.card:last-child{border-bottom:0}
.card h3{font-size:17px;margin:0 0 6px;line-height:1.2}
.card p{margin:4px 0}
.obs{background:var(--pan);border-radius:10px;padding:9px 11px;margin:6px 0}
details summary{cursor:pointer;font-weight:700;margin-top:6px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;margin:8px 0 2px;font-size:14px}
.row output{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--red);height:26px;margin:0}
.seg{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.seg button{flex:1 1 auto;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;cursor:pointer;min-height:36px;font-size:14px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chk{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px}
.chk label{display:flex;align-items:center;gap:6px;min-height:32px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--red)}
select.full{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px;background:var(--bg);font-size:15px;min-height:40px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;font-size:14px;margin-top:6px}
.kv b{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.formel{background:var(--pan);border-radius:10px;padding:9px 11px;font-size:15px;line-height:1.6;margin-top:6px}
.small{font-size:13px;color:var(--mut)}
.big{font-size:clamp(30px,4vw,44px);font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.keys{position:relative;height:96px;margin:8px 0;user-select:none;touch-action:manipulation}
.keys button{position:absolute;top:0;border:1px solid var(--ink);border-radius:0 0 6px 6px;cursor:pointer;padding:0;font-size:11px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px}
.keys .w{height:96px;background:#fff;color:#333;z-index:1}
.keys .b{height:58px;background:#1d242b;color:#ddd;z-index:2}
.keys button[aria-pressed=true]{background:var(--red);color:#fff}
.tuner{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center}
.gauge{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--red),#e9c46a 40%,var(--ok) 50%,#e9c46a 60%,var(--red));position:relative;margin:8px 0 2px}
.gauge i{position:absolute;top:-5px;width:4px;height:24px;background:var(--ink);border-radius:2px;transform:translateX(-2px)}
.quiz{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:6px}
#probe{display:none}
@media(max-width:1150px){main{grid-template-columns:215px minmax(0,1fr) 290px}.tabs button{padding:8px 8px}}
@media(max-width:900px){
  html,body,#app{height:auto}
  main{grid-template-columns:minmax(0,1fr)}
  #stage{order:1}
  #cvw{flex:none;height:min(64vh,560px)}
  #panel{order:2;border:0;border-top:1px solid var(--line);overflow:visible}
  #lib{order:3;border:0;border-top:1px solid var(--line);overflow:visible}
  h1{font-size:22px}
}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path d="M9 3v13a6 6 0 0 0 12 0V3" stroke="currentColor" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M15 22v10" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/><path d="M25 8q4 5 0 10" stroke="#df4329" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M29 5q6 8 0 16" stroke="#2762c9" stroke-width="2.6" fill="none" stroke-linecap="round" opacity=".7"/></svg>
    <h1><a href="../index.html" title="Zur Startseite">Klanglabor</a></h1>
  </div>
  <nav class="tabs" role="tablist" aria-label="Stationen">
    <button role="tab" data-mode="saite">Saite</button>
    <button role="tab" data-mode="pfeife">Pfeife</button>
    <button role="tab" data-mode="farbe">Klangfarbe</button>
    <button role="tab" data-mode="schwebung">Schwebung & Intervalle</button>
    <button role="tab" data-mode="resonanz">Resonanz</button>
    <button role="tab" data-mode="spektrum">Spektrum</button>
  </nav>
  <div class="lvl" role="group" aria-label="Niveau"><button data-lvl="1">Einfach</button><button data-lvl="2">Mittel</button><button data-lvl="3">Anspruchsvoll</button></div>
  <button class="btn" id="bTon" aria-pressed="true">Ton an</button>
  <button class="btn" id="bFull">Vollbild</button>
</header>
<main>
  <aside id="lib" aria-label="Versuche"></aside>
  <section id="stage">
    <div id="tools"></div>
    <div id="cvw"><canvas id="cv" aria-label="Simulation"></canvas></div>
    <div id="status"></div>
  </section>
  <aside id="panel" aria-label="Einstellungen"></aside>
</main>
</div>
<div id="probe"></div>
<script>
{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const cv=$('#cv'),ctx=cv.getContext('2d');
let CW=1,CH=1;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const fmt=(v,d=0)=>Number.isFinite(v)?v.toLocaleString('de-AT',{minimumFractionDigits:d,maximumFractionDigits:d}):'–';
const nice=x=>{const p=10**Math.floor(Math.log10(x)),m=x/p;return (m<1.5?1:m<3.5?2:m<7.5?5:10)*p};
const FONT='"Atkinson Hyperlegible",system-ui,sans-serif';
const MODES={},APP={mode:'',frame:0,lvl:2};
const TAU=Math.PI*2;

/* ---------- Farben ---------- */
const C={};
const rgb=s=>{const m=s.match(/[\d.]+/g)||[0,0,0];return [+m[0],+m[1],+m[2]]};
const cs=(k,a)=>a==null?`rgb(${C[k].join(',')})`:`rgba(${C[k].join(',')},${a})`;
function readCols(){const pr=$('#probe');for(const k of ['bg','ink','mut','line','pan','red','blue','vio','fld','ok']){pr.style.color=`var(--${k})`;C[k]=rgb(getComputedStyle(pr).color)}}
function txt(s,x,y,col,al='left',size=13,bold=false){ctx.font=`${bold?'700 ':''}${size}px ${FONT}`;ctx.textAlign=al;ctx.lineJoin='round';ctx.lineWidth=4;ctx.strokeStyle=cs('fld',.9);ctx.strokeText(s,x,y);ctx.fillStyle=col;ctx.fillText(s,x,y)}
function line(x1,y1,x2,y2,col,w=1,dash){ctx.strokeStyle=col;ctx.lineWidth=w;if(dash)ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();if(dash)ctx.setLineDash([])}

/* ---------- Noten ---------- */
const NN=['C','Cis','D','Dis','E','F','Fis','G','Gis','A','B','H'];
function note(f){if(!(f>0))return {name:'–',cents:0,midi:0};const m=69+12*Math.log2(f/440),r=Math.round(m);return {name:NN[(r%12+12)%12]+(Math.floor(r/12)-1),cents:(m-r)*100,midi:r}}
const mf=m=>440*2**((m-69)/12);

/* ---------- Ton ---------- */
const AU={ctx:null,muted:false,voices:new Set()};
function ac(){
  if(!AU.ctx){try{const A=window.AudioContext||window.webkitAudioContext,c=new A();AU.ctx=c;
    AU.m=c.createGain();AU.m.gain.value=AU.muted?0:.8;AU.comp=c.createDynamicsCompressor();AU.an=c.createAnalyser();AU.an.fftSize=8192;AU.an.smoothingTimeConstant=.5;
    AU.m.connect(AU.comp);AU.comp.connect(AU.an);AU.an.connect(c.destination);}catch(e){AU.ctx=null}}
  if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume().catch(()=>{});
  return AU.ctx;
}
function setMute(m){AU.muted=m;if(AU.ctx)AU.m.gain.setTargetAtTime(m?0:.8,AU.ctx.currentTime,.02);const b=$('#bTon');b.setAttribute('aria-pressed',String(!m));b.textContent=m?'Ton aus':'Ton an'}
function stopAll(){for(const v of AU.voices)v.stop();AU.voices.clear()}
/* Teiltöne spielen: parts=[{f,a,T}] T = Abklingzeit (s), 0 = gehalten */
function playParts(parts,o={}){
  const c=ac();if(!c)return null;const dur=o.dur||2.5,att=o.att??.006,t0=c.currentTime+.02+(o.delay||0),out=c.createGain();out.connect(o.dest||AU.m);
  const sum=parts.reduce((s,p)=>s+Math.abs(p.a),0)||1,sc=(o.vol??.5)/Math.max(1,sum);const oscs=[];
  for(const p of parts){if(!p.a||p.f>18000||p.f<15)continue;const os=c.createOscillator(),g=c.createGain();os.frequency.value=p.f;
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(Math.abs(p.a)*sc,t0+att);
    if(p.T)g.gain.setTargetAtTime(0,t0+att,p.T/3);else{g.gain.setValueAtTime(Math.abs(p.a)*sc,t0+dur-.12);g.gain.linearRampToValueAtTime(0,t0+dur)}
    os.connect(g);g.connect(out);os.start(t0);os.stop(t0+dur+.05);oscs.push(os)}
  const v={stop(){const t=c.currentTime;out.gain.setTargetAtTime(0,t,.02);for(const o of oscs){try{o.stop(t+.1)}catch(e){}}AU.voices.delete(v)},t0};
  AU.voices.add(v);setTimeout(()=>AU.voices.delete(v),(dur+(o.delay||0)+.3)*1000);return v;
}
/* gehaltener Ton aus Teiltönen (PeriodicWave), live veränderbar */
function holdTone(f,amps,phs){
  const c=ac();if(!c)return null;const os=c.createOscillator(),g=c.createGain();
  const set=(f,amps,phs)=>{const N=amps.length+1,re=new Float32Array(N),im=new Float32Array(N);let s=0;
    amps.forEach((a,i)=>{const ph=phs?phs[i]:0;re[i+1]=a*Math.sin(ph);im[i+1]=a*Math.cos(ph);s+=Math.abs(a)});
    os.setPeriodicWave(c.createPeriodicWave(re,im,{disableNormalization:true}));os.frequency.setTargetAtTime(f,c.currentTime,.01);g.gain.setTargetAtTime(s?.45/Math.max(1,s):0,c.currentTime,.03)};
  set(f,amps,phs);g.gain.value=0;os.connect(g);g.connect(AU.m);os.start();
  const v={set,stop(){g.gain.setTargetAtTime(0,c.currentTime,.03);try{os.stop(c.currentTime+.2)}catch(e){}AU.voices.delete(v)}};AU.voices.add(v);return v;
}

/* ---------- Bedienfeld ---------- */
const range=(id,label,min,max,step,val)=>`<div class="row"><label for="${id}">${label}</label><output id="${id}-o"></output></div><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}">`;
const seg=(key,opts,cur)=>`<div class="seg" role="group">${opts.map(([l,v])=>`<button data-${key}="${v}" aria-pressed="${String(v)===String(cur)}">${l}</button>`).join('')}</div>`;
const infoCard=p=>`<div class="card"><h3>${p.t}</h3><div class="obs"><b>Beobachte:</b> ${p.obs}</div><details><summary>Was passiert?</summary><p>${p.why}</p></details></div>`;
const setOut=(id,t)=>{const o=$('#'+id+'-o');if(o)o.textContent=t};
const setTxt=(id,t)=>{const o=$('#'+id);if(o)o.textContent=t};
function groupBy(arr){const g=[];for(const p of arr){let x=g.find(q=>q.h===p.g);if(!x)g.push(x={h:p.g,items:[]});x.items.push(p)}return g}
function renderLib(title,arr,cur,pick){let i=0;
  $('#lib').innerHTML=`<h2>${title}</h2>`+groupBy(arr).map(g=>`<h2>${g.h}</h2>`+g.items.map(p=>`<button class="pre" data-i="${i++}" aria-current="${i-1===cur}"><b>${p.t}</b><span>${p.d}</span></button>`).join('')).join('');
  $('#lib').onclick=e=>{const b=e.target.closest('.pre');if(b){pick(+b.dataset.i);if(innerWidth<900)$('#stage').scrollIntoView({behavior:'smooth'})}}}
function bars(x0,y0,w,h,vals,o={}){ // Spektrum-Balken
  const n=vals.length,bw=w/n,col=o.col||cs('vio');
  line(x0,y0+h,x0+w,y0+h,cs('line'));
  vals.forEach((v,i)=>{const bh=clamp(v,0,1)*(h-18),x=x0+i*bw+bw*.18,ww=bw*.64;ctx.fillStyle=o.cols?o.cols[i]:col;ctx.globalAlpha=o.dim&&o.dim[i]?.25:1;ctx.fillRect(x,y0+h-bh,ww,bh);ctx.globalAlpha=1;
    if(bw>16||i%2===0)txt(o.lab?o.lab(i):String(i+1),x+ww/2,y0+h+15,cs('mut'),'center',12)});
}
function lvlShow(n){return APP.lvl>=n}

/* =====================================================================
   STATION 1: SAITE (Monochord)
   ===================================================================== */
const STR={e:{n:'Stahl dünn (e-Saite)',mu:.000401,T1:3.2},E:{n:'Stahl dick, umsponnen (tiefe E-Saite)',mu:.00616,T1:4.5},ny:{n:'Nylon (Konzertgitarre)',mu:.000375,T1:1.6},darm:{n:'Darm (Barockgeige)',mu:.0006,T1:1.2}};
const TEIL=[['ganze Saite',1],['1/2 (Oktave)',1/2],['2/3 (Quinte)',2/3],['3/4 (Quarte)',3/4],['4/5 (große Terz)',4/5],['5/6 (kleine Terz)',5/6],['8/9 (Ganzton)',8/9],['15/16 (Halbton)',15/16]];
const NP=24;
const S1={pi:0,L:.648,F:73,str:'e',exc:'zupfen',p:.2,flag:0,teil:1,a:new Float32Array(NP+1),T:new Float32Array(NP+1),tp:-99,tv:0,drag:null,amp:1,hold:0};
const SP=[
 {g:'Saite',t:'Gitarrensaite zupfen',d:'Ziehen, loslassen, hören',s:{str:'e',L:.648,F:73,exc:'zupfen',p:.2,flag:0,teil:1},
  obs:'Ziehe die Saite mit der Maus oder dem Finger zur Seite und lass los. Beobachte, wie die Form der Saite aus den einzelnen Teiltönen entsteht.',
  why:'Eine gezupfte Saite schwingt nicht nur als Ganzes (Grundton), sondern gleichzeitig in 2, 3, 4 … Teilen (Obertöne). Ihre Frequenzen sind ganzzahlige Vielfache des Grundtons. Die hohen Teiltöne klingen schneller ab, darum wird der Ton mit der Zeit weicher.'},
 {g:'Saite',t:'Zupfstelle und Klang',d:'Mitte oder nahe am Steg?',s:{str:'e',L:.648,F:73,exc:'zupfen',p:.5,flag:0,teil:1},
  obs:'Zupfe genau in der Mitte, dann ganz nahe am Steg. Welche Teiltöne fehlen in der Mitte? Wie unterscheidet sich der Klang?',
  why:'Wo man zupft, entsteht ein Bauch. Teiltöne, die genau dort einen Knoten hätten, werden nicht angeregt: In der Mitte fehlen alle geraden Teiltöne, der Klang ist weich und hohl. Nahe am Steg entstehen viele hohe Teiltöne, der Klang wird hell und scharf (Gitarre: „sul ponticello“).'},
 {g:'Tonhöhe',t:'Monochord: Saite teilen',d:'Pythagoras und die Intervalle',s:{str:'e',L:.648,F:73,exc:'zupfen',p:.25,flag:0,teil:.5},
  obs:'Stelle unter „Teilung“ verschiedene Saitenlängen ein und spiele „ganz, dann geteilt“. Welche Intervalle hörst du?',
  why:'Halbe Saite: doppelte Frequenz, eine Oktave. 2/3 der Saite: Quinte, 3/4: Quarte. Schon Pythagoras hat mit dem Monochord entdeckt, dass einfache Zahlenverhältnisse gut zusammenklingen. Die Bünde einer Gitarre teilen die Saite in Halbtonschritte.'},
 {g:'Tonhöhe',t:'Spannung, Länge, Dicke',d:'Wovon hängt die Tonhöhe ab?',s:{str:'E',L:.648,F:70,exc:'zupfen',p:.2,flag:0,teil:1},
  obs:'Verändere Spannkraft, Länge und Saitenart. Wie musst du die Spannkraft ändern, damit der Ton eine Oktave höher wird?',
  why:'Kürzere, straffere und leichtere Saiten schwingen schneller. Die Frequenz ist f = 1/(2L) · √(F/μ). Für die doppelte Frequenz braucht man die vierfache Spannkraft. Deshalb sind tiefe Saiten dick und umsponnen statt sehr lang oder sehr locker.'},
 {g:'Spieltechnik',t:'Flageolett-Töne',d:'Finger leicht auf einen Knoten',s:{str:'e',L:.648,F:73,exc:'zupfen',p:.15,flag:2,teil:1},
  obs:'Lege den Finger leicht auf 1/2, 1/3 oder 1/4 der Saite und zupfe. Welche Teiltöne bleiben übrig? Wie hoch klingt der Ton?',
  why:'Der Finger erzwingt an dieser Stelle einen Knoten. Nur Teiltöne mit einem Knoten an dieser Stelle können weiterschwingen: bei 1/2 der 2., 4., 6. …, bei 1/3 der 3., 6., 9. … Teilton. Man hört einen hellen, glockigen Ton, eine Oktave bzw. eine Oktave plus Quinte höher.'},
 {g:'Spieltechnik',t:'Zupfen, Anschlagen, Streichen',d:'Gitarre, Klavier, Geige',s:{str:'darm',L:.33,F:58,exc:'streichen',p:.12,flag:0,teil:1},
  obs:'Vergleiche die drei Anregungen. Wie unterscheiden sich die Teiltöne und das Abklingen?',
  why:'Beim Zupfen entsteht ein Knick, die Teiltöne werden mit 1/n² schwächer. Der Hammer beim Klavier stößt die Saite an, die Teiltöne nehmen nur mit 1/n ab: heller. Der Geigenbogen hält die Saite dauernd in Schwingung (Haften und Gleiten), der Ton klingt nicht ab und ist sehr obertonreich.'}
];
const sF0=()=>Math.sqrt(S1.F/STR[S1.str].mu)/(2*S1.L*S1.teil);
function sAmps(p,exc){const a=new Float32Array(NP+1);
  for(let n=1;n<=NP;n++){const sn=Math.sin(n*Math.PI*p);a[n]=exc==='zupfen'?2*sn/(n*n*Math.PI*Math.PI*p*(1-p)):exc==='anschlagen'?.5*sn/n:.5/n}
  if(S1.flag)for(let n=1;n<=NP;n++)if(n%S1.flag)a[n]=0;return a}
function sPluck(amp=1){
  const f0=sF0(),a=sAmps(S1.p,S1.exc),T1=STR[S1.str].T1;S1.a=a;S1.amp=amp;
  for(let n=1;n<=NP;n++)S1.T[n]=S1.exc==='streichen'?0:T1/(1+.35*(n-1))*(S1.flag?1.2:1);
  S1.tp=performance.now()/1000;S1.tv=0;stopAll();
  const parts=[];for(let n=1;n<=NP;n++)parts.push({f:n*f0,a:a[n]*(S1.exc==='zupfen'?n:1)*amp,T:S1.T[n]});
  playParts(parts,{dur:S1.exc==='streichen'?2.5:Math.min(6,T1*1.6),att:S1.exc==='streichen'?.08:.004,vol:.55});
}
function sAmpNow(n){const t=performance.now()/1000-S1.tp;if(t<0)return 0;if(S1.exc==='streichen')return S1.a[n]*S1.amp*(t<2.5?1:Math.exp(-(t-2.5)/.25));return S1.a[n]*S1.amp*Math.exp(-t/S1.T[n])}
function sLoad(i){const p=SP[i];S1.pi=i;Object.assign(S1,p.s);S1.a=new Float32Array(NP+1);S1.tp=-99;sTools();sPanel();renderLib('Versuche: Saite',SP,i,sLoad)}
function sTools(){
  $('#tools').innerHTML=`<button class="btn hot" id="sPl">${S1.exc==='streichen'?'Streichen':S1.exc==='anschlagen'?'Anschlagen':'Zupfen'}</button>`+seg('exc',[['Zupfen','zupfen'],['Anschlagen','anschlagen'],['Streichen','streichen']],S1.exc)+
   `<span class="sep"></span><span class="small">Finger auf</span>`+seg('flag',[['–',0],['1/2',2],['1/3',3],['1/4',4],['1/5',5]],S1.flag);
  $('#tools').onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.id==='sPl')sPluck();else if(b.dataset.exc){S1.exc=b.dataset.exc;sTools();sPluck()}else if(b.dataset.flag){S1.flag=+b.dataset.flag;sTools();sPluck()}};
  $('#status').textContent='Ziehe die Saite zur Seite und lass los. Die Bewegung ist stark verlangsamt, der Ton ist echt.';
}
function sPanel(){
  const p=SP[S1.pi];
  $('#panel').innerHTML=infoCard(p)+`<div class="card"><h3>Saite</h3><div class="big" id="sNote"></div><p class="small" id="sF"></p>
   ${range('sL','Länge L',.2,1.2,.001,S1.L)}${range('sFk','Spannkraft F',10,200,.5,S1.F)}${range('sP','Zupfstelle',.03,.5,.01,S1.p)}
   <label class="small" for="sStr" style="display:block;margin-top:8px">Saitenart</label><select class="full" id="sStr">${Object.entries(STR).map(([k,s])=>`<option value="${k}" ${k===S1.str?'selected':''}>${s.n}</option>`).join('')}</select>
   <label class="small" for="sTe" style="display:block;margin-top:8px">Teilung (Steg verschieben)</label><select class="full" id="sTe">${TEIL.map(([l,v])=>`<option value="${v}" ${Math.abs(v-S1.teil)<1e-6?'selected':''}>${l}</option>`).join('')}</select>
   <div class="seg"><button data-act="cmp">Ganz, dann geteilt</button></div></div>
   <div class="card"><h3>Messwerte</h3><div class="kv" id="sKV"></div>${lvlShow(2)?'<div class="formel" id="sForm"></div>':''}</div>`;
  const P=$('#panel');
  P.oninput=e=>{const el=e.target;if(el.id==='sL')S1.L=+el.value;else if(el.id==='sFk')S1.F=+el.value;else if(el.id==='sP')S1.p=+el.value;sOuts()};
  P.onchange=e=>{const el=e.target;if(el.id==='sStr'){S1.str=el.value;sPluck()}else if(el.id==='sTe'){S1.teil=+el.value;sPluck()}else if(['sL','sFk','sP'].includes(el.id))sPluck();sOuts()};
  P.onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.act==='cmp'){const t=S1.teil;S1.teil=1;const f1=sF0();S1.teil=t;const f2=sF0();stopAll();
    const mk=f=>Array.from({length:12},(_,i)=>({f:f*(i+1),a:Math.sin((i+1)*Math.PI*S1.p)/((i+1)**1.4),T:STR[S1.str].T1/(1+.35*i)}));
    playParts(mk(f1),{dur:1.2,vol:.45});playParts(mk(f2),{dur:1.2,vol:.45,delay:1.2});playParts(mk(f1),{dur:2.5,vol:.4,delay:2.5});playParts(mk(f2),{dur:2.5,vol:.4,delay:2.5});S1.tp=-99}};
  sOuts();
}
function sOuts(){
  const f0=sF0(),n=note(f0),mu=STR[S1.str].mu,c=Math.sqrt(S1.F/mu),L=S1.L*S1.teil;
  setOut('sL',fmt(S1.L*100,1)+' cm');setOut('sFk',fmt(S1.F,1)+' N');setOut('sP',S1.p>=.495?'Mitte':fmt(S1.p*100)+' % der Länge');
  setTxt('sNote',`${fmt(f0,1)} Hz`);setTxt('sF',`Ton ${n.name}${lvlShow(3)?` (${n.cents>=0?'+':''}${fmt(n.cents)} Cent)`:''}`);
  const kv=$('#sKV');if(kv)kv.innerHTML=`<span>schwingende Länge</span><b>${fmt(L*100,1)} cm</b><span>Grundton f₁</span><b>${fmt(f0,1)} Hz</b><span>2. / 3. Teilton</span><b>${fmt(2*f0)} / ${fmt(3*f0)} Hz</b>`+
    (lvlShow(2)?`<span>Wellenlänge auf der Saite λ₁ = 2L</span><b>${fmt(2*L*100,1)} cm</b>`:'')+(lvlShow(3)?`<span>Wellengeschwindigkeit auf der Saite</span><b>${fmt(c)} m/s</b><span>Masse pro Länge μ</span><b>${fmt(mu*1000,2)} g/m</b>`:'');
  const fo=$('#sForm');if(fo)fo.innerHTML=lvlShow(3)?`f₁ = 1/(2L) · √(F/μ) = 1/(2 · ${fmt(L,3)} m) · √(${fmt(S1.F,1)} N / ${fmt(mu,6)} kg/m) = <b>${fmt(f0,1)} Hz</b><br>Teiltöne: fₙ = n · f₁`:`f₁ = 1/(2L) · √(F/μ)<br>doppelte Länge → halbe Frequenz; vierfache Spannkraft → doppelte Frequenz`;
}
function sGeo(){const X0=50,X1=CW-(CW>700?190:50),ys=clamp(CH*.2,70,150);return {X0,X1,ys,amp:clamp(CH*.12,30,80)}}
function sDraw(){
  const {X0,X1,ys,amp}=sGeo(),W=X1-X0,now=performance.now()/1000;ctx.fillStyle=cs('fld');ctx.fillRect(0,0,CW,CH);
  const Lp=W*S1.teil,XE=X0+Lp,tv=(now-S1.tp)*.9;
  // Brett und Stege
  ctx.fillStyle=cs('pan');ctx.fillRect(X0-30,ys+amp+16,W+60,16);
  const bridge=(x,lab)=>{ctx.fillStyle=cs('ink');ctx.beginPath();ctx.moveTo(x-9,ys+amp+16);ctx.lineTo(x,ys-2);ctx.lineTo(x+9,ys+amp+16);ctx.fill();if(lab)txt(lab,x,ys+amp+48,cs('mut'),'center',12)};
  bridge(X0,'Steg');bridge(XE,S1.teil<1?'verschobener Steg':'Steg');
  if(S1.teil<1){line(XE,ys,X1,ys,cs('mut',.5),2);txt(TEIL.find(t=>Math.abs(t[1]-S1.teil)<1e-6)?.[0]||'',(X0+XE)/2,ys+amp+48,cs('ink'),'center',13,true)}
  // Saite
  ctx.strokeStyle=cs('ink');ctx.lineWidth=S1.str==='E'?4:2.5;ctx.beginPath();
  if(S1.drag){const d=S1.drag;ctx.moveTo(X0,ys);ctx.lineTo(d.x,d.y);ctx.lineTo(XE,ys)}
  else for(let i=0;i<=200;i++){const u=i/200;let y=0;for(let n=1;n<=12;n++){const a=sAmpNow(n);if(a)y+=a*Math.sin(n*Math.PI*u)*Math.cos(TAU*n*.45*tv)}i?ctx.lineTo(X0+u*Lp,ys-y*amp):ctx.moveTo(X0,ys-y*amp)}
  ctx.stroke();
  if(S1.flag){const xf=X0+Lp/S1.flag;ctx.fillStyle=cs('red');ctx.beginPath();ctx.ellipse(xf,ys-16,8,12,0,0,TAU);ctx.fill();txt('Finger: 1/'+S1.flag,xf,ys-34,cs('red'),'center',13,true)}
  if(!S1.drag&&S1.tp<0)txt('↔ Saite ziehen und loslassen',(X0+XE)/2,ys-amp-6,cs('mut'),'center',14,true);
  // Teiltöne
  const top=ys+amp+66,nrow=6,bottomH=clamp(CH*.24,90,170),rh=(CH-top-bottomH-20)/nrow;
  if(rh>14){txt('Teiltöne (Eigenschwingungen der Saite)',X0,top-6,cs('ink'),'left',13,true);
    for(let n=1;n<=nrow;n++){const y0=top+(n-.5)*rh+6,a=sAmpNow(n),f=n*sF0(),A=Math.min(1,Math.abs(a))*rh*.42;
      line(X0,y0,X0+Lp,y0,cs('line'));ctx.strokeStyle=n===1?cs('red'):cs('vio');ctx.lineWidth=2;ctx.globalAlpha=Math.abs(a)>.01?1:.25;ctx.beginPath();
      for(let i=0;i<=120;i++){const u=i/120,y=y0-Math.sign(a||1)*Math.max(A,1.5)*Math.sin(n*Math.PI*u)*Math.cos(TAU*n*.45*tv);i?ctx.lineTo(X0+u*Lp,y):ctx.moveTo(X0,y)}ctx.stroke();ctx.globalAlpha=1;
      txt(`${n}. Teilton · ${fmt(f)} Hz${lvlShow(2)?' · '+note(f).name:''}`,X0+Lp+10<CW-150?X0+Lp+10:X0+4,X0+Lp+10<CW-150?y0+4:y0-rh*.3,n===1?cs('red'):cs('vio'),'left',12,true);
    }}
  // Spektrum
  const by=CH-bottomH,vals=[],lab=[];for(let n=1;n<=16;n++)vals.push(Math.abs(sAmpNow(n)));const mx=Math.max(.05,...vals);
  txt('Spektrum: Stärke der Teiltöne',X0,by+4,cs('ink'),'left',13,true);
  bars(X0,by+10,W,bottomH-34,vals.map(v=>v/mx),{cols:vals.map((_,i)=>i?cs('vio'):cs('red')),lab:i=>lvlShow(2)?(i<9||i%2?fmt((i+1)*sF0()):''):String(i+1)});
  if(lvlShow(2))txt('Hz',X1+8,CH-8,cs('mut'),'left',12);
}
function sDown(X,Y){const {X0,X1,ys}=sGeo(),XE=X0+(X1-X0)*S1.teil;if(X>X0+4&&X<XE-4&&Math.abs(Y-ys)<70){stopAll();S1.tp=-99;S1.drag={x:X,y:Y}}}
function sMove(X,Y){if(!S1.drag)return;const {X0,X1,ys,amp}=sGeo(),XE=X0+(X1-X0)*S1.teil;S1.drag={x:clamp(X,X0+6,XE-6),y:clamp(Y,ys-amp*1.2,ys+amp*1.2)}}
function sUp(){if(!S1.drag)return;const {X0,X1,ys,amp}=sGeo(),XE=X0+(X1-X0)*S1.teil,d=S1.drag;S1.drag=null;
  S1.p=clamp((d.x-X0)/(XE-X0),.03,.97);if(S1.p>.5)S1.p=1-S1.p;const a=Math.abs(ys-d.y)/amp;if(a<.05)return;sPluck(clamp(a,.15,1.2)*Math.sign(ys-d.y));const el=$('#sP');if(el)el.value=S1.p;sOuts()}
MODES.saite={enter(){sLoad(S1.pi)},frame(){},draw:sDraw,upd:sOuts,down:sDown,move:sMove,up:sUp,key(k){if(k===' ')sPluck()}};

const pc=()=>331.3+.606*P2.T;
const pF=(L=P2.L,typ=P2.typ,k=1)=>typ==='offen'?k*pc()/(2*L):(2*k-1)*pc()/(4*L);
function pBlow(only){stopAll();const f1=pF();P2.tp=performance.now()/1000;let parts=[];
  if(only)parts=[{f:pF(P2.L,P2.typ,P2.n),a:1}];
  else for(let k=1;k<=10;k++)parts.push({f:pF(P2.L,P2.typ,k),a:(P2.typ==='offen'?1/k**1.4:1/k**1.1)*(k===1?1:.7)});

function panLen(){const base=mf(72),steps=[0,2,4,5,7,9,11,12];return steps.map(s=>({f:base*2**(s/12),L:pc()/(4*base*2**(s/12)),name:note(base*2**(s/12)).name}))}
function pLoad(i){const p=PP[i];P2.pi=i;P2.T=20;Object.assign(P2,p.s);P2.tp=-99;pTools();pPanel();renderLib('Versuche: Pfeife',PP,i,pLoad)}

function pDraw(){
  ctx.fillStyle=cs('fld');ctx.fillRect(0,0,CW,CH);if(P2.pan)return panDraw();
  const X0=60,X1=CW-50,tT=40,tH=clamp(CH*.26,70,160),tB=tT+tH,W=X1-X0,now=performance.now()/1000,ph=TAU*.5*now,k=P2.n;
  const off=P2.typ==='offen',kk=off?k*Math.PI:(2*k-1)*Math.PI/2;
  const sx=u=>off?Math.cos(kk*u):Math.sin(kk*u),px=u=>off?Math.sin(kk*u):Math.cos(kk*u);
  // Druckfarbe
  const cp=Math.cos(ph);for(let X=X0;X<X1;X+=3){const v=px((X-X0)/W)*cp,r=C.red,b=C.blue,f=C.fld,t=v>0?r:b,w=Math.min(1,Math.abs(v))**.8;ctx.fillStyle=`rgb(${f.map((c,i)=>Math.round(c+(t[i]-c)*w)).join(',')})`;ctx.fillRect(X,tT,3.5,tH)}

  ctx.strokeStyle=cs('ink');ctx.lineWidth=3;line(X0,tT,X1,tT,cs('ink'),3);line(X0,tB,X1,tB,cs('ink'),3);
  if(!off){ctx.fillStyle=cs('ink');ctx.fillRect(X0-12,tT-4,12,tH+8);txt('geschlossen',X0-6,tB+22,cs('mut'),'left',12)}else txt('offen',X0,tB+22,cs('mut'),'left',12);
  txt('offen',X1,tB+22,cs('mut'),'right',12);
  // Hüllkurven
  const gT=tB+50,gH=clamp(CH*.26,60,170),gM=gT+gH/2;txt('Stehende Welle: Schwingungsform '+k,X0,gT-14,cs('ink'),'left',13,true);

function autoCorr(buf,sr){let rms=0;for(const v of buf)rms+=v*v;rms=Math.sqrt(rms/buf.length);if(rms<.01)return 0;

  let best=-1,bl=0;const c0=buf.reduce((s,v)=>s+v*v,0);for(let l=minL+1;l<=maxL;l++){if(c[l]>c[l-1]&&c[l]>=c[l+1]&&c[l]>best){best=c[l];bl=l}}
  if(bl<=0||best<c0*.35)return 0;let l=bl;for(let k=2;k<=6;k++){const l2=Math.round(bl/k);if(l2>=minL&&c[l2]>best*.9)l=l2}

function fit(){const r=$('#cvw').getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);CW=Math.max(50,r.width);CH=Math.max(50,r.height);cv.width=Math.round(CW*d);cv.height=Math.round(CH*d);ctx.setTransform(d,0,0,d,0,0)}
const ro=new ResizeObserver(()=>fit());ro.observe($('#cvw'));
const thObs=new MutationObserver(()=>{readCols();SP6.spec=null});thObs.observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readCols();SP6.spec=null})}catch(e){}
function setMode(m){if(!MODES[m])m='saite';if(m===APP.mode)return;const old=MODES[APP.mode];if(old&&old.leave)old.leave();stopAll();APP.mode=m;
  $$('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.mode===m)));MODES[m].enter()}
function setLvl(l){APP.lvl=l;try{localStorage.setItem('klang-lvl',String(l))}catch(e){}$$('.lvl button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.lvl===l)));
  const m=APP.mode;if(m==='saite')sPanel();else if(m==='pfeife')pPanel();else if(m==='farbe'){kPanel()}else if(m==='schwebung')bPanel();else if(m==='resonanz')rPanel();else spPanel()}
$$('.tabs button').forEach(b=>b.onclick=()=>{location.hash=b.dataset.mode;setMode(b.dataset.mode)});
$$('.lvl button').forEach(b=>b.onclick=()=>setLvl(+b.dataset.lvl));
addEventListener('hashchange',()=>setMode(location.hash.slice(1)));
$('#bTon').onclick=()=>{ac();setMute(!AU.muted)};
$('#bFull').onclick=()=>{const d=document;try{if(d.fullscreenElement)d.exitFullscreen();else d.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};
const pos=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
cv.addEventListener('pointerdown',e=>{ac();try{cv.setPointerCapture(e.pointerId)}catch(_){}MODES[APP.mode].down(...pos(e))});
cv.addEventListener('pointermove',e=>MODES[APP.mode].move(...pos(e)));
const up=()=>MODES[APP.mode].up();cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
const cvw=$('#cvw');cvw.addEventListener('dragover',e=>{e.preventDefault()});cvw.addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f){setMode('spektrum');location.hash='spektrum';playFile(f)}});
document.addEventListener('click',()=>{if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume().catch(()=>{})},true);
addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key===' '&&e.target.tagName==='BUTTON')return;if(e.key===' '){e.preventDefault();ac();MODES[APP.mode].key(' ')}});
let lv=2;try{lv=+localStorage.getItem('klang-lvl')||2}catch(e){}APP.lvl=clamp(lv,1,3);$$('.lvl button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.lvl===APP.lvl)));
readCols();fit();setMode(location.hash.slice(1)||'saite');
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;APP.frame++;const M=MODES[APP.mode];try{M.frame(dt);M.draw();if(APP.frame%6===0)M.upd()}catch(err){console.error(err)}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
}

</script>
</body>
