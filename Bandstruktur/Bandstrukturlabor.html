<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bandstrukturlabor – vom freien Elektron zur Bandstruktur</title>
<style>
  :root{
    --ink:#1d2230; --muted:#5b6477; --line:#d9dde6; --bg:#f4f6fa; --panel:#ffffff;
    --accent:#0f766e; --warn:#b91c1c;
    font-size:17px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.35}
  header{display:flex;align-items:center;gap:.7rem 1.1rem;flex-wrap:wrap;padding:.6rem 1rem;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  header h1{font-size:1.25rem;margin:0;flex:1 1 auto;white-space:nowrap}
  header h1 a{color:inherit;text-decoration:none}
  header h1 a:hover{text-decoration:underline;text-underline-offset:4px}
  header h1 small{font-weight:400;color:var(--muted);font-size:.85rem;margin-left:.4rem}
  .lvl{display:flex;align-items:center;gap:.5rem}
  .lvl > span{color:var(--muted);font-size:.9rem}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#eef1f6;flex-wrap:wrap}
  .seg button{border:0;background:transparent;padding:.42rem .6rem;font:inherit;font-size:.92rem;cursor:pointer;color:var(--ink)}
  .seg button + button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--accent);color:#fff;font-weight:600}
  .seg.small{flex-wrap:nowrap}
  .seg.small button{padding:.3rem .45rem;font-size:.8rem;white-space:nowrap}
  .btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:.42rem .8rem;font:inherit;font-size:.92rem;cursor:pointer;color:var(--ink)}
  .btn:hover{background:#f0f3f8}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  .layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:1rem;padding:1rem;align-items:start}
  aside{display:flex;flex-direction:column;gap:.8rem}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.8rem .9rem}
  .card h2{font-size:1rem;margin:0 0 .55rem}
  .field{margin:.4rem 0 .7rem}
  .field > label{display:flex;justify-content:space-between;gap:.5rem;font-size:.9rem;margin-bottom:.15rem}
  .field > label b{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
  input[type=range]{accent-color:var(--accent);width:100%}
  input.spectrum{-webkit-appearance:none;appearance:none;height:14px;border-radius:7px;outline:none}
  input.spectrum::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid #1d2230;cursor:pointer}
  input.spectrum::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #1d2230;cursor:pointer}
  select{font:inherit;font-size:.93rem;padding:.35rem;border-radius:8px;border:1px solid var(--line);width:100%;background:#fff}
  .check{display:flex;align-items:center;gap:.5rem;margin:.35rem 0;font-size:.92rem;cursor:pointer}
  .check input{width:1.1rem;height:1.1rem;accent-color:var(--accent)}
  .btnrow{display:flex;gap:.4rem;flex-wrap:wrap;margin:.4rem 0}
  .note{font-size:.84rem;color:var(--muted);margin:.35rem 0}
  .tasks{display:flex;flex-direction:column;gap:.35rem}
  .tasks button{font:inherit;font-size:.88rem;text-align:left;border:1px solid var(--line);background:#fafbfd;border-radius:9px;padding:.4rem .55rem;cursor:pointer;color:var(--ink)}
  .tasks button:hover{background:#eef6f5;border-color:#b8dcd7}
  .tasks button.on{background:#e3f3f1;border-color:var(--accent);font-weight:600}
  #taskInfo p{margin:.45rem 0;font-size:.92rem}
  #taskInfo .q{background:#fff8e6;border:1px solid #f4dfa5;border-radius:9px;padding:.45rem .6rem}
  #taskInfo .a{background:#eef7f2;border:1px solid #c5e4d2;border-radius:9px;padding:.45rem .6rem}
  .stage{min-width:0}
  .viewbox{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;height:calc(100vh - var(--hh, 100px));min-height:560px}
  #cv{display:block;width:100%;height:100%;touch-action:none}
  @media (max-width: 900px){ .layout{grid-template-columns:1fr} aside{order:2} .viewbox{height:75vh;min-height:460px} }
</style>
</head>
<body>
<header>
  <h1><a href="../index.html" title="Zur Startseite">Bandstrukturlabor</a> <small>wie Energiebänder entstehen</small></h1>
  <div class="seg" id="stSeg"><button data-s="0" class="on">Freies Elektron</button><button data-s="1">Reziproker Raum</button><button data-s="2">Kristallpotential</button><button data-s="3">Bragg</button><button data-s="4">Atome → Band</button><button data-s="5">Bänder füllen</button><button data-s="6">Si &amp; GaAs</button></div>
  <div class="lvl"><span>Niveau:</span>
    <div class="seg" id="lvlSeg"><button data-v="easy" class="on">Einfach</button><button data-v="mid">Mittel</button><button data-v="hard">Anspruchsvoll</button></div>
  </div>
  <button class="btn" id="fsBtn">Vollbild</button>
</header>
<div class="layout">
  <aside>
    <div class="card"><h2 id="ctrlTitle">Einstellungen</h2><div id="ctrl"></div></div>
    <div class="card"><h2>Aufträge</h2><div class="tasks" id="tasks"></div><div id="taskInfo"></div></div>
  </aside>
  <section class="stage">
    <div class="viewbox" id="vb"><canvas id="cv"></canvas></div>
    <p class="note" style="margin:.5rem .2rem">Passt dazu: <a href="../Halbleiter/Halbleiterlabor.html">Halbleiterlabor</a> (Dotierung, Diode, Solarzelle, LED).</p>
  </section>
</div>

<script>
"use strict";
/* =====================================================================
   Bandstrukturlabor – sieben Stationen:
   0 Freies Elektron · 1 Reziproker Raum · 2 Kristallpotential (Kronig-Penney)
   3 Bragg-Reflexion · 4 Atome → Band (Tight-Binding) · 5 Bänder füllen · 6 Si & GaAs
   ===================================================================== */
const $ = s => document.querySelector(s);
const HC = 1239.84193;               /* h·c in eV·nm */
const KB = 8.617333e-5;              /* Boltzmann-Konstante in eV/K */
const QE = 1.602176634e-19, C_LIGHT = 2.99792458e8, H_PL = 6.62607015e-34;
const S = { st:0, level:'easy', task:-1, showAnswer:false };
const lvlNum = () => ({easy:0, mid:1, hard:2})[S.level];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random()*(b - a);

/* ---------- Zahlen und Farben ---------- */
function fmt(v, d){ if (!isFinite(v)) return '–'; return (Math.abs(v) < 0.5*Math.pow(10,-d) ? 0 : v).toFixed(d).replace('.', ','); }
function sup(n){ const m = {'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'}; return String(n).split('').map(c => m[c]).join(''); }
function sci(v, d){ if (v === 0) return '0'; const ex = Math.floor(Math.log10(Math.abs(v))); const m = v/Math.pow(10,ex); return fmt(m,d) + '·10' + sup(ex); }
function fmtI(I){ const a = Math.abs(I), s = I < 0 ? '−' : ''; if (a >= 1) return s + fmt(a, 2) + ' A'; if (a >= 1e-3) return s + fmt(a*1000, a < 0.01 ? 2 : 1) + ' mA'; if (a >= 1e-6) return s + fmt(a*1e6, 1) + ' µA'; if (a >= 1e-9) return s + fmt(a*1e9, 1) + ' nA'; return s + fmt(a*1e12, 1) + ' pA'; }
function fmtR(R){ if (R >= 1e6) return fmt(R/1e6, 1) + ' MΩ'; if (R >= 1e3) return fmt(R/1e3, 1) + ' kΩ'; return fmt(R, R < 10 ? 2 : 0) + ' Ω'; }
function nmRGB(nm){
  if (nm < 380) return [150, 90, 220];
  if (nm > 780) return [120, 30, 30];
  let r = 0, g = 0, b = 0;
  if (nm < 440){ r = -(nm-440)/60; b = 1; }
  else if (nm < 490){ g = (nm-440)/50; b = 1; }
  else if (nm < 510){ g = 1; b = -(nm-510)/20; }
  else if (nm < 580){ r = (nm-510)/70; g = 1; }
  else if (nm < 645){ r = 1; g = -(nm-645)/65; }
  else r = 1;
  const f = nm < 420 ? 0.35 + 0.65*(nm-380)/40 : nm > 700 ? 0.35 + 0.65*(780-nm)/80 : 1;
  return [r,g,b].map(v => Math.round(255*Math.pow(v*f, 0.8)));
}
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const spectrumCSS = (a, b) => { const st = []; const step = (b - a)/60; for (let nm = a; nm <= b + 1e-9; nm += step) st.push(`${rgba(nmRGB(nm),1)} ${((nm-a)/(b-a)*100).toFixed(1)}%`); return `linear-gradient(90deg,${st.join(',')})`; };
const region = nm => nm < 380 ? 'UV' : nm > 750 ? 'Infrarot' : 'sichtbar';

/* ---------- Canvas ---------- */
const cv = $('#cv'), ctx = cv.getContext('2d'), vb = $('#vb');
let W = 0, H = 0;
function resize(){
  const r = vb.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  W = r.width; H = r.height; cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
}
new ResizeObserver(resize).observe(vb);
function line(x1,y1,x2,y2,col,w){ ctx.strokeStyle = col; ctx.lineWidth = w || 1; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
function dline(x1,y1,x2,y2,col,w,dash){ ctx.save(); ctx.setLineDash(dash || [5,4]); line(x1,y1,x2,y2,col,w); ctx.restore(); }
function text(t, x, y, o){
  o = o || {}; ctx.font = `${o.weight || 500} ${o.size || 13}px ${o.mono ? 'ui-monospace,Menlo,Consolas,monospace' : 'system-ui'}`;
  ctx.fillStyle = o.col || '#1d2230'; ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'middle'; ctx.fillText(t, x, y);
}
function box(x, y, w, h, fill, stroke, r){ ctx.beginPath(); ctx.roundRect(x, y, w, h, r ?? 8); if (fill){ ctx.fillStyle = fill; ctx.fill(); } if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = 1.2; ctx.stroke(); } }
function circle(x, y, r, fill, stroke, lw){ ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); if (fill){ ctx.fillStyle = fill; ctx.fill(); } if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1.5; ctx.stroke(); } }
function pill(t, x, y, o){
  o = o || {}; ctx.font = `${o.weight || 600} ${o.size || 13}px system-ui`;
  const w = ctx.measureText(t).width + 14, h = (o.size || 13) + 10;
  const bx = o.align === 'left' ? x : o.align === 'right' ? x - w : x - w/2;
  box(bx, y - h/2, w, h, o.bg || '#10231f', o.border || null, 8);
  text(t, bx + w/2, y + 0.5, {col:o.col || '#7ff5d2', align:'center', weight:o.weight || 600, size:o.size || 13});
}
function wrapText(t, x, y, maxW, o){
  o = o || {}; ctx.font = `${o.weight || 500} ${o.size || 13}px system-ui`;
  const words = t.split(' '); let ln = ''; const lh = (o.size || 13) + 4;
  for (const w of words){ const test = ln ? ln + ' ' + w : w; if (ctx.measureText(test).width > maxW && ln){ text(ln, x, y, o); y += lh; ln = w; } else ln = test; }
  if (ln){ text(ln, x, y, o); y += lh; }
  return y;
}
function arrow(x1,y1,x2,y2,col,w){
  line(x1,y1,x2,y2,col,w || 2);
  const a = Math.atan2(y2-y1, x2-x1), h = 7 + (w || 2);
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(x2 - h*Math.cos(a-0.45), y2 - h*Math.sin(a-0.45)); ctx.lineTo(x2 - h*Math.cos(a+0.45), y2 - h*Math.sin(a+0.45)); ctx.fill();
}
function wiggle(x, y, ang, len, col, amp, lw){
  ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.strokeStyle = col; ctx.lineWidth = lw || 2.2; ctx.beginPath();
  for (let k = 0; k <= 24; k++){ const t = k/24, px = -len/2 + t*len, env = Math.sin(Math.PI*t); ctx.lineTo(px, env*(amp || 4)*Math.sin(t*Math.PI*6)); }
  ctx.stroke(); ctx.restore();
}
function heat(x, y, a){ /* kleine Wärmewellen */
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = '#ea580c'; ctx.lineWidth = 1.6;
  for (let k = -1; k <= 1; k++){ ctx.beginPath(); for (let s = 0; s <= 10; s++){ const yy = y - s*1.6, xx = x + k*6 + Math.sin(s*1.2)*2.2; s ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); } ctx.stroke(); }
  ctx.restore();
}
function hole(x, y, r){ circle(x, y, r, '#fff', '#dc2626', 1.8); text('+', x, y + 0.5, {align:'center', size:Math.round(r*1.5), weight:700, col:'#dc2626'}); }
function elec(x, y, r){ circle(x, y, r, '#1d4ed8'); }
/* Diagrammrahmen mit Achsen */
function plot(r, o){
  box(r.x, r.y, r.w, r.h, '#f8fafc', '#e2e8f0', 12);
  if (o.title) text(o.title, r.x + 12, r.y + 16, {weight:700, size:13});
  const L = r.x + (o.left || 50), R = r.x + r.w - (o.right || 14), T = r.y + (o.title ? 36 : 14), B = r.y + r.h - 30;
  const X = v => L + (v - o.x0)/(o.x1 - o.x0)*(R - L), Y = v => B - (v - o.y0)/(o.y1 - o.y0)*(B - T);
  for (const v of o.xt || []){ line(X(v), T, X(v), B, '#e5e9f0', 1); text(o.xf ? o.xf(v) : String(v), X(v), B + 10, {align:'center', size:10, col:'#64748b'}); }
  for (const v of o.yt || []){ line(L, Y(v), R, Y(v), v === 0 ? '#94a3b8' : '#e5e9f0', 1); text(o.yf ? o.yf(v) : String(v), L - 5, Y(v), {align:'right', size:10, col:'#64748b'}); }
  line(L, T, L, B, '#64748b', 1.2); line(L, B, R, B, '#64748b', 1.2);
  if (o.xl) text(o.xl, R, B + 22, {align:'right', size:11, col:'#475569'});
  if (o.yl) text(o.yl, L + 4, T - 8, {size:11, col:'#475569'});
  return { X, Y, L, R, T, B };
}
function clipTo(p){ ctx.save(); ctx.beginPath(); ctx.rect(p.L, p.T - 2, p.R - p.L, p.B - p.T + 4); ctx.clip(); }
function linFit(pts){
  const n = pts.length; if (n < 2) return null;
  const sx = pts.reduce((a,q) => a + q.f, 0), sy = pts.reduce((a,q) => a + q.e, 0), sxx = pts.reduce((a,q) => a + q.f*q.f, 0), sxy = pts.reduce((a,q) => a + q.f*q.e, 0);
  const den = n*sxx - sx*sx; if (Math.abs(den) < 1e-12) return null;
  const m = (n*sxy - sx*sy)/den; return { m, b:(sy - m*sx)/n };
}

/* ---------- Bedienelemente links ---------- */
const UI = {
  el: $('#ctrl'),
  clear(){ this.el.innerHTML = ''; },
  slider(label, o){
    const d = document.createElement('div'); d.className = 'field';
    d.innerHTML = `<label><span>${label}</span><b></b></label><input type="range" min="${o.min}" max="${o.max}" step="${o.step}">`;
    const b = d.querySelector('b'), inp = d.querySelector('input');
    if (o.cls) inp.className = o.cls; if (o.bg) inp.style.background = o.bg;
    inp.value = o.get(); b.innerHTML = o.fmt(o.get());
    inp.oninput = () => { o.set(+inp.value); b.innerHTML = o.fmt(+inp.value); };
    d.refresh = () => { inp.value = o.get(); b.innerHTML = o.fmt(o.get()); };
    this.el.appendChild(d); return d;
  },
  select(label, opts, get, set){
    const d = document.createElement('div'); d.className = 'field';
    d.innerHTML = `<label><span>${label}</span></label><select>${opts.map(([v,t]) => `<option value="${v}">${t}</option>`).join('')}</select>`;
    const s = d.querySelector('select'); s.value = get(); s.onchange = () => set(s.value);
    this.el.appendChild(d); return d;
  },
  seg(label, opts, get, set){
    const d = document.createElement('div'); d.className = 'field';
    d.innerHTML = (label ? `<label><span>${label}</span></label>` : '') + `<div class="seg small">${opts.map(([v,t]) => `<button data-v="${v}">${t}</button>`).join('')}</div>`;
    const btns = [...d.querySelectorAll('button')];
    const upd = () => btns.forEach(b => b.classList.toggle('on', b.dataset.v === String(get())));
    btns.forEach(b => b.onclick = () => { set(b.dataset.v); upd(); });
    upd(); this.el.appendChild(d); return d;
  },
  check(label, get, set){
    const d = document.createElement('label'); d.className = 'check';
    d.innerHTML = `<input type="checkbox"> ${label}`; const c = d.querySelector('input'); c.checked = get(); c.onchange = () => set(c.checked);
    this.el.appendChild(d); return d;
  },
  buttons(list){
    const d = document.createElement('div'); d.className = 'btnrow';
    for (const [t, fn, cls] of list){ const b = document.createElement('button'); b.className = 'btn ' + (cls || ''); b.innerHTML = t; b.onclick = fn; d.appendChild(b); }
    this.el.appendChild(d); return d;
  },
  note(html){ const p = document.createElement('p'); p.className = 'note'; p.innerHTML = html; this.el.appendChild(p); return p; }
};
function flash(t){ const n = UI.note('⚠ ' + t); n.style.color = '#b91c1c'; setTimeout(() => n.remove(), 3500); }

/* ---------- gemeinsame Größen ---------- */
const C0 = 0.0381;          /* ħ²/(2 m_e) in eV·nm² */
const AL = 0.4;             /* Gitterkonstante der 1D-Modelle in nm */
const KZ = Math.PI/AL;      /* Zonengrenze π/a in nm⁻¹ */
const freeE = k => C0*k*k;
function kTicks(n){ const t = []; for (let m = -n; m <= n; m++) t.push(m*KZ); return t; }
const kLabel = v => { const m = Math.round(v/KZ); return m === 0 ? '0' : (m === 1 ? 'π/a' : m === -1 ? '−π/a' : (m < 0 ? '−' : '') + Math.abs(m) + 'π/a'); };

/* =====================================================================
   Station 0: Freies Elektron – Parabel E(k) und erlaubte Zustände
   ===================================================================== */
const FE = { N:8, n:2, cont:false, t:0 };
function feK(n){ return 2*Math.PI*n/(FE.N*AL); }
function feDraw(dt){
  FE.t += dt;
  const lv = lvlNum(), wide = W > 900;
  const top = { x:W*0.03, y:H*0.03, w:W*0.94, h:H*0.3 };
  const pr = wide ? { x:W*0.03, y:H*0.36, w:W*0.62, h:H*0.61 } : { x:10, y:H*0.36, w:W - 20, h:H*0.42 };
  const info = wide ? { x:W*0.67, y:H*0.36, w:W*0.3, h:H*0.61 } : { x:10, y:H*0.8, w:W - 20, h:H*0.19 };
  const k = feK(FE.n), E = freeE(k);
  /* Welle im Kristall ohne Potential */
  box(top.x, top.y, top.w, top.h, '#fbfcfe', '#e2e8f0', 12);
  text(lv ? `Elektronenwelle: λ = 2π/k = ${Math.abs(k) > 1e-9 ? fmt(2*Math.PI/Math.abs(k),2) + ' nm' : '∞'} · läuft nach ${k > 0 ? 'rechts' : k < 0 ? 'links' : '– (steht)'}` : 'Elektronenwelle im Kristall (ohne Kräfte durch die Atome)', top.x + 12, top.y + 16, {weight:700, size:13});
  const L = FE.N*AL, x0 = top.x + 30, xw = top.w - 60, yc = top.y + top.h*0.6, amp = top.h*0.28;
  for (let j = 0; j < FE.N; j++){ const x = x0 + (j + 0.5)/FE.N*xw; circle(x, yc, 5, '#cbd5e1'); }
  line(x0, yc, x0 + xw, yc, '#e2e8f0', 1);
  ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 2.5; ctx.beginPath();
  const w = E*2.2;
  for (let s = 0; s <= 400; s++){ const x = s/400*L, y = Math.cos(k*x - w*FE.t); const px = x0 + s/400*xw; s ? ctx.lineTo(px, yc - amp*y) : ctx.moveTo(px, yc - amp*y); }
  ctx.stroke();
  dline(x0, yc - amp - 6, x0 + xw, yc - amp - 6, 'rgba(234,88,12,.6)', 1.5);
  text(lv ? '|ψ|² überall gleich: das Elektron ist nirgends bevorzugt' : 'Aufenthaltswahrscheinlichkeit überall gleich', x0 + xw, yc - amp - 14, {align:'right', size:11, col:'#ea580c'});
  text(`${FE.N} Atome im Ring (Ende = Anfang)`, x0, top.y + top.h - 10, {size:11, col:'#64748b'});
  /* E(k)-Diagramm */
  const Emax = freeE(3*KZ)*0.62;
  const p = plot(pr, { title:'Energie E über Wellenzahl k', x0:-2.4*KZ, x1:2.4*KZ, y0:0, y1:Emax, xt: lv ? kTicks(2) : [0], xf:kLabel, yt:[0,2,4,6,8,10,12].filter(v => v <= Emax), yf:v => lv ? v + ' eV' : '', xl:'k', yl:'E', left:46 });
  clipTo(p);
  ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2; ctx.beginPath();
  for (let s = 0; s <= 300; s++){ const kk = -2.4*KZ + s/300*4.8*KZ; s ? ctx.lineTo(p.X(kk), p.Y(freeE(kk))) : ctx.moveTo(p.X(kk), p.Y(freeE(kk))); }
  ctx.stroke();
  if (lv) for (const m of [-1, 1]) dline(p.X(m*KZ), p.T, p.X(m*KZ), p.B, '#c084fc', 1.4);
  if (!FE.cont){

const KP = { V0:6, bf:0.25, scheme:'ext', free:true, dos:false, cacheKey:'', bands:null, sel:0.5 };
function kpF(E, V0, w, b){
  const al = Math.sqrt(E/C0);
  if (E < V0){
    const be = Math.sqrt((V0 - E)/C0), sh = be*b > 1e-9 ? Math.sinh(be*b)/be : b;
    return Math.cos(al*w)*Math.cosh(be*b) + (be*be - al*al)/(2*al)*Math.sin(al*w)*sh;
  }
  const ga = Math.sqrt((E - V0)/C0), sg = ga*b > 1e-9 ? Math.sin(ga*b)/ga : b;
  return Math.cos(al*w)*Math.cos(ga*b) - (al*al + ga*ga)/(2*al)*Math.sin(al*w)*sg;
}
const KP_EMAX = 15;
function kpBands(){
  const key = KP.V0 + '|' + KP.bf;
  if (KP.cacheKey === key) return KP.bands;
  const b = KP.bf*AL, w = AL - b, bands = [];
  let cur = null, prevK = null, dir = 0;
  for (let E = 0.0004; E <= KP_EMAX; E += 0.0025){
    const f = kpF(E, KP.V0, w, b);
    if (Math.abs(f) <= 1){
      const k = Math.acos(f)/AL;
      if (!cur){ cur = { pts:[] }; bands.push(cur); dir = 0; }
      else if (prevK !== null){
        const d = Math.sign(k - prevK);
        if (dir !== 0 && d !== 0 && d !== dir && (k < 0.06*KZ || k > 0.94*KZ)){ cur = { pts:[] }; bands.push(cur); dir = 0; }
        else if (d !== 0) dir = d;
      }
      cur.pts.push([E, k]); prevK = k;
    } else { cur = null; prevK = null; }
  }
  bands.forEach((bd, i) => { bd.Emin = bd.pts[0][0]; bd.Emax = bd.pts[bd.pts.length - 1][0]; bd.n = i + 1; });
  KP.bands = bands.filter(bd => bd.pts.length > 3); KP.cacheKey = key;
  KP.bands.forEach((bd, i) => bd.n = i + 1);
  return KP.bands;
}
const kExt = (n, k) => n % 2 ? (n - 1)*KZ + k : n*KZ - k;
function kpDraw(dt){
  const lv = lvlNum(), wide = W > 900, bands = kpBands();
  const pot = wide ? { x:W*0.02, y:H*0.03, w:W*0.33, h:H*0.94 } : { x:10, y:10, w:W - 20, h:H*0.3 };
  const ek = wide ? { x:W*0.37, y:H*0.03, w: KP.dos && lv === 2 ? W*0.42 : W*0.61, h:H*0.94 } : { x:10, y:H*0.33, w:W - 20, h:H*0.65 };
  const Emax = KP_EMAX;
  /* ---- Potential mit Bändern ---- */
  box(pot.x, pot.y, pot.w, pot.h, '#fbfcfe', '#e2e8f0', 12);
  text('Potential im Kristall und erlaubte Energien', pot.x + 12, pot.y + 16, {weight:700, size:13});
  const px0 = pot.x + 44, pw = pot.w - 56, pt = pot.y + 36, pb = pot.y + pot.h - 30;
  const PY = E => pb - E/Emax*(pb - pt);
  for (const bd of bands){ ctx.fillStyle = 'rgba(37,99,235,.16)'; ctx.fillRect(px0, PY(bd.Emax), pw, PY(bd.Emin) - PY(bd.Emax)); }
  const nc = 4, cwid = pw/nc, b = KP.bf, Vd = Math.min(KP.V0, Emax*0.98);

    ctx.lineTo(x0, PY(Vd)); ctx.lineTo(x0 + cwid*b, PY(Vd)); ctx.lineTo(x0 + cwid*b, PY(0)); ctx.lineTo(x0 + cwid, PY(0));

  bands.forEach((bd, i) => { text(`Band ${bd.n}`, px0 + pw - 4, (PY(bd.Emin) + PY(bd.Emax))/2, {align:'right', size:11, weight:700, col:'#1d4ed8'}); });
  for (let i = 0; i + 1 < bands.length; i++){ const g1 = bands[i].Emax, g2 = bands[i + 1].Emin; if (g2 - g1 > 0.05 && PY(g1) - PY(g2) > 18) pill(lv ? `Lücke ${fmt(g2 - g1,2)} eV` : 'Lücke', px0 + cwid*(b + (1 - b)/2), (PY(g1) + PY(g2))/2, {size:11, bg:'#fff1f1', col:'#b91c1c'}); }
  if (lv) pill(KP.V0 > Emax ? `V₀ = ${fmt(KP.V0,1)} eV (oben abgeschnitten)` : `V₀ = ${fmt(KP.V0,1)} eV`, px0 + pw/2, pt + 8, {size:11, bg:'#f1f5f9', col:'#334155'});
  /* ---- E(k) ---- */
  const xr = KP.scheme === 'red' ? 1 : KP.scheme === 'per' ? 2 : 3;
  const p = plot(ek, { title: KP.scheme === 'ext' ? 'Bandstruktur E(k) – erweitertes Zonenschema' : KP.scheme === 'red' ? 'Bandstruktur E(k) – reduziertes Zonenschema' : 'Bandstruktur E(k) – periodisches Zonenschema', x0:-xr*KZ, x1:xr*KZ, y0:0, y1:Emax, xt:kTicks(xr), xf:kLabel, yt:[0,3,6,9,12,15], yf:v => lv ? v + ' eV' : '', xl:'k', yl:'E', left:46 });

  if (KP.free){

    for (const sh of shifts){ ctx.beginPath(); for (let s = 0; s <= 400; s++){ const kk = -4*KZ + s/400*8*KZ; const y = p.Y(freeE(kk) + avg), x = p.X(kk + sh*2*KZ); s ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); }
    ctx.restore();

  const colors = ['#2563eb','#ea580c','#16a34a','#9333ea','#db2777','#0891b2','#ca8a04'];

  if (lv === 2) text('cos(ka) = cos(αw)·cosh(βb) + (β² − α²)/(2αβ)·sin(αw)·sinh(βb)', p.L + 6, p.B - 12, {size:11, col:'#475569'});

    hist.forEach((v, i) => { const w2 = Math.min(1, v/mx)*(pd.R - pd.L); ctx.fillRect(pd.L, pd.Y((i + 1)/nb*Emax), w2, pd.Y(i/nb*Emax) - pd.Y((i + 1)/nb*Emax) + 0.5); });

}
function kpControls(){

  UI.slider('Stärke der Atomrümpfe (Potentialhöhe V₀)', {min:0, max:20, step:0.25, get:() => KP.V0, set:v => KP.V0 = v, fmt:v => lv ? `${fmt(v,2)} eV` : (v < 0.5 ? 'keine' : v < 5 ? 'schwach' : v < 12 ? 'mittel' : 'stark')});

/* =====================================================================
   Station 3: Bragg-Reflexion und stehende Wellen (fast freie Elektronen)
   ===================================================================== */
const BR = { kf:0.7, U:1.2, band:'low', t:0 };
const GV = 2*Math.PI/AL;
function brState(k, U, band){
  const e1 = freeE(k), e2 = freeE(k - GV), Uc = -U;   /* anziehendes Potential an den Rümpfen */
  const m = (e1 + e2)/2, d = Math.sqrt(((e1 - e2)/2)**2 + Uc*Uc);
  const E = band === 'low' ? m - d : m + d;
  let A = Uc, B = E - e1;
  if (Math.abs(A) < 1e-12 && Math.abs(B) < 1e-12){ A = 1; B = 0; }
  const n = Math.hypot(A, B); return { E, A:A/n, B:B/n, e1, e2 };
}
function brDraw(dt){
  BR.t += dt;
  const lv = lvlNum(), wide = W > 900;
  const k = BR.kf*KZ, st = brState(k, BR.U, BR.band);
  const ek = wide ? { x:W*0.02, y:H*0.03, w:W*0.4, h:H*0.94 } : { x:10, y:10, w:W - 20, h:H*0.4 };
  const rs = wide ? { x:W*0.44, y:H*0.03, w:W*0.54, h:H*0.62 } : { x:10, y:H*0.42, w:W - 20, h:H*0.33 };
  const info = wide ? { x:W*0.44, y:H*0.68, w:W*0.54, h:H*0.29 } : { x:10, y:H*0.77, w:W - 20, h:H*0.22 };
  /* E(k) in der Nähe der Zonengrenze */
  const Emax = freeE(1.35*KZ) + BR.U + 0.3;
  const p = plot(ek, { title:'Bänder an der Zonengrenze', x0:0, x1:1.35*KZ, y0:0, y1:Emax, xt:[0, KZ], xf:kLabel, yt:[0,1,2,3,4,5].filter(v => v <= Emax), yf:v => lv ? v + ' eV' : '', xl:'k', yl:'E', left:44 });
  clipTo(p);
  ctx.save(); ctx.setLineDash([5,5]); ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.5; ctx.beginPath();
  for (let s = 0; s <= 200; s++){ const kk = s/200*1.35*KZ; s ? ctx.lineTo(p.X(kk), p.Y(freeE(kk))) : ctx.moveTo(p.X(kk), p.Y(freeE(kk))); } ctx.stroke(); ctx.restore();
  for (const [band, col] of [['low','#2563eb'],['high','#ea580c']]){
    ctx.strokeStyle = col; ctx.lineWidth = 2.8; ctx.beginPath();
    for (let s = 0; s <= 200; s++){
      const kk = s/200*KZ; let E = brState(kk, BR.U, band).E;
      s ? ctx.lineTo(p.X(kk), p.Y(E)) : ctx.moveTo(p.X(kk), p.Y(E));
    }
    ctx.stroke();
    /* Fortsetzung jenseits der Zonengrenze (erweitertes Schema) */
    ctx.globalAlpha = 0.35; ctx.strokeStyle = '#ea580c'; ctx.beginPath();
    for (let s = 0; s <= 100; s++){ const kk = KZ + s/100*0.35*KZ; const kr = 2*KZ - kk; const E = brState(kr, BR.U, band === 'low' ? 'high' : 'low').E; if (band === 'low') { s ? ctx.lineTo(p.X(kk), p.Y(E)) : ctx.moveTo(p.X(kk), p.Y(E)); } }
    ctx.stroke(); ctx.globalAlpha = 1;
  }
  dline(p.X(KZ), p.T, p.X(KZ), p.B, '#9333ea', 1.4);
  ctx.restore();
  const Eg = 2*BR.U;
  const yLo = p.Y(brState(KZ, BR.U, 'low').E), yHi = p.Y(brState(KZ, BR.U, 'high').E);
  if (BR.U > 0.05){ arrow(p.X(KZ) - 10, yLo, p.X(KZ) - 10, yHi + 2, '#b91c1c', 1.4); text(lv ? `Lücke 2|U| = ${fmt(Eg,2)} eV` : 'Lücke', p.X(KZ) - 14, (yLo + yHi)/2, {align:'right', size:11, weight:700, col:'#b91c1c'}); }
  circle(p.X(k), p.Y(st.E), 7, BR.band === 'low' ? '#2563eb' : '#ea580c', '#fff', 2);
  text('Zonengrenze', p.X(KZ) + 4, p.T + 8, {size:10, col:'#9333ea'});
  /* Ortsraum: Potential, |ψ|², Re ψ */
  box(rs.x, rs.y, rs.w, rs.h, '#fbfcfe', '#e2e8f0', 12);
  text('Welle im Kristall', rs.x + 12, rs.y + 16, {weight:700, size:13});
  const x0 = rs.x + 20, xw = rs.w - 40, cells = 4, L = cells*AL;
  const yP = rs.y + rs.h*0.3, yW = rs.y + rs.h*0.68, aW = rs.h*0.2;
  /* Potential V(x) = 2U' cos(Gx) */
  ctx.strokeStyle = '#64748b'; ctx.lineWidth = 1.6; ctx.beginPath();
  for (let s = 0; s <= 300; s++){ const x = s/300*L, V = -Math.cos(GV*x); const px = x0 + s/300*xw; s ? ctx.lineTo(px, yP - V*18*Math.min(1, BR.U/1.2 + 0.15)) : ctx.moveTo(px, yP - V*18*Math.min(1, BR.U/1.2 + 0.15)); }
  ctx.stroke();
  for (let c = 0; c <= cells; c++){ const px = x0 + c/cells*xw; circle(px, yP + 26, 7, '#475569'); text('+', px, yP + 26.5, {align:'center', size:11, weight:800, col:'#fff'}); }
  text(lv ? 'Potential (Mulden bei den Rümpfen)' : 'Atomrümpfe ziehen Elektronen an', rs.x + rs.w - 12, yP - 26, {align:'right', size:11, col:'#64748b'});
  /* |ψ|² */
  const dens = x => st.A*st.A + st.B*st.B + 2*st.A*st.B*Math.cos(GV*x);
  ctx.fillStyle = BR.band === 'low' ? 'rgba(37,99,235,.18)' : 'rgba(234,88,12,.18)'; ctx.beginPath(); ctx.moveTo(x0, yW + aW);
  for (let s = 0; s <= 300; s++){ const x = s/300*L; ctx.lineTo(x0 + s/300*xw, yW + aW - dens(x)*aW); }
  ctx.lineTo(x0 + xw, yW + aW); ctx.closePath(); ctx.fill();
  /* Re ψ(x, t) */
  const w = st.E*3;
  ctx.strokeStyle = BR.band === 'low' ? '#2563eb' : '#ea580c'; ctx.lineWidth = 2.4; ctx.beginPath();
  for (let s = 0; s <= 400; s++){ const x = s/400*L; const re = st.A*Math.cos(k*x - w*BR.t) + st.B*Math.cos((k - GV)*x - w*BR.t); const px = x0 + s/400*xw; s ? ctx.lineTo(px, yW - re*aW*0.7) : ctx.moveTo(px, yW - re*aW*0.7); }
  ctx.stroke();
  line(x0, yW + aW, x0 + xw, yW + aW, '#cbd5e1', 1);
  for (let c = 0; c <= cells; c++){ const px = x0 + c/cells*xw; dline(px, yP + 34, px, yW + aW, 'rgba(71,85,105,.25)', 1, [2,4]); }
  text('Linie: Welle · Fläche: Aufenthaltswahrscheinlichkeit |ψ|²', x0, rs.y + rs.h - 10, {size:11, col:'#475569'});
  /* Info */
  box(info.x, info.y, info.w, info.h, '#f8fafc', '#e2e8f0', 12);
  let y = info.y + 18;
  const near = BR.kf > 0.97;
  const msg = near
    ? (BR.band === 'low' ? 'An der Zonengrenze wird die Welle an den Gitterebenen reflektiert. Hin- und rücklaufende Welle bilden eine stehende Welle. Im unteren Band sitzen die Elektronen bei den positiven Rümpfen – dort ist ihre Energie niedrig.'
                         : 'Die andere stehende Welle hat ihre Bäuche zwischen den Rümpfen. Dort ist die potentielle Energie höher – deshalb liegt dieser Zustand oberhalb der Lücke.')
    : 'Weit weg von der Zonengrenze läuft die Welle fast ungestört durch den Kristall (fast wie ein freies Elektron). Je näher k an π/a kommt, desto stärker mischt sich die reflektierte Welle bei.';
  y = wrapText(msg, info.x + 12, y, info.w - 24, {size:13, col:'#334155'});
  if (lv >= 1) y = wrapText(`Bragg-Bedingung in 1D: 2a = n·λ ⇔ k = nπ/a. Anteil der reflektierten Welle: ${fmt(st.B*st.B*100,0)} %.`, info.x + 12, y + 4, info.w - 24, {size:12, col:'#475569'});
  if (lv === 2){
    const h = 1e-4*KZ, v = (brState(k + h, BR.U, BR.band).E - brState(Math.max(0, k - h), BR.U, BR.band).E)/(k + h - Math.max(0, k - h));
    wrapText(`Gruppengeschwindigkeit v = (1/ħ)·dE/dk = ${fmt(v*1.602e-19/1.0546e-34*1e-9/1e5, 2)}·10⁵ m/s – an der Zonengrenze null (stehende Welle).`, info.x + 12, y + 4, info.w - 24, {size:12, col:'#475569'});
  }
}
function brControls(){
  const lv = lvlNum();
  UI.slider('Wellenzahl k', {min:0.05, max:1, step:0.005, get:() => BR.kf, set:v => BR.kf = v, fmt:v => v > 0.995 ? 'k = π/a (Zonengrenze)' : `k = ${fmt(v,2)}·π/a`});
  UI.slider('Stärke des Gitterpotentials |U|', {min:0, max:2, step:0.05, get:() => BR.U, set:v => BR.U = v, fmt:v => lv ? `${fmt(v,2)} eV` : (v < 0.1 ? 'keine' : v < 1 ? 'schwach' : 'stark')});
  UI.seg('Band', [['low','unteres Band'],['high','oberes Band']], () => BR.band, v => BR.band = v);
  UI.buttons([['zur Zonengrenze', () => { BR.kf = 1; buildControls(); }, 'primary']]);
}

/* =====================================================================
   Station 4: Vom Atom zum Band – Tight-Binding (LCAO)
   E(k) = E₀ − 2t·cos(ka), zwei Orbitale (s und p)
   ===================================================================== */
const TB = { N:8, d:0.45, sel:{ band:0, n:0 }, both:true };
const TBP = [ { name:'s', E0:-8, t0:2.2, sign:1, col:'#2563eb' }, { name:'p', E0:-3, t0:2.6, sign:-1, col:'#ea580c' } ];
const tbT = (o, d) => o.t0*Math.exp(-(d - 0.25)/0.18);
const tbE = (o, d, k) => o.E0 - 2*o.sign*tbT(o, d)*Math.cos(k*AL);
function tbKs(N){ const ks = []; for (let n = 0; n < N; n++){ let m = n; if (m > N/2) m -= N; ks.push(2*Math.PI*m/(N*AL)); } return ks.sort((a, b) => a - b); }
function tbDraw(dt){
  const lv = lvlNum(), wide = W > 900;
  const chain = { x:W*0.02, y:H*0.03, w:W*0.96, h:H*0.3 };
  const ek = wide ? { x:W*0.02, y:H*0.36, w:W*0.58, h:H*0.61 } : { x:10, y:H*0.36, w:W - 20, h:H*0.4 };
  const lvl = wide ? { x:W*0.62, y:H*0.36, w:W*0.36, h:H*0.61 } : { x:10, y:H*0.78, w:W - 20, h:H*0.21 };
  const ks = tbKs(TB.N), orbs = TB.both ? TBP : [TBP[0]];
  const so = TBP[TB.sel.band], k = ks[clamp(TB.sel.n, 0, TB.N - 1)] ?? 0;
  /* Kette mit Orbitalen (Realteil der Bloch-Summe) */
  box(chain.x, chain.y, chain.w, chain.h, '#fbfcfe', '#e2e8f0', 12);
  const kn = Math.round(k*AL/(2*Math.PI)*TB.N);

  /* ---- Bandstruktur ---- */
  const p = plot(bs, { title:`Bandstruktur von ${M.name} (vereinfacht)`, x0:-SL, x1:1, y0: lv ? -13 : -4, y1:6, xt:[-SL, 0, 1], xf:v => v < -0.5 ? 'L' : v > 0.5 ? 'X' : 'Γ', yt: lv ? [-12,-9,-6,-3,0,3,6] : [-3,0,3,6], yf:v => lv ? v + ' eV' : '', xl:'Wellenvektor k', yl:'E', left:46 });
  ctx.fillStyle = 'rgba(147,51,234,.06)'; ctx.fillRect(p.L, p.T, p.X(0) - p.L, p.B - p.T);
  ctx.fillStyle = 'rgba(15,118,110,.06)'; ctx.fillRect(p.X(0), p.T, p.R - p.X(0), p.B - p.T);
  ctx.fillStyle = 'rgba(148,163,184,.15)'; ctx.fillRect(p.L, p.Y(M.Eg), p.R - p.L, p.Y(0) - p.Y(M.Eg));
  clipTo(p);
  const drawBand = (f, col, w) => { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); for (let i = 0; i <= 300; i++){ const s = -SL + i/300*(1 + SL); const y = p.Y(f(s)); i ? ctx.lineTo(p.X(s), y) : ctx.moveTo(p.X(s), y); } ctx.stroke(); };
  M.vb.forEach(f => drawBand(f, '#2563eb', 2.4));
  M.cb.forEach(f => drawBand(f, '#ea580c', 2.4));
  if (SG.mass && lv === 2){
    const [s0, E0] = M.cbMin, a = M.a, mstar = SG.mat === 'GaAs' ? 0.067 : 0.98, c = C0/mstar*(2*Math.PI/a)**2;
    ctx.save(); ctx.setLineDash([4,4]); ctx.strokeStyle = '#16a34a'; ctx.lineWidth = 1.8; ctx.beginPath();
    for (let i = 0; i <= 100; i++){ const s = s0 - 0.25 + i/100*0.5; const y = p.Y(E0 + c*(s - s0)**2); i ? ctx.lineTo(p.X(s), y) : ctx.moveTo(p.X(s), y); } ctx.stroke(); ctx.restore();
  }
  ctx.restore();
  dline(p.X(0), p.T, p.X(0), p.B, '#94a3b8', 1);
  text('Leitungsbänder', p.R - 6, p.Y(5.4), {align:'right', size:11, weight:700, col:'#c2410c'});

  /* Bandlücke markieren */
  const [sm, Em] = M.cbMin;
  circle(p.X(0), p.Y(0), 5, '#1d4ed8'); circle(p.X(sm), p.Y(Em), 5, '#c2410c');
  text(lv ? `E_g = ${fmt(M.Eg,2)} eV ${M.direct ? '(direkt)' : '(indirekt)'}` : (M.direct ? 'direkte Bandlücke' : 'indirekte Bandlücke'), p.X(0) + 8, p.Y(M.Eg/2) + 2, {size:12, weight:700, col:'#475569'});
  /* Absorption eines Photons */
  if (SG.absT >= 0){
    SG.absT += dt;
    const t = SG.absT;
    if (M.direct){
      const f = Math.min(1, t/0.8); arrow(p.X(0), p.Y(0), p.X(0), p.Y(0) + (p.Y(M.Eg) - p.Y(0))*f, '#ca8a04', 3);
      if (t > 0.8) pill(`Photon ${fmt(M.Eg,2)} eV (${fmt(HC/M.Eg,0)} nm) – k bleibt gleich`, p.X(0) + 10, p.Y(M.Eg) - 22, {align:'left', bg:'#fef9c3', col:'#854d0e', size:12});
    } else {
      const EG = 3.4, f1 = Math.min(1, t/0.8);
      arrow(p.X(0), p.Y(0), p.X(0), p.Y(0) + (p.Y(EG) - p.Y(0))*f1, 'rgba(202,138,4,.45)', 2);
      if (t > 0.3) text(`direkt bräuchte ${fmt(EG,1)} eV`, p.X(0) - 8, p.Y(EG) - 12, {align:'right', size:11, col:'#a16207'});
      const f2 = clamp((t - 0.9)/0.8, 0, 1), f3 = clamp((t - 1.8)/0.8, 0, 1);
      if (f2 > 0) arrow(p.X(0), p.Y(0), p.X(0), p.Y(0) + (p.Y(Em) - p.Y(0))*f2, '#ca8a04', 3);
      if (f3 > 0) arrow(p.X(0), p.Y(Em), p.X(0) + (p.X(sm) - p.X(0))*f3, p.Y(Em), '#7c3aed', 3);
      if (t > 2.6) pill('Photon (Energie) + Phonon (Impuls) nötig', p.X(sm*0.5), p.Y(Em) - 24, {bg:'#ede9fe', col:'#5b21b6', size:12});
    }
    if (SG.absT > 7) SG.absT = -1;
  }
  SG.geo = { bz };
  /* ---- Info ---- */
  box(info.x, info.y, info.w, info.h, '#f8fafc', '#e2e8f0', 12);
  let y = info.y + 18;
  y = wrapText(lv ? 'Silizium und Galliumarsenid haben ein kubisch-flächenzentriertes Gitter. Ihre Brillouin-Zone ist ein Oktaederstumpf. Γ ist die Mitte, X die Mitte der quadratischen Flächen, L die Mitte der Sechsecke.'
                  : 'Im echten Kristall hängt E(k) von der Richtung ab. Deshalb zeichnet man die Bänder entlang besonderer Wege durch die Brillouin-Zone, hier von L über die Mitte Γ nach X.', info.x + 12, y, info.w - 24, {size:12, col:'#334155'});
  box(info2.x, info2.y, info2.w, info2.h, '#f8fafc', '#e2e8f0', 12);
  y = info2.y + 18;
  y = wrapText(M.direct ? 'Galliumarsenid: Das Maximum des Valenzbandes und das Minimum des Leitungsbandes liegen beide bei Γ (direkte Bandlücke). Ein Photon kann ein Elektron direkt hinaufheben – und beim Zurückfallen wird effizient Licht ausgesandt. Deshalb baut man LEDs und Laser aus GaAs und verwandten Materialien.'
                        : 'Silizium: Das Minimum des Leitungsbandes liegt nicht bei Γ, sondern nahe bei X (indirekte Bandlücke). Photonen tragen fast keinen Impuls – um das Elektron dorthin zu bringen, muss zusätzlich eine Gitterschwingung (Phonon) mitwirken. Silizium absorbiert deshalb schwächer (dickere Solarzellen nötig) und leuchtet praktisch nicht.', info2.x + 12, y, info2.w - 24, {size:12, col:'#334155'});
  if (lv === 2) wrapText(`${M.mass}. Die effektive Masse folgt aus der Krümmung: 1/m* = (1/ħ²)·d²E/dk². Photonenimpuls bei 1 µm: k = 2π/λ ≈ 0,006 nm⁻¹ – rund 1/1800 von 2π/a.`, info2.x + 12, y + 4, info2.w - 24, {size:11, col:'#475569'});
}

function renderTasks(){
  const el = $('#tasks'); el.innerHTML = '';
  TASKS[S.st].forEach((t, k) => {
    if (t.min > lvlNum()) return;
    const b = document.createElement('button'); b.textContent = t.n; b.classList.toggle('on', k === S.task);
    b.onclick = () => { S.task = k; S.showAnswer = false; t.setup(); buildControls(); renderTasks(); };
    el.appendChild(b);
  });
  const info = $('#taskInfo'), t = TASKS[S.st][S.task];
  if (!t || t.min > lvlNum()){ info.innerHTML = '<p class="note">Wähle einen Auftrag oder probiere frei aus.</p>'; return; }
  info.innerHTML = `<p class="q"><b>Auftrag:</b> ${t.q}</p>` + (S.showAnswer ? `<p class="a">${t.a}</p>` : '') + `<button class="btn" id="ansBtn">${S.showAnswer ? 'Erklärung ausblenden' : 'Erklärung zeigen'}</button>`;
  $('#ansBtn').onclick = () => { S.showAnswer = !S.showAnswer; renderTasks(); };
}

function fitVB(){ document.documentElement.style.setProperty('--hh', (document.querySelector('header').offsetHeight + 46) + 'px'); }
window.addEventListener('resize', fitVB); fitVB();
cv.addEventListener('pointerdown', e => { const st = STATIONS[S.st]; if (st.click && st.click(...xy(e))) cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => { const st = STATIONS[S.st]; if (st.move) st.move(...xy(e)); });
cv.addEventListener('pointerup', () => { RR.drag = false; SG.drag = null; });
cv.addEventListener('pointercancel', () => { RR.drag = false; SG.drag = null; });
let last = performance.now();
function frame(ts){
  const dt = Math.min(0.05, (ts - last)/1000); last = ts;
  ctx.clearRect(0, 0, W, H);
  try { STATIONS[S.st].draw(dt); } catch(err){ console.error(err); }
  requestAnimationFrame(frame);
}
resize();
const startHash = STATIONS.findIndex(s => s.hash === location.hash.slice(1));
setStation(startHash >= 0 ? startHash : 0);
requestAnimationFrame(frame);
</script>
