<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schalllabor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday school lab, calm and legible on a classroom projector
   IDEA a wave tank and a Kundt tube on a lab bench: pressure painted red (Überdruck) and blue (Unterdruck)
   PICTURE the live simulation canvas fills the centre; the field itself is the picture
   COLOUR white ground, dark ink, signal red and blue from the pressure map, violet for microphones
   TYPE Atkinson Hyperlegible for everything (made for readability)
   LAYOUT laptop: library | stage | panel; phone: stage, panel, library stacked */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#10161b);--ink:light-dark(#14212b,#e6ecf1);--mut:light-dark(#5a6772,#9babb7);--line:light-dark(#dde3e8,#29343d);--pan:light-dark(#f2f5f7,#18212a);--red:light-dark(#df4329,#ff6b4f);--blue:light-dark(#2762c9,#6198ff);--mic:light-dark(#7b3cc4,#bb90ff);--fld:light-dark(#ffffff,#0c1115);--ok:light-dark(#1f7a4d,#53c98a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
button,select,input{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{flex:none}
h1{font-size:26px;line-height:1.05;margin:0;letter-spacing:-.02em}
h1 a{color:inherit;text-decoration:none}
h1 a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.tabs{display:flex;gap:4px;background:var(--pan);padding:4px;border-radius:12px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:700;min-height:40px}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.btn{border:1px solid var(--line);background:var(--bg);padding:7px 12px;border-radius:9px;cursor:pointer;min-height:38px;white-space:nowrap}
.btn:hover{border-color:var(--mut)}
.btn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.hot{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
main{display:grid;grid-template-columns:250px minmax(0,1fr) 320px;min-height:0}
#lib{overflow:auto;border-right:1px solid var(--line);padding:12px}
#lib h2,#panel h2{font-size:13px;color:var(--mut);margin:14px 4px 6px;font-weight:700}
#lib h2:first-child{margin-top:2px}
.pre{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px}
.pre b{display:block;font-size:15px}
.pre span{display:block;font-size:13px;color:var(--mut);line-height:1.3}
.pre:hover{background:var(--pan)}
.pre[aria-current=true]{background:var(--pan);box-shadow:inset 3px 0 0 var(--red)}
#stage{display:flex;flex-direction:column;min-height:0}
#tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line)}
#tools .sep{width:1px;height:26px;background:var(--line);margin:0 4px}
#tools select{border:1px solid var(--line);border-radius:9px;padding:7px 8px;min-height:38px;background:var(--bg)}
#cvw{position:relative;flex:1;min-height:320px;background:var(--fld)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#status{font-size:13px;color:var(--mut);padding:5px 12px;border-top:1px solid var(--line);min-height:28px}
#panel{overflow:auto;border-left:1px solid var(--line);padding:6px 14px 20px}
.card{border-bottom:1px solid var(--line);padding:10px 0 12px}
.card:last-child{border-bottom:0}
.card h3{font-size:17px;margin:0 0 6px;line-height:1.2}
.card p{margin:4px 0}
.obs{background:var(--pan);border-radius:10px;padding:9px 11px;margin:6px 0}
details summary{cursor:pointer;font-weight:700;margin-top:6px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;margin:8px 0 2px;font-size:14px}
.row output{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--red);height:26px;margin:0}
.seg{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.seg button{flex:1 1 auto;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;cursor:pointer;min-height:36px;font-size:14px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chk{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px}
.chk label{display:flex;align-items:center;gap:6px;min-height:32px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--red)}
select.full{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px;background:var(--bg);font-size:15px;min-height:40px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;font-size:14px;margin-top:6px}
.kv b{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.scope{width:100%;height:150px;display:block;border:1px solid var(--line);border-radius:8px;background:var(--fld)}
.mics{font-size:14px;margin-top:6px}
.mics div{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:2px 0}
.mics i{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none;transform:translateY(1px)}
.small{font-size:13px;color:var(--mut)}
.big{font-size:clamp(28px,4vw,40px);font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--mut)}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:4px;transform:translateY(1px)}
table.bands{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;font-variant-numeric:tabular-nums}
table.bands th,table.bands td{padding:3px 4px;text-align:right;border-bottom:1px solid var(--line)}
table.bands th:first-child,table.bands td:first-child{text-align:left}
.grid2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.grid2 label{font-size:13px;color:var(--mut)}
.grid2 input{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px;background:var(--bg);font-size:16px}
#probe{display:none}
@media(max-width:1150px){main{grid-template-columns:215px minmax(0,1fr) 290px}}
@media(max-width:900px){
  html,body,#app{height:auto}
  main{grid-template-columns:minmax(0,1fr)}
  #stage{order:1}
  #cvw{flex:none;height:min(64vh,560px)}
  #panel{order:2;border:0;border-top:1px solid var(--line);overflow:visible}
  #lib{order:3;border:0;border-top:1px solid var(--line);overflow:visible}
  h1{font-size:22px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand">
    <svg width="38" height="30" viewBox="0 0 38 30" aria-hidden="true"><rect x="1" y="9" width="7" height="12" rx="1.5" fill="currentColor"/><path d="M8 9 L15 3 V27 L8 21 Z" fill="currentColor"/><path d="M20 9 q4 6 0 12" stroke="#df4329" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M25 5 q7 10 0 20" stroke="#df4329" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/><path d="M30 2 q9 13 0 26" stroke="#2762c9" stroke-width="3" fill="none" stroke-linecap="round" opacity=".6"/></svg>
    <h1><a href="../index.html" title="Zur Startseite">Schalllabor</a></h1>
  </div>
  <nav class="tabs" role="tablist" aria-label="Bereiche">
    <button role="tab" data-mode="welle" id="tab-welle">Schallwelle</button>
    <button role="tab" data-mode="raum" id="tab-raum">Raum</button>

  </nav>
  <button class="btn" id="bTon" aria-pressed="false">Ton aus</button>

</header>
<main>
  <aside id="lib" aria-label="Versuche"></aside>
  <section id="stage">
    <div id="tools"></div>
    <div id="cvw"><canvas id="cv" aria-label="Simulation"></canvas></div>
    <div id="status"></div>
  </section>
  <aside id="panel" aria-label="Einstellungen"></aside>
</main>
</div>
<div id="probe"></div>
<script id="core">
// ===== Simulationskern (ohne DOM) =====
const S=0.5;            // Courant-Zahl c·dt/dx
const AMP=3;            // Einspeisung Punktquelle
const BEAMF=0.05;       // Einspeisung pro Punkt einer Lautsprecherzeile
const GAIN=4;           // Farbskala
const DBREF=100;        // dB-Bezug (≈ 80 dB in 1 m)
const IREF=0.02;        // Bezug Lautstärke-Ansicht
const MAT=[null,
  {k:'beton',n:'Beton',a:.02,col:'#8f979d'},
  {k:'holz',n:'Holz',a:.12,col:'#b8875a'},
  {k:'vorhang',n:'Vorhang',a:.5,col:'#a24a6c'},
  {k:'schaum',n:'Schaumstoff',a:.9,col:'#55616b'},
  {k:'fels',n:'Fels',a:.03,col:'#86735f'}];
const IZ=new Float32Array(8);
MAT.forEach((m,i)=>{if(m){const R=Math.sqrt(1-m.a);IZ[i]=(1-R)/(1+R)}});

class Ring{
  constructor(n){this.n=n;this.t=new Float64Array(n);this.v=new Float32Array(n);this.i=0;this.len=0}
  push(t,v){this.t[this.i]=t;this.v[this.i]=v;this.i=(this.i+1)%this.n;if(this.len<this.n)this.len++}
  clear(){this.i=0;this.len=0}
  at(k){const j=(this.i-this.len+k+this.n)%this.n;return j}
}
class Detector{
  constructor(){this.reset()}
  reset(){this.ev=[];this.cur=null;this.qs=0}
  feed(t,v,thr,quiet,cen){
    const a=Math.abs(v);
    if(this.cur){
      if(a>this.cur.pk){this.cur.pk=a;if(!cen)this.cur.tp=t}
      if(cen&&!this.qs){this.cur.se+=v*v;this.cur.st+=t*v*v;this.cur.tp=this.cur.st/this.cur.se}
      if(a<Math.max(thr*.3,this.cur.pk*.12)){if(!this.qs)this.qs=t;if(t-this.qs>quiet){this.cur.done=true;this.cur=null;this.qs=0}}else this.qs=0;
    }else if(a>thr){this.cur={t,tp:t,pk:a,se:v*v,st:t*v*v};this.ev.push(this.cur);if(this.ev.length>8)this.ev.shift();this.qs=0}
  }
}

function makeSim(nx,ny,M){
  const NX=nx+2*M,NY=ny+2*M,N=NX*NY;
  const s={nx,ny,M,NX,NY,N,p:new Float32Array(N),vx:new Float32Array((NX+1)*NY),vy:new Float32Array(NX*(NY+1)),
    mat:new Uint8Array(N),dp:new Float32Array(N),dvx:new Float32Array((NX+1)*NY),dvy:new Float32Array(NX*(NY+1)),
    I:new Float32Array(N),n:0,t:0,h:.05,c:343,dt:0,src:[],mic:[],beta:1/200,lastTrig:-1,trigOff:0};
  for(let j=0;j<NY;j++)for(let i=0;i<NX;i++){
    const dx=i<M?M-i:(i>=M+nx?i-(M+nx)+1:0),dy=j<M?M-j:(j>=M+ny?j-(M+ny)+1:0);
    const d=Math.max(dx,dy);s.dp[j*NX+i]=1-(d>0?0.3*(d/M)**2:0);
  }
  const FX=NX+1;
  for(let j=0;j<NY;j++)for(let i=0;i<=NX;i++){
    const a=Math.max(0,i-1),b=Math.min(NX-1,i);s.dvx[j*FX+i]=Math.min(s.dp[j*NX+a],s.dp[j*NX+b]);
  }
  for(let j=0;j<=NY;j++)for(let i=0;i<NX;i++){
    const a=Math.max(0,j-1),b=Math.min(NY-1,j);s.dvy[j*NX+i]=Math.min(s.dp[a*NX+i],s.dp[b*NX+i]);
  }
  return s;
}
function setScale(s,h,c){s.h=h;s.c=c;s.dt=S*h/c}
function clearWave(s){s.p.fill(0);s.vx.fill(0);s.vy.fill(0);s.I.fill(0);s.n=0;s.t=0;s.lastTrig=-1;
  for(const q of s.src){q.ts=0;if(q.x0!=null)q.x=q.x0}
  for(const m of s.mic)resetMic(m)}

function srcSig(q,t){
  const tt=t-q.ts;if(tt<0)return 0;
  if(q.type==='sinus'){const T=1/q.f,e=tt<T?0.5-0.5*Math.cos(Math.PI*tt/T):1;return e*Math.sin(2*Math.PI*q.f*tt+(q.ph?Math.PI:0))}
  if(q.type==='puls'){const D=4/q.f;if(tt>D)return 0;return Math.sin(2*Math.PI*q.f*tt+(q.ph?Math.PI:0))*(0.5-0.5*Math.cos(2*Math.PI*tt/D))}
  const fp=q.fp,sg=.8/fp;if(tt>5*sg)return 0;const d=tt-2.5*sg;return Math.sin(2*Math.PI*fp*d)*Math.exp(-((d/sg)**2))*(q.ph?-1:1)*1.6;
}
function sigLen(q){return q.type==='puls'?4/q.f:q.type==='knall'?4/q.fp:Infinity}

function addAt(s,x,y,val){
  const gx=x+s.M-0.5,gy=y+s.M-0.5,i=Math.floor(gx),j=Math.floor(gy),fx=gx-i,fy=gy-j;
  if(i<0||j<0||i>=s.NX-1||j>=s.NY-1)return;
  const c=j*s.NX+i,p=s.p,m=s.mat;
  if(!m[c])p[c]+=val*(1-fx)*(1-fy);
  if(!m[c+1])p[c+1]+=val*fx*(1-fy);
  if(!m[c+s.NX])p[c+s.NX]+=val*(1-fx)*fy;
  if(!m[c+s.NX+1])p[c+s.NX+1]+=val*fx*fy;
}
function addSmooth(s,x,y,val){
  const gx=x+s.M-0.5,gy=y+s.M-0.5,i0=Math.floor(gx)-1,j0=Math.floor(gy)-1,w=[];let ws=0;
  for(let j=0;j<4;j++)for(let i=0;i<4;i++){const v=Math.max(0,1-Math.abs(i0+i-gx)/2)*Math.max(0,1-Math.abs(j0+j-gy)/2);w.push(v);ws+=v}
  let k=0;for(let j=0;j<4;j++)for(let i=0;i<4;i++,k++){const c=(j0+j)*s.NX+i0+i;if(c>=0&&c<s.N&&!s.mat[c])s.p[c]+=val*w[k]/ws}
}
function trigOff(q){return q.type==='knall'?2/q.fp:q.type==='puls'?2/q.f:0}
function readAt(s,x,y){
  const gx=x+s.M-0.5,gy=y+s.M-0.5,i=Math.floor(gx),j=Math.floor(gy),fx=gx-i,fy=gy-j;
  if(i<0||j<0||i>=s.NX-1||j>=s.NY-1)return 0;
  const c=j*s.NX+i,p=s.p;
  return p[c]*(1-fx)*(1-fy)+p[c+1]*fx*(1-fy)+p[c+s.NX]*(1-fx)*fy+p[c+s.NX+1]*fx*fy;
}

function emit(s){
  const t=s.t;
  for(let k=s.src.length-1;k>=0;k--){
    const q=s.src[k];
    if(q.once&&t-q.ts>sigLen(q)){s.src.splice(k,1);continue}
    if(q.on===false)continue;
    if(q.type!=='sinus'&&q.rep>0&&t-q.ts>=q.rep){q.ts=t;s.lastTrig=t;s.trigOff=trigOff(q);for(const m of s.mic)trigMic(m,s)}
    const fr=q.type==='knall'?q.fp:q.f;
    if(q.w>0){
      const n=Math.max(2,Math.round(q.w/s.h)),ex=Math.cos(q.ang),ey=Math.sin(q.ang),px=-ey,py=ex;
      const tau=s.h/s.c,comp=1/Math.max(0.25,2*Math.sin(2*Math.PI*fr*tau));
      const g=q.amp*AMP*BEAMF*comp,v1=srcSig(q,t)*g,v2=-srcSig(q,t-tau)*g;
      if(v1||v2)for(let i=0;i<n;i++){const o=i-(n-1)/2,x=q.x+px*o,y=q.y+py*o;addAt(s,x,y,v1);addAt(s,x-ex,y-ey,v2)}
    }else{
      const v=srcSig(q,t)*q.amp*AMP;if(v){if(q.v)addSmooth(s,q.x,q.y,v);else addAt(s,q.x,q.y,v)}
    }
    if(q.v){q.x+=q.v/s.c*S;if(q.x>q.x1){q.x=q.x0}else if(q.x<q.x0&&q.v<0){q.x=q.x1}}
  }
}

function step(s){
  const NX=s.NX,NY=s.NY,FX=NX+1,p=s.p,vx=s.vx,vy=s.vy,mat=s.mat,dvx=s.dvx,dvy=s.dvy,dp=s.dp,I=s.I,b=s.beta;
  for(let j=0;j<NY;j++){const rp=j*NX,rf=j*FX;
    for(let i=1;i<NX;i++){const a=rp+i-1,ma=mat[a],mb=mat[a+1],f=rf+i;
      if(ma===0&&mb===0)vx[f]=vx[f]*dvx[f]-S*(p[a+1]-p[a]);
      else if(ma===0)vx[f]=p[a]*IZ[mb];
      else if(mb===0)vx[f]=-p[a+1]*IZ[ma];
      else vx[f]=0;}}
  for(let j=1;j<NY;j++){const rp=j*NX;
    for(let i=0;i<NX;i++){const c=rp+i,a=c-NX,ma=mat[a],mb=mat[c];
      if(ma===0&&mb===0)vy[c]=vy[c]*dvy[c]-S*(p[c]-p[a]);
      else if(ma===0)vy[c]=p[a]*IZ[mb];
      else if(mb===0)vy[c]=-p[c]*IZ[ma];
      else vy[c]=0;}}
  for(let j=0;j<NY;j++){const rp=j*NX,rf=j*FX;
    for(let i=0;i<NX;i++){const c=rp+i;
      if(mat[c]){p[c]=0;I[c]=0;continue}
      const v=p[c]*dp[c]-S*(vx[rf+i+1]-vx[rf+i]+vy[c+NX]-vy[c]);p[c]=v;I[c]+=b*(v*v-I[c]);}}
  s.n++;s.t=s.n*s.dt;
  emit(s);
  for(const m of s.mic)sampleMic(s,m);
}

function newMic(x,y){return {x,y,ring:new Ring(8000),ms:0,det:new Detector(),zc:[],pos:false,env:0,dec:{pk:0,tpk:0,t15:0}}}
function resetMic(m){m.prev=null;m.z=null;m.ring.clear();m.ms=0;m.det.reset();m.zc=[];m.env=0;m.dec={pk:0,tpk:0,t15:0}}
function trigMic(m,s){if(m.det.ev.some(e=>e.done)){m.prev=m.det.ev.filter(e=>e.done);m.prevZ=m.z??s.trigOff}m.z=s.lastTrig+s.trigOff;m.det.reset();m.dec={pk:0,tpk:0,t15:0}}
function sampleMic(s,m){
  const v=readAt(s,m.x,m.y),t=s.t;m.ring.push(t,v);
  m.ms+=s.beta*(v*v-m.ms);
  const hy=Math.sqrt(m.ms)*0.25+1e-6;
  if(!m.pos&&v>hy){m.pos=true;m.zc.push(t);if(m.zc.length>16)m.zc.shift()}else if(m.pos&&v<-hy)m.pos=false;
  m.det.feed(t,v,s.thr||0.002,s.quiet||0.01,true);
  m.env+=(s.be||0.05)*(v*v-m.env);
  const d=m.dec;if(m.env>d.pk){d.pk=m.env;d.tpk=t;d.t15=0}else if(!d.t15&&d.pk>1e-9&&m.env<d.pk*0.0316)d.t15=t;
}
function micDb(m){return m.ms>1e-14?10*Math.log10(m.ms)+DBREF:-Infinity}
function micFreq(m,t){const z=m.zc;if(z.length<4)return 0;const k=z.length-1,f=k/(z[k]-z[0]);if(t-z[k]>3/f)return 0;return f}

</script>
<script>
{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const cv=$('#cv'),ctx=cv.getContext('2d');
let CW=1,CH=1,DPR=1;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const fmt=(v,d=0)=>Number.isFinite(v)?v.toLocaleString('de-AT',{minimumFractionDigits:d,maximumFractionDigits:d}):'–';
const nice=x=>{const p=10**Math.floor(Math.log10(x)),m=x/p;return (m<1.5?1:m<3.5?2:m<7.5?5:10)*p};
const MICCOL=['#7b3cc4','#0f8b8d','#d9822b','#5a6772'];
const MODES={},APP={mode:'',frame:0};
const FONT='"Atkinson Hyperlegible",system-ui,sans-serif';

/* ---------- Farben ---------- */
const C={};

    AU.conv=c.createConvolver();AU.wet=c.createGain();AU.dry=c.createGain();AU.conv.connect(AU.wet);AU.wet.connect(AU.m);AU.dry.connect(AU.m);

function drawScope(el,series,t0,t1,evs,zero){if(zero==null)zero=t0;
  if(!el)return;const r=el.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1),W=Math.max(20,r.width),H=Math.max(20,r.height);
  if(el.width!==Math.round(W*d)||el.height!==Math.round(H*d)){el.width=Math.round(W*d);el.height=Math.round(H*d)}
  const g=el.getContext('2d');g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,W,H);
  const L=8,T=8,B=22,pw=W-16,ph=H-T-B,mid=T+ph/2,span=Math.max(1e-6,t1-t0);
  let mx=1e-4;for(const s of series){const rg=s.ring;for(let k=0;k<rg.len;k++){const j=rg.at(k),t=rg.t[j];if(t>=t0&&t<=t1){const a=Math.abs(rg.v[j]);if(a>mx)mx=a}}}
  g.strokeStyle=cs('line');g.lineWidth=1;g.beginPath();g.moveTo(L,mid);g.lineTo(L+pw,mid);g.stroke();
  g.font=`12px ${FONT}`;g.fillStyle=cs('mut');g.textAlign='center';
  const ms=span*1000,st=nice(ms/4),z=(zero-t0)*1000;for(let v=Math.ceil(-z/st)*st;v+z<=ms+1e-9;v+=st){const x=L+(v+z)/ms*pw;g.beginPath();g.moveTo(x,T+ph);g.lineTo(x,T+ph+4);g.stroke();g.fillText(fmt(Math.abs(v)<1e-9?0:v,st<1?1:0)+' ms',clamp(x,22,W-22),H-5)}
  if(evs)for(const e of evs){if(e.t<t0||e.t>t1)continue;const x=L+(e.t-t0)/span*pw;g.strokeStyle=e.col;g.setLineDash([3,3]);g.beginPath();g.moveTo(x,T);g.lineTo(x,T+ph);g.stroke();g.setLineDash([])}
  for(const s of series){const rg=s.ring;g.strokeStyle=s.col;g.lineWidth=1.6;g.beginPath();let on=false;
    const stp=Math.max(1,Math.floor(rg.len/(pw*2)));
    for(let k=0;k<rg.len;k+=stp){const j=rg.at(k),t=rg.t[j];if(t<t0||t>t1)continue;const x=L+(t-t0)/span*pw,y=mid-rg.v[j]/mx*ph*.46;if(on)g.lineTo(x,y);else{g.moveTo(x,y);on=true}}
    g.stroke()}
}

{let sd=11;const rnd=()=>(sd=sd*16807%2147483647)/2147483647;const NC=120,NR=9;

  if(HS.fen>0){const wh=Math.min(1.6,Hh*.5),tw=Math.min(B*.9,HS.fen/wh),k=Math.max(1,Math.round(tw/1.8)),w=tw/k,gap=(B-tw)/(k+1);
    for(let i=0;i<k;i++){const y0=gap+i*(w+gap);quad([[0,y0,.9],[0,y0+w,.9],[0,y0+w,.9+wh],[0,y0,.9+wh]],HM.glas.col)}}
  if(HS.absA>0){const ah=Math.min(2,Hh-1),aw=Math.min(L*.92,HS.absA/ah),x0=(L-aw)/2;quad([[x0,0,.8],[x0+aw,0,.8],[x0+aw,0,.8+ah],[x0,0,.8+ah]],HM[HS.absM].col)}
  if(HS.pers>0){const n=Math.min(HS.pers,300),cols=Math.max(1,Math.round(Math.sqrt(n*L/B))),rows=Math.ceil(n/cols);ctx.fillStyle=cs('ink',.75);ctx.beginPath();
    for(let i=0;i<n;i++){const cx=(i%cols+.5)/cols,cy=(Math.floor(i/cols)+.5)/rows,[X,Y]=P(.8+cx*(L-1.6),.8+cy*(B-1.6),1.2);ctx.moveTo(X+3.5,Y);ctx.arc(X,Y,3.5,0,6.283)}ctx.fill()}
  quad([[0,0,Hh],[L,0,Hh],[L,B,Hh],[0,B,Hh]],HM[HS.decke].col,.4);
  ctx.strokeStyle=cs('ink',.55);ctx.setLineDash([4,4]);ctx.beginPath();let q=P(L,B,0);ctx.moveTo(...q);q=P(L,B,Hh);ctx.lineTo(...q);q=P(0,B,Hh);ctx.moveTo(...P(0,B,0));ctx.lineTo(...q);ctx.moveTo(...P(L,0,0));ctx.lineTo(...P(L,0,Hh));ctx.stroke();ctx.setLineDash([]);
  let a=P(L/2,B,0);txt(fmt(L,1)+' m',a[0]-10,a[1]+20,cs('ink'),'right',13,true);a=P(L,B/2,0);txt(fmt(B,1)+' m',a[0]+12,a[1]+18,cs('ink'),'left',13,true);a=P(L,0,Hh/2);txt(fmt(Hh,1)+' m',a[0]+10,a[1],cs('ink'),'left',13,true);
  txt('T ≈ '+fmt(r.Tm,2)+' s',W-18,40,cs('ink'),'right',narrow?26:34,true);txt('Richtwert '+fmt(r.Ts,2)+' s',W-18,64,cs('mut'),'right',14);
  // Diagramme
  const top=rh+8,ch=H-top-12,cw=narrow?W-32:(W-48)/2;
  const bar=(x0,y0,w,h)=>{const pl=40,pb=24,pt=24,pw=w-pl-8,ph=h-pt-pb,tmax=Math.max(...r.T,r.Ts*1.4)*1.12;txt('Nachhallzeit je Tonhöhe',x0,y0+14,cs('ink'),'left',14,true);
    const Y=t=>y0+pt+ph-t/tmax*ph;ctx.fillStyle=cs('ok',.16);ctx.fillRect(x0+pl,Y(r.Ts*1.2),pw,Y(r.Ts*.8)-Y(r.Ts*1.2));
    ctx.strokeStyle=cs('ok');ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(x0+pl,Y(r.Ts));ctx.lineTo(x0+pl+pw,Y(r.Ts));ctx.stroke();ctx.setLineDash([]);
    const st=nice(tmax/4);ctx.strokeStyle=cs('line');ctx.lineWidth=1;for(let t=0;t<=tmax;t+=st){ctx.beginPath();ctx.moveTo(x0+pl,Y(t));ctx.lineTo(x0+pl+pw,Y(t));ctx.stroke();txt(fmt(t,st<1?1:0)+' s',x0+pl-6,Y(t)+4,cs('mut'),'right',12)}
    const bw2=pw/6;r.T.forEach((t,i)=>{const x=x0+pl+i*bw2+bw2*.18,ww=bw2*.64,out=t>r.Ts*1.2||t<r.Ts*.8;ctx.fillStyle=out?cs('red'):cs('ink');ctx.fillRect(x,Y(t),ww,Y(0)-Y(t));
      txt(fmt(t,t<10?1:0),x+ww/2,Y(t)-5,cs('ink'),'center',12,true);txt(BL[i]+(i===0?' Hz':''),x+ww/2,y0+h-6,cs('mut'),'center',12)})};
  const dec=(x0,y0,w,h)=>{const pl=46,pb=24,pt=24,pw=w-pl-8,ph=h-pt-pb,tmax=Math.max(1,r.Tm*1.25,r.Ts*1.5);txt('Abklingen nach einem Knall (500–1000 Hz)',x0,y0+14,cs('ink'),'left',14,true);
    const X=t=>x0+pl+t/tmax*pw,Y=d=>y0+pt+(-d)/60*ph;ctx.strokeStyle=cs('line');ctx.lineWidth=1;
    for(let d=0;d>=-60;d-=20){ctx.beginPath();ctx.moveTo(X(0),Y(d));ctx.lineTo(X(tmax),Y(d));ctx.stroke();txt(fmt(d)+' dB',X(0)-6,Y(d)+4,cs('mut'),'right',12)}
    const st=nice(tmax/4);for(let t=0;t<=tmax+1e-9;t+=st)txt(fmt(t,st<1?1:0)+' s',X(t),y0+h-6,cs('mut'),'center',12);
    ctx.strokeStyle=cs('ok');ctx.setLineDash([5,4]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(Math.min(tmax,r.Ts)),Y(-60*Math.min(tmax,r.Ts)/r.Ts));ctx.stroke();ctx.setLineDash([]);
    ctx.strokeStyle=cs('ink');ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(X(0),Y(0));const te=Math.min(tmax,r.Tm);ctx.lineTo(X(te),Y(-60*te/r.Tm));ctx.stroke();
    txt('Raum',X(te*.55)+6,Y(-60*te*.55/r.Tm)-6,cs('ink'),'left',12,true);txt('Richtwert',X(Math.min(tmax,r.Ts)*.35)-4,Y(-60*Math.min(tmax,r.Ts)*.35/r.Ts)+16,cs('ok'),'right',12,true);
    if(HS.play&&AU.ctx){const el=AU.ctx.currentTime-HS.play.t0;if(el>=0&&el<=tmax){ctx.fillStyle=cs('red');ctx.beginPath();ctx.arc(X(el),Y(Math.max(-60,-60*el/r.Tm)),6,0,6.283);ctx.fill()}}};
  if(ch>80){if(narrow){bar(16,top,cw,ch/2-4);dec(16,top+ch/2+4,cw,ch/2-4)}else{bar(16,top,cw,ch);dec(32+cw,top,cw,ch)}}
}
MODES.hall={enter(){hLoad(HS.pi)},frame(){tone(0,0)},draw:hDraw,upd(){},down(){},move(){},up(){},key(){}};

/* =====================================================================
   Start, Umschalten, Schleife
   ===================================================================== */
function fit(){const r=$('#cvw').getBoundingClientRect();DPR=Math.min(2,devicePixelRatio||1);CW=Math.max(50,r.width);CH=Math.max(50,r.height);cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}
const ro=new ResizeObserver(()=>fit());ro.observe($('#cvw'));
const themeObs=new MutationObserver(()=>{readCols();if(APP.mode==='hall')hOuts();if(APP.mode==='raum')rPanel()});themeObs.observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readCols)}catch(e){}
function setMode(m){if(!MODES[m])m='welle';if(m===APP.mode)return;APP.mode=m;$$('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.mode===m)));tone(0,0);
  for(const n of AU.nodes){try{n.stop()}catch(e){}}AU.nodes=[];MODES[m].enter()}
$$('.tabs button').forEach(b=>b.onclick=()=>{location.hash=b.dataset.mode;setMode(b.dataset.mode)});
addEventListener('hashchange',()=>setMode(location.hash.slice(1)));
$('#bTon').onclick=()=>setTon(!AU.on);
$('#bFull').onclick=()=>{const d=document;try{if(d.fullscreenElement)d.exitFullscreen();else d.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};
const pos=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}MODES[APP.mode].down(...pos(e))});
cv.addEventListener('pointermove',e=>MODES[APP.mode].move(...pos(e)));
const up=()=>MODES[APP.mode].up();cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key===' '&&e.target.tagName==='BUTTON')return;
  if(e.key===' '||e.key==='Delete'||(e.key==='Backspace'&&APP.mode==='raum')){e.preventDefault();MODES[APP.mode].key(e.key)}});
readCols();fit();setMode(location.hash.slice(1)||'welle');
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;APP.frame++;const M=MODES[APP.mode];
  try{M.frame(dt);M.draw();if(APP.frame%5===0)M.upd()}catch(err){console.error(err)}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
}

</script>
